['pharm','Zweite-Gas-Effekt?','Schnelle Aufnahme großer Mengen N₂O konzentriert das zweite Gas (Volatile, O₂) in der Alveole und erhöht dessen Aufnahme.'],
['pharm','Einteilung Lokalanästhetika?','Ester (Procain, Chloroprocain, Tetracain, Kokain) – Abbau durch Plasmacholinesterase, PABA → Allergien. Amide (Lidocain, Prilocain, Mepivacain, Bupivacain, Ropivacain) – hepatisch. Merkhilfe: Amide haben zwei „i“ im Namen.'],
['pharm','Welche Faktoren bestimmen Wirkeintritt, Potenz und Wirkdauer eines LA?','Wirkeintritt: pKa (nahe 7,4 → schneller), Konzentration. Potenz: Lipophilie. Wirkdauer: Proteinbindung, Vasoaktivität, Adrenalinzusatz.'],
['pharm','Warum wirken LA im entzündeten Gewebe schlecht?','Saures Milieu → mehr ionisierte Form → geringere Membrangängigkeit (nur die nicht-ionisierte Base diffundiert ins Axon).'],
['pharm','Reihenfolge der Nervenblockade durch LA?','B-Fasern (präganglionär sympathisch) > C-/Aδ-Fasern (Schmerz, Temperatur) > Aβ (Berührung) > Aα (Motorik). Rückbildung umgekehrt.'],
['pharm','Welche Medikamente können Pseudocholinesterase-abhängig verlängert wirken?','Succinylcholin, Mivacurium, Ester-LA (Chloroprocain). Verminderte Aktivität bei genetischer Variante, Leberinsuffizienz, Schwangerschaft, Neostigmin, Echothiophat.'],
['pharm','Welche Substanzen verstärken nicht depolarisierende Relaxanzien?','Volatile Anästhetika, Aminoglykoside, Magnesium, Lithium, LA, Ca-Antagonisten; Hypothermie, Azidose, Hypokaliämie, Myasthenie.'],
['pharm','Welche Relaxanzien setzen Histamin frei?','Atracurium, Mivacurium, (Succinylcholin gering). Nicht: Cisatracurium, Rocuronium, Vecuronium.'],
['pharm','Was ist ein Phase-II-Block?','Nach hohen/repetitiven Succinylcholin-Dosen: Block mit Eigenschaften eines nicht depolarisierenden Blocks (Fading im TOF), verlängerte Wirkdauer.'],
['pharm','Welche Anästhetika gelten als MH-Trigger?','Alle volatilen Inhalationsanästhetika (Sevo-, Des-, Isofluran, Halothan) und Succinylcholin. Nicht: N₂O, Propofol, Ketamin, Opioide, ndMR, LA.'],
['pharm','Opioid-Potenzen im Vergleich (Morphin = 1)?','Piritramid 0,7 · Morphin 1 · Alfentanil ~30 · Fentanyl 100 · Remifentanil ~100–200 · Sufentanil 1000.'],
['pharm','Nebenwirkungen von Opioiden?','Atemdepression, Sedierung, Übelkeit/Erbrechen, Obstipation, Harnverhalt, Pruritus, Miosis, Bradykardie, Thoraxrigidität, Sphincter-Oddi-Spasmus, Toleranz, Hyperalgesie, Immunsuppression.'],

// Atemweg & Beatmung
['airway','Parameter der lungenprotektiven Beatmung?','VT 6–8 ml/kg IBW, PEEP ≥ 5, Plateaudruck < 30 cmH₂O, Driving Pressure < 15 cmH₂O, niedrigste ausreichende FiO₂, Rekrutierung bei Bedarf.'],
['airway','Welche Larynxmaske der 2. Generation und warum?','z. B. LMA ProSeal/Supreme, i-gel: Drainagekanal für Magen (Aspirationsschutz), höherer Dichtdruck (Beatmung bis ~25–30 cmH₂O), Plan B im DAS-Algorithmus.'],
['airway','Welche Innervation hat der Larynx?','N. laryngeus superior: R. internus (sensibel oberhalb der Stimmlippen), R. externus (M. cricothyroideus). N. laryngeus recurrens: gesamte übrige Kehlkopfmuskulatur + Sensibilität unterhalb der Stimmlippen. Alle aus dem N. vagus.'],
['airway','Einseitige Recurrensparese vs. beidseitig?','Einseitig: Heiserkeit. Beidseitig: Stimmlippen in Paramedianstellung → inspiratorischer Stridor, Atemnot → ggf. Reintubation/Tracheotomie.'],
['airway','Wie wird die Tubuslage sicher bestätigt?','Kapnographie mit kontinuierlicher CO₂-Kurve über mehrere Atemzüge (Goldstandard). „No trace = wrong place“ (Ausnahme: Kreislaufstillstand mit sehr niedrigem CO₂). Ergänzend Auskultation, Sicht, Sono.'],
['airway','Apnoische Oxygenierung?','Fortgesetzte O₂-Zufuhr (Nasenbrille 15 l/min oder High-Flow) während Apnoe → Massenfluss von O₂ in die Alveolen bei offenem Atemweg. Verlängert die sichere Apnoezeit.'],
['airway','Sichere Apnoezeit bei gesunden Erwachsenen nach Präoxygenierung?','Ca. 6–8 min bis SpO₂ 90 % (mit Raumluft nur ~1 min). Deutlich kürzer bei Adipositas, Schwangerschaft, Kindern, Sepsis.'],
['airway','Indikationen für eine Wachintubation?','Bekannt schwieriger Atemweg, Obstruktion (Tumor, Abszess), instabile HWS mit schwierigem Atemweg, massive Adipositas mit weiteren Prädiktoren, eingeschränkte Mundöffnung.'],
['airway','Was bedeutet Auto-PEEP und wie erkennt man ihn?','Unvollständige Exspiration → intrinsischer PEEP (Obstruktion, hohe AF). Flow-Kurve erreicht vor Inspiration nicht die Nulllinie; exspiratorischer Hold. Folgen: Hypotonie, Barotrauma. Therapie: AF↓, I:E verlängern, diskonnektieren.'],

// Regionalanästhesie
['ra','Warum Punktion der Spinalanästhesie unterhalb L2?','Conus medullaris endet beim Erwachsenen auf Höhe L1/L2 (Neugeborene L3).'],
['ra','Bezold-Jarisch-Reflex?','Kardioinhibitorischer Reflex bei stark verminderter Vorlast (leerer Ventrikel kontrahiert kräftig → Mechanorezeptoren) → Bradykardie, Vasodilatation, Hypotonie bis Asystolie. Typisch nach Spinalanästhesie.'],
['ra','Welche Dermatome sind für eine Sectio erforderlich?','Sensible Blockade bis Th4 (Mamillen) – wegen peritonealer Manipulation.'],
['ra','Warnsymptome eines spinalen/epiduralen Hämatoms?','Neue/zunehmende Rückenschmerzen, sensible/motorische Defizite über die erwartete Blockade hinaus, Blasen-/Mastdarmstörung. → Sofort MRT, Neurochirurgie; Dekompression innerhalb von 8 h entscheidend.'],
['ra','Therapie des postpunktionellen Kopfschmerzes?','Analgetika (Paracetamol, NSAR), Koffein, Hydratation, Sphenopalatinum-Block; bei Persistenz > 24–48 h epiduraler Blutpatch (15–20 ml Eigenblut).'],
['ra','Unterschied Spinal- vs. Periduralanästhesie?','SPA: intrathekal, kleine LA-Menge, schneller Wirkeintritt (Minuten), dichter Block, Einzelinjektion. PDA: epidural, großes Volumen, langsamer Wirkeintritt, segmental, katheterfähig, Differenzialblock.'],
['ra','Welche Nerven werden bei der interskalenären Blockade fast immer mitblockiert?','N. phrenicus (nahezu 100 %) → ipsilaterale Zwerchfellparese; KI bei kontralateraler Phrenicusparese/schwerer Lungenerkrankung. Zudem Horner-Syndrom, N. laryngeus recurrens möglich.'],
['ra','Welcher Block für Knie-TEP ohne Quadricepsschwäche?','Adduktorenkanal-Block (N. saphenus) ± iPACK statt Femoralisblock.'],
['ra','Was ist ein TAP-Block?','Transversus-abdominis-plane-Block: LA zwischen M. obliquus internus und M. transversus abdominis → Blockade der ventralen Äste Th6–L1, Analgesie der Bauchwand (nicht viszeral).'],
['ra','Grenzwerte LA-Maximaldosen (typisch)?','Lidocain 3–4,5 mg/kg (ohne) / 7 mg/kg (mit Adrenalin), Prilocain 6 (8) mg/kg, Mepivacain 4 mg/kg, Bupivacain 2 mg/kg, Ropivacain 3 mg/kg. Stets Fachinfo beachten.'],

// Kinder
['kids','Tubusgröße bei einem 6-jährigen Kind?','Mit Cuff: 6/4 + 3,5 = 5,0 mm ID; ohne Cuff: 5,5 mm. Tiefe oral ~ 6/2 + 12 = 15 cm.'],
['kids','Geschätztes Gewicht eines 4-Jährigen?','(4 + 4) × 2 = 16 kg.'],
['kids','Holliday-Segar für ein 25-kg-Kind?','10 × 4 + 10 × 2 + 5 × 1 = 65 ml/h.'],
['kids','Warum desaturieren Säuglinge so schnell?','O₂-Verbrauch 6–8 ml/kg/min (Erwachsene 3–4), kleine FRC, hohe Closing Capacity, hohe Atemarbeit.'],
['kids','Therapie des Laryngospasmus beim Kind?','Stimulation stoppen, CPAP mit 100 % O₂, Larson-Manöver, Propofol 1 mg/kg, Succinylcholin 0,5–1 mg/kg i.v. (4 mg/kg i.m.) + Atropin bei Bradykardie.'],
['kids','Wann ist bei Infekten der oberen Atemwege Vorsicht geboten?','Bis 2–4 Wochen nach Infekt erhöhtes Risiko für Laryngo-/Bronchospasmus. Risikoabwägung (Fieber, eitriges Sekret, Giemen → verschieben). Wenn operiert: Larynxmaske statt Tubus, Propofol, erfahrenes Personal.'],
['kids','Aufwachdelir (Emergence Delirium) – Risikofaktoren und Prophylaxe?','Alter 2–5 J, Sevofluran/Desfluran, HNO-/Augen-OPs, präop. Angst, Schmerz. Prophylaxe: TIVA, Dexmedetomidin, Clonidin, Propofol-Bolus am Ende, gute Analgesie.'],
['kids','Blutvolumen und maximaler Blutverlust beim Säugling (7 kg, Hk 35 → 25)?','BV ≈ 7 × 80 = 560 ml. MABL = BV × (Hk0 − Hkmin)/Hk0 = 560 × 10/35 ≈ 160 ml.'],

// Geburtshilfe
['obst','Aortokavales Kompressionssyndrom?','Kompression von V. cava inferior (und Aorta) durch den graviden Uterus in Rückenlage ab ~20. SSW → Vorlast↓, Hypotonie, fetale Hypoxie. Prophylaxe: Linksseitenlage 15°/Uterusverdrängung nach links.'],
['obst','Warum ist die Schwangere schwierig zu intubieren und zu oxygenieren?','Schleimhautödem, große Brüste, Gewichtszunahme, FRC −20 %, O₂-Verbrauch +20 %, Aspirationsrisiko (Progesteron → UÖS-Tonus↓, Magendruck↑).'],
['obst','Welche Vasopressoren bei Spinal-Hypotonie zur Sectio?','Phenylephrin (Mittel der Wahl, prophylaktischer Perfusor), alternativ Noradrenalin in niedriger Dosis; Akrinor in DE verbreitet. Ephedrin → fetale Azidose.'],
['obst','HELLP-Syndrom?','Hemolysis, Elevated Liver enzymes, Low Platelets – schwere Verlaufsform der Präeklampsie. Therapie: Entbindung, Magnesium, RR-Kontrolle. Thrombozytenzahl vor RA prüfen.'],
['obst','Maternaler Kreislaufstillstand – Besonderheiten?','Manuelle Uterusverdrängung nach links, Thoraxkompression normal, frühe Intubation, i.v.-Zugang oberhalb des Zwerchfells; ab ~20. SSW Notsectio (Resuscitative Hysterotomy) innerhalb 5 min nach Stillstand.'],
['obst','Medikamente mit KI in der Stillzeit/Schwangerschaft relevant?','NSAR im 3. Trimenon (Ductus-Verschluss), Metamizol 3. Trimenon, ACE-Hemmer, Methylergometrin bei Präeklampsie. Meiste Anästhetika in der Stillzeit unproblematisch (weiter stillen).'],

// Notfälle
['notfall','Frühestes Zeichen der malignen Hyperthermie?','Unerklärter Anstieg des etCO₂ trotz Steigerung des Atemminutenvolumens, begleitet von Tachykardie. Hyperthermie ist ein Spätzeichen!'],
['notfall','Dantrolen – Dosis, Zubereitung?','2,5 mg/kg i.v., Repetition 1 mg/kg bis Symptome sistieren. 20-mg-Flaschen mit 60 ml Aqua (70-kg-Patient ≈ 9 Flaschen initial). Agilus 120 mg in 20 ml.'],
['notfall','Lipidtherapie bei LAST?','20 % Lipid: Bolus 1,5 ml/kg über 1 min, dann 15 ml/kg/h; nach 5 min bis zu 2 weitere Boli und Rate 30 ml/kg/h; max. 12 ml/kg.'],
['notfall','Anaphylaxie-Grade nach Ring & Messmer?','I: Haut; II: messbare, nicht lebensbedrohliche Kreislauf-/Atemreaktion; III: Schock, lebensbedrohlicher Bronchospasmus; IV: Kreislauf-/Atemstillstand.'],
['notfall','Wann Tryptase abnehmen?','30 min bis 2 h nach Beginn (Peak 1–2 h) und Basalwert nach ≥ 24 h. Anstieg > 20 % + 2 µg/l über Basalwert spricht für Mastzellaktivierung.'],
['notfall','4 H und HITS?','Hypoxie, Hypovolämie, Hypo-/Hyperkaliämie/metabolisch, Hypothermie; Herzbeuteltamponade, Intoxikation, Thrombose (kardial/pulmonal), Spannungspneumothorax.'],
['notfall','Skalpell-Bougie-Tubus: Schritte?','Laryngeal Handshake → Querschnitt durch Membrana cricothyroidea → Skalpell 90° drehen (Schneide kaudal) → Bougie an der Klinge vorbei → Tubus 6,0 mit Cuff → Kapnographie.'],
['notfall','Zentrales anticholinerges Syndrom – Therapie?','Physostigmin 0,04 mg/kg langsam i.v. (Erw. 1–2 mg). Ausschluss anderer Ursachen (Hypoxie, Hypoglykämie, Hyperkapnie).'],
['notfall','Therapie Hyperkaliämie mit EKG-Veränderungen?','1. Calcium (Membranstabilisierung), 2. Insulin 10 IE + Glukose 25 g, Salbutamol, ggf. Bicarbonat (Shift), 3. Elimination (Furosemid, Dialyse).'],
['notfall','Energie der Defibrillation bei Kindern?','4 J/kg (ERC), unabhängig von der Schocknummer.'],

// Intensiv
['icu','Sepsis-Definition (Sepsis-3)?','Lebensbedrohliche Organdysfunktion durch dysregulierte Wirtsantwort auf Infektion; SOFA-Anstieg ≥ 2. Septischer Schock: Vasopressorbedarf für MAP ≥ 65 und Laktat > 2 mmol/l trotz adäquater Volumengabe.'],
['icu','Maßnahmenbündel der ersten Stunde (Hour-1-Bundle) Sepsis?','Laktat messen, Blutkulturen vor Antibiose, Breitspektrum-Antibiose, 30 ml/kg Kristalloid bei Hypotonie/Laktat ≥ 4, Vasopressor für MAP ≥ 65.'],
['icu','ARDS – Berlin-Definition?','Beginn ≤ 1 Woche, bilaterale Infiltrate, nicht vollständig kardial erklärt, Oxygenierung mit PEEP ≥ 5: mild 200–300, moderat 100–200, schwer ≤ 100 mmHg (paO₂/FiO₂).'],
['icu','ARDS-Therapie – was ist evidenzbasiert?','VT 6 ml/kg IBW, Pplat ≤ 30, höherer PEEP bei moderat/schwer, Bauchlage ≥ 16 h bei P/F < 150, restriktive Flüssigkeit, ggf. Relaxation früh, ECMO bei Versagen.'],
['icu','qSOFA?','AF ≥ 22/min, veränderter Bewusstseinszustand (GCS < 15), syst. RR ≤ 100 mmHg – ≥ 2 Punkte = erhöhtes Risiko (Screening, nicht Diagnose).'],
['icu','Hirntoddiagnostik in DE – Voraussetzungen?','Akute schwere Hirnschädigung, Ausschluss reversibler Ursachen (Intoxikation, Relaxation, Hypothermie, metabolisch, Schock); klinische Symptome (Koma, Hirnstammareflexe erloschen, Apnoe-Test) durch 2 Fachärzte; Irreversibilität durch Wartezeit oder apparative Diagnostik.'],

['periop','Wie lange elektive OP nach Myokardinfarkt?','Nach ESC: mindestens 60 Tage nach MI ohne Revaskularisation; nach Stent abhängig von DAPT (BMS/DES 6 Monate elektiv, nach ACS 12 Monate).'],
['periop','Revised Cardiac Risk Index (Lee)?','6 Faktoren: Hochrisiko-OP, KHK, Herzinsuffizienz, zerebrovaskuläre Erkrankung, insulinpflichtiger Diabetes, Kreatinin > 2 mg/dl.'],

['periop','Schlafapnoe – perioperative Risiken?','Schwierige Maskenbeatmung/Intubation, Opioidsensitivität, postop. Hypoxie. STOP-BANG-Screening, CPAP mitbringen, opioidsparend, Oberkörperhochlage, verlängerte Überwachung.'],
['periop','Postoperatives Delir – Risikofaktoren und Prävention?','Alter, Demenz, Polypharmazie, Anticholinergika/Benzodiazepine, tiefe Narkose (Burst-Suppression), Schmerzen. Prävention: Screening, BIS-gesteuerte Narkose, Brille/Hörgerät, Reorientierung, frühe Mobilisation, Benzodiazepine vermeiden.'],
['periop','Was ist ERAS?','Enhanced Recovery After Surgery: verkürzte Nüchternheit/Kohlenhydratdrink, multimodale opioidsparende Analgesie, PONV-Prophylaxe, zielgerichtete Flüssigkeitstherapie, Normothermie, frühe Mobilisation und Ernährung.']

 q:[['Verdachtsdiagnose und DD?','Maligne Hyperthermie. DD: flache Narkose, Sepsis, Hyperthyreose, Phäochromozytom, CO₂-Insufflation, Rückatmung/erschöpfter Kalk.'],
    ['Sofortmaßnahmen?','Hilfe, Trigger stopp, FiO₂ 1,0 mit > 10 l/min, Aktivkohlefilter, Hyperventilation, TIVA, Dantrolen 2,5 mg/kg (= 50 mg → 2,5 Flaschen à 20 mg), Kühlen, OP beenden.'],
    ['Welche Laborwerte erwarten Sie?','Gemischte Azidose, Hyperkaliämie, Laktat ↑, CK ↑↑, Myoglobin ↑, ggf. DIC.'],
    ['Was ist bei Masseterspasmus ohne weitere Zeichen zu tun?','OP-Fortsetzung umstritten; bei Fortsetzung triggerfrei, engmaschige Überwachung (CK, Myoglobin, etCO₂, Temperatur) über 12–24 h, Abklärung empfohlen.'],
    ['Wie wird die MH-Disposition abgeklärt?','In-vitro-Kontrakturtest (IVCT) am Muskelbiopsat (Halothan/Koffein) in einem MH-Zentrum; genetisch RYR1/CACNA1S/STAC3. Familienberatung.']]},

{t:'Anaphylaxie nach Antibiotikagabe', v:'45-jährige Patientin zur laparoskopischen Cholezystektomie. 3 min nach Cefazolin: RR 60/30, HF 140, Beatmungsdruck 38 cmH₂O, etCO₂ fällt, kein Exanthem.',
 q:[['Diagnose und Grad?','Anaphylaxie Grad III (Schock + Bronchospasmus). Hautsymptome fehlen intraoperativ häufig.'],
    ['Therapie?','Hilfe, Stopp des Auslösers, FiO₂ 1,0, Adrenalin 50–100 µg-Boli titriert, dann Perfusor, Volumen 1–2 l Kristalloid rasch, Beine hoch, Bronchospasmus: Salbutamol; sekundär Dimetinden, Prednisolon. OP-Abbruch erwägen.'],
    ['Was bei fehlendem Ansprechen auf Adrenalin?','Adrenalin-Perfusor steigern, Noradrenalin, Vasopressin, Glukagon bei β-Blockern, Volumen, Echo, ECLS; an Ursachen-Alternativen denken.'],
    ['Diagnostik danach?','Tryptase (30 min–2 h und nach 24 h), Dokumentation, Anaphylaxie-Pass, Allergologie nach 4–6 Wochen (Haut-Prick, Intrakutan, ggf. Provokation).']]},

{t:'Unerwartet schwieriger Atemweg', v:'Adipöse Patientin (BMI 42) zur elektiven OP. Nach Einleitung mit Propofol/Sufentanil/Rocuronium gelingt die Intubation mit dem Videolaryngoskop zweimal nicht, SpO₂ 88 %.',
 q:[['Wie gehen Sie vor?','Plan A: max. ein weiterer Versuch durch den Erfahrensten mit optimierter Lagerung/Bougie; Oxygenierung zwischen Versuchen. Hilfe rufen.'],
    ['Intubation scheitert endgültig – nächster Schritt?','Plan B: SGA der 2. Generation (max. 3 Versuche). Bei Erfolg: Stop and think – aufwachen lassen (Sugammadex 16 mg/kg), fiberoptisch durch die SGA intubieren oder bei Dringlichkeit weiter.'],
    ['SGA gelingt nicht, Maskenbeatmung unmöglich, SpO₂ 70 %?','CICO erklären, Plan D: Skalpell-Bougie-Tubus-Koniotomie. Volle Relaxation, weiter O₂ von oben.'],
    ['Welche Präventionsmöglichkeiten hätte es gegeben?','Rampenlagerung, Präoxygenierung mit CPAP/HFNO, apnoische Oxygenierung, Atemwegsplanung, Markierung der Membrana cricothyroidea per Sono, ggf. Wachintubation.']]},

{t:'Sectio bei Präeklampsie', v:'32-jährige Erstgebärende, 36. SSW, RR 175/110, Kopfschmerzen, Thrombozyten 85/nl. Sectio Kategorie 2 geplant.',
 q:[['Welche Anästhesieform?','Rückenmarksnahe Anästhesie bevorzugt (Spinal), sofern Thrombozyten stabil ≥ 75–80/nl, keine Gerinnungsstörung (Einzelfallentscheidung). Vorteil: kein Atemweg, keine hypertensive Intubationsreaktion.'],
    ['Was ist vorab zu tun?','Magnesium-Prophylaxe (4–6 g Bolus, 1–2 g/h), RR-Senkung auf < 160/110 (Urapidil, Nifedipin), Labor (Thrombozytentrend, Gerinnung, Leberwerte), Flüssigkeit restriktiv (Lungenödemgefahr).'],
    ['Falls ITN nötig – worauf achten?','Blutdruckspitzen bei Laryngoskopie dämpfen (Remifentanil 1 µg/kg, Pädiater informieren), Larynxödem → kleinerer Tubus, Magnesium verstärkt Relaxanzien, Uterotonika: kein Methylergometrin.'],
    ['Postoperativ?','Intensivüberwachung/IMC, Magnesium 24 h, RR-Kontrolle, Eklampsiegefahr bis 48 h, HELLP-Kontrolle.']]},

{t:'LA-Intoxikation nach Plexusblockade', v:'Patient, 65 kg, erhält eine Interskalenärblockade mit 40 ml Ropivacain 0,75 % (300 mg). Nach 10 min Unruhe, Metallgeschmack, dann tonisch-klonischer Krampfanfall.',
 q:[['Bewertung der Dosis?','300 mg ≈ 4,6 mg/kg – über der empfohlenen Maximaldosis (~3 mg/kg); Interskalenärregion gut vaskularisiert.'],
    ['Management?','Hilfe, Oxygenierung/Atemweg (Hypoxie/Azidose verschärfen Toxizität), Midazolam gegen Krampf, Lipid 20 % 1,5 ml/kg (≈ 100 ml) Bolus, dann 15 ml/kg/h (≈ 1000 ml/h), Monitoring, Reanimationsbereitschaft.'],
    ['Was ändert sich bei Kreislaufstillstand?','ALS mit Adrenalin ≤ 1 µg/kg, kein Vasopressin/Ca-Antagonisten/β-Blocker/Lidocain, prolongierte Reanimation > 60 min, ECLS.'],
    ['Wie hätte man vorbeugen können?','Sonographie, geringeres Volumen (interskalenär 10–20 ml genügen), fraktionierte Injektion mit Aspiration, Dosis nach Körpergewicht, Testdosis mit Adrenalin, Monitoring.']]},

{t:'Kind mit Laryngospasmus bei Ausleitung', v:'3-jähriges Kind (14 kg) nach Adenotomie. Beim Absaugen in flacher Narkose plötzlicher Stridor, dann keine Atemgeräusche, SpO₂ fällt auf 75 %, HF 80.',
 q:[['Diagnose?','Kompletter Laryngospasmus mit Hypoxie und beginnender Bradykardie.'],
    ['Stufentherapie?','Reiz stopp, FiO₂ 1,0 + CPAP, Esmarch/Larson; Propofol 1 mg/kg (≈ 14 mg); persistiert: Succinylcholin 0,5–1 mg/kg i.v. (7–14 mg) + Atropin 0,02 mg/kg (0,28 mg); ohne Zugang Succinylcholin 4 mg/kg i.m.'],
    ['Warum Bradykardie?','Hypoxie – bei Kindern ist Bradykardie ein Hypoxiezeichen bis zum Beweis des Gegenteils.'],
    ['Prophylaxe?','Extubation tief oder vollständig wach (nicht im Exzitationsstadium), Absaugen in tiefer Narkose, Lidocain topisch/i.v., Infekt-Anamnese beachten.']]},

{t:'Hyperkaliämie bei Dialysepatient', v:'Dialysepatient zur Shunt-Revision, letzte Dialyse vor 3 Tagen. Präop K⁺ 6,8 mmol/l, EKG: spitze T-Wellen.',
 q:[['Operieren?','Elektiv: nein – zuerst Dialyse. Notfall: K⁺ senken, Succinylcholin vermeiden.'],
    ['Akuttherapie?','Calcium (CaCl 10 % 10 ml), Insulin 10 IE + 25 g Glukose, Salbutamol vernebelt, Bicarbonat bei Azidose; Dialyse als definitive Therapie.'],
    ['Welche Anästhesie wäre günstig?','Regionalanästhesie (axilläre Plexusblockade) – vermeidet Relaxanzien/Atemweg, verbessert Shuntfluss durch Sympathikolyse.'],
    ['Welche Medikamente sind problematisch?','Succinylcholin, Morphin (M6G-Kumulation), Pethidin, NSAR, Sugammadex (bei CrCl < 30 nicht empfohlen); bevorzugt Cisatracurium, Remifentanil, Hydromorphon/Piritramid titriert.']]}
];

remifentanil:['limit','1–12 J (Narkose)','Allgemeinanästhesie bei Kindern 1–12 Jahre zugelassen (Aufrechterhaltung, Start 0,25 µg/kg/min). Einleitung zusammen mit i.v.-Anästhetikum nicht untersucht. Unter 1 Jahr nicht empfohlen (unzureichende Daten). Intensivstation Kinder: keine Daten.',[['Ultiva – Fachinformation (Juni 2024)',FI('007585')]]],
alfentanil:['ok','ab Geburt','Indiziert bei Neugeborenen, Kleinkindern, Kindern und Jugendlichen. Kinder: Einleitung 10–20 µg/kg, Nachinjektionen 5–10 µg/kg. Neugeborene: engmaschige Überwachung (Atemdepression, variable Kinetik).',[['Alfentanil-hameln – Fachinformation',FI('009923/alfentanil-hameln-0-5-mg-ml-injektionsloesung')]]],
morphin:['ok','Kinder (Vorsicht < 1 J)','Zur Anwendung bei Kindern und Erwachsenen. Kinder i.v. 0,05–0,1 mg/kg, i.m./s.c. 0,05–0,2 mg/kg (max. 15 mg). Bei Kindern unter 1 Jahr besondere Vorsicht (Atemdepression).',[['Morphin Merck 10/20 mg – Fachinformation',FI('003863/morphin-merck-r-10-mg-20-mg')]]],

hydromorphon:['limit','ab 12 Monaten','Palladon injekt: Kinder ab 12 Monaten < 50 kg Anfangsdosis 0,015 mg/kg alle 3–4 h. Unter 12 Monaten nur nach sorgfältiger Nutzen-Risiko-Abwägung.',[['Palladon injekt – Fachinformation (Mundipharma)','https://de.mundipharma.com/sites/mundi-pharma-ger/files/mundipharma-ger/fachinformationen/FI_Palladon_injekt_2mg%2010mg%20100mg_November2025.pdf']]],

rocuronium:['limit','ab Geburt (RSI nicht empfohlen)','Neugeborene bis Jugendliche: Intubationsdosis wie Erwachsene 0,6 mg/kg. Blitzeinleitung bei pädiatrischen Patienten laut Fachinformation nicht empfohlen (begrenzte Erfahrung) – in der Praxis dennoch verbreitet (off-label).',[['Rocuronium Inresa – Fachinformation',FI('022792')]]],
cisatracurium:['limit','ab 1 Monat','Zugelassen für Kinder ab 1 Monat (Intubation 0,15 mg/kg). Bei Neugeborenen nicht empfohlen (nicht untersucht).',[['Nimbex – Fachinformation',FI('000763/nimbex-5-mg-10-mg')]]],
mivacurium:['limit','ab 2 Monaten','Säuglinge 2–6 Monate: Intubation 0,15 mg/kg; Kinder 7 Monate–12 Jahre: 0,2 mg/kg. Unter 2 Monaten nicht empfohlen.',[['Mivacron – Fachinformation',FI('000164/mivacron-10-mg-20-mg')]]],
sugammadex:['ok','ab Geburt (Routine)','Routineantagonisierung von Rocuronium bei Kindern ab Geburt bis 17 Jahre (2 mg/kg bei T2, 4 mg/kg bei 1–2 PTC; ggf. auf 10 mg/ml verdünnen). Sofortige Aufhebung (16 mg/kg) nur für Erwachsene.',[['Bridion – EPAR/Produktinformation (EMA)','https://www.ema.europa.eu/en/documents/product-information/bridion-epar-product-information_en.pdf']]],

atropin:['ok','Kinder (Präparat beachten)','Prämedikation 0,01 mg/kg i.v. (max. 0,5 mg) bzw. 0,02 mg/kg i.m.; Bradykardie 0,02 mg/kg i.v. (max. 0,6 mg). Die 0,5-mg/ml-Lösung ist laut Fachinfo nicht für Früh-/Neugeborene < 3 kg geeignet (Dosiergenauigkeit) – niedriger konzentrierte Präparate verwenden.',[['Atropinsulfat Inresa 0,5 mg/ml – Fachinformation',FI('025785/atropinsulfat-inresa-0-5-mg-ml-injektionsloesung')]]],
glycopyrronium:['ok','Kinder und Jugendliche','Indiziert für Erwachsene, Kinder und Jugendliche; Narkoseprämedikation 4–8 µg/kg (max. 0,2 mg). Keine konkrete Altersgrenze genannt.',[['Robinul zur Injektion – Fachinformation (Nov. 2023)','https://www.esteve.com/GetFichero.do?idi=8&zon=1&con=7966&fichero=Ar_8_1_7966_MPP_2.pdf']]],
flumazenil:['limit','ab > 1 Jahr','Aufhebung einer Benzodiazepin-Sedierung bei Kindern älter als 1 Jahr: 0,01 mg/kg (max. 0,2 mg) über 15 s, Wiederholung bis max. 0,05 mg/kg bzw. 1 mg.',[['Anexate – Fachinformation',FI('003058/anexate-r')]]],
sevofluran:['ok','Kinder (Einleitung + Erhaltung)','Einleitung und Aufrechterhaltung bei Erwachsenen und Kindern. MAC altersabhängig (Kinder < 3 J bis 3,3 %). Narkosetiefe bei Kindern begrenzen (Krampfanfälle beschrieben); Hyperkaliämie bei neuromuskulären Erkrankungen.',[['Sevorane – Fachinformation (Jan. 2026)',FI('000915/sevorane-r')]]],

prilocain:['limit','nicht < 6 Monate','Xylonest: bei Kindern unter 6 Monaten kontraindiziert (Methämoglobinämie). Unter 12 J keine allgemeinen Dosisempfehlungen. Takipril (hyperbar, spinal): bei Kindern und Jugendlichen nicht empfohlen.',[['Xylonest 2 % – Fachinformation',FI('004922')],['Takipril – Fachinformation',FI('012519/takipril-r-20-mg-ml-injektionsloesung')]]],
mepivacain:['limit','nicht < 6 Wochen','Nicht bei Neugeborenen und Säuglingen unter 6 Wochen (verminderte hepatische Elimination). Kinder 2 Monate–12 J: niedrig konzentrierte Lösungen; für 2 %-Mehrdosisflasche keine Kinderdosierung.',[['Scandicain 2 % – Fachinformation',FI('004890')]]],
ropivacain:['limit','2 mg/ml ab Geburt','Naropin 2 mg/ml: Kaudalblock (2 mg/kg in 1 ml/kg) und epidurale Infusion bei Termingeborenen bis 12 J (0–6 Mon. 0,2 mg/kg/h, 1–12 J 0,4 mg/kg/h); periphere Blockaden ab 1 Jahr (1–1,5 mg/kg). Naropin 7,5/10 mg/ml: für Kinder ≤ 12 J nicht belegt.',[['Naropin – Fachinformation (Feb. 2026)',FI('007856/naropin-r')]]],
bupivacain:['limit','ab 1 Jahr (eingeschränkt)','Carbostesin 0,5 %: < 1 Jahr nicht erwiesen; 1–12 J nur akute Schmerztherapie (bis 2 mg/kg, größere Nervenblockaden nicht geprüft); > 12 J wie Erwachsene.',[['Carbostesin 0,5 % – Fachinformation',FI('006274')]]],
chloroprocain:['no','nur Erwachsene','Ampres: Spinalanästhesie bei Erwachsenen; Sicherheit und Wirksamkeit bei Kindern und Jugendlichen nicht erwiesen.',[['Ampres 10 mg/ml – Fachinformation',FI('020015/ampres-10-mg-ml-injektionsloesung')]]],
noradrenalin:['na','keine Angaben','Die Fachinformation (Arterenol) enthält keinen Abschnitt zu Kindern und Jugendlichen. Anwendung bei Kindern nach pädiatrischen Standards (off-label).',[['Arterenol – Fachinformation',FI('000167/arterenol-r-1-ml-25-ml')]]],
adrenalin:['ok','Kinder und Säuglinge','Reanimation 0,01 mg/kg i.v./i.o. (alle 3–5 min). Anaphylaxie i.v. 0,1 ml/kg der 1:10 000-Lösung über 1–2 min; i.m. 0,01 mg/kg, max. 0,3 mg pro Injektion bei Kindern/Jugendlichen. Infusion 0,05–0,5 µg/kg/min.',[['Suprarenin – Fachinformation',FI('001990/suprarenin-r-ampullen-durchstechflasche')]]],
akrinor:['na','keine Angaben','Die Fachinformation enthält keine Angaben zu Kindern und Jugendlichen.',[['Akrinor – Fachinformation',FI('014341/akrinor-r-200-mg-2-ml-10-mg-2-ml-injektionsloesung')]]],
urapidil:['no','nicht < 5 Jahre','Ebrantil i.v.: nicht bei Kindern unter 5 Jahren; bei älteren Kindern keine Untersuchungen.',[['Ebrantil i.v. 25 mg – Fachinformation',FI('000693/ebrantil-r-i-v-25-mg')]]],
esmolol:['no','nicht < 18 J','Brevibloc ist für Kinder und Jugendliche bis 18 Jahre nicht indiziert; keine Dosierungsempfehlung.',[['Brevibloc – Fachinformation (Baxter)','https://www.baxter.de/sites/g/files/ebysai1301/files/2019-01/brevibloc_10_mg_ml_infusionsloesung_fs.pdf']]],
amiodaron:['no','nicht belegt; < 3 J KI','Cordarex i.v.: Unbedenklichkeit und Wirksamkeit bei Kindern nicht nachgewiesen; bei Früh-/Neugeborenen, Säuglingen und Kindern bis 3 Jahre wegen Benzylalkohol kontraindiziert. Reanimationsleitlinien (ERC) empfehlen 5 mg/kg – Präparat ohne Benzylalkohol beachten.',[['Cordarex Injektionslösung – Fachinformation',FI('008370/cordarex-r-injektionsloesung')]]],

};

function setKg(v){
  const n = parseFloat(String(v).replace(',','.'));
  if (!isFinite(n) || n <= 0 || n > 300) return;
  S.kg = n; store.set('kg', n);
  document.querySelectorAll('[data-kg]').forEach(i => { if (i !== document.activeElement) i.value = n; });
  document.querySelectorAll('[data-kgtxt]').forEach(el => { el.textContent = fmt(n); });
  document.querySelectorAll('[data-calc]').forEach(el => { el.textContent = calcText(JSON.parse(el.dataset.calc)); });
  if (S.tab === 'calc') refreshCalc();
}

/* Dosis-Berechnung: [label, text, lo, hi, unit, max] */
function calcText(d){
  if (d[2] == null) return '';
  let lo = d[2]*S.kg, hi = d[3]*S.kg, cap = false;
  if (d[5] != null){ if (hi > d[5]){ hi = d[5]; cap = true; } if (lo > d[5]) lo = d[5]; }
  return (lo === hi ? fmt(lo) : fmt(lo)+'–'+fmt(hi)) + ' ' + d[4] + (cap ? ' (max.)' : '');
}

/* ================= Navigation ================= */
/* Verlauf: interner Stapel + Browser-History (Zurück-Wischgeste, Zurück-Taste) */
const STACK = [];
let popPending = null;
const snap = () => ({tab:S.tab, view:S.view, emMode:S.emMode, q:S.q, y:window.scrollY});
function go(tab, view, opts){
  opts = opts || {};
  STACK.push(snap());
  try { history.pushState({k:STACK.length}, ''); } catch(e){}
  S.tab = tab; S.view = view || null; store.set('tab', tab);
  S.emMode = opts.em || 'akut';
  if (S.q){ S.q = ''; $('#q').value = ''; }
  render(); window.scrollTo(0,0);
}
function restore(st){
  stopTimer();
  S.tab = st.tab; S.view = st.view; S.emMode = st.emMode || 'akut'; S.q = st.q || '';
  $('#q').value = S.q; store.set('tab', S.tab);
  render(); window.scrollTo(0, st.y || 0);
}
function goBack(){
  if (!STACK.length) return;
  let done = false;
  popPending = () => { done = true; };
  try { history.back(); } catch(e){}
  setTimeout(() => { if (!done && STACK.length){ popPending = null; restore(STACK.pop()); } }, 350);
}
window.addEventListener('popstate', () => {
  if (popPending){ popPending(); popPending = null; }
  if (STACK.length) restore(STACK.pop());
});
function openRef(ref){
  const i = ref.indexOf(':'), t = ref.slice(0,i), id = ref.slice(i+1);
  if (t === 'std') go('std', id);
  else if (t === 'em') go('not', id, {em:'lernen'});
  else if (t === 'med') go('med', id);
  else if (t === 'grp') go('med', 'grp:'+id);
  else if (t === 'area') go('std', 'a:'+id);
  else if (t === 'topic') go('std', 't:'+id);
}
function refLabel(ref){
  const [t, id] = ref.split(':');
  if (t === 'std'){ const s = STANDARDS.find(x => x.id === id); return s ? s.t : id; }
  if (t === 'em'){ const e = EMERG.find(x => x.id === id); return e ? 'Notfall: '+e.t : id; }
  if (t === 'med'){ const d = DRUGS.find(x => x.id === id); return d ? d.n : id; }
  if (t === 'grp') return 'Klassenvergleich: '+(GROUPS[id]||id);
  return ref;
}
function render(){
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-current', b.dataset.tab === S.tab && !S.q ? 'true' : 'false'));
  const v = $('#view');
  if (S.q) v.innerHTML = searchView();
  else if (S.tab === 'med') v.innerHTML = S.view ? (S.view.startsWith('grp:') ? groupView(S.view.slice(4)) : drugDetail(S.view)) : drugList();
  else if (S.tab === 'std') v.innerHTML = !S.view ? areasView() : S.view.startsWith('a:') ? areaView(S.view.slice(2)) : S.view.startsWith('t:') ? topicView(S.view.slice(2)) : stdDetail(S.view);
  else if (S.tab === 'not') v.innerHTML = S.view ? emDetail(S.view) : emList();
  else if (S.tab === 'calc') v.innerHTML = calcView();
  else if (S.tab === 'learn') v.innerHTML = learnView();
  else if (S.tab === 'info') v.innerHTML = infoView();
  v.insertAdjacentHTML('beforeend', `<footer class="foot"><button data-legal>Rechtliches, Datenschutz & Impressum</button><span>Lernhilfe · kein Medizinprodukt · Stand ${esc(SITE.stand)}</span></footer>`);
  v.firstElementChild && v.firstElementChild.classList.add('fade');
  const hb = $('#hback'); if (hb) hb.hidden = !STACK.length;
  bindView();
}

function patient(){
  const h = S.height, kg = S.kg, m = S.sex === 'm';
  const ibw = Math.max((m ? 50 : 45.5) + 0.91*(h - 152.4), 1);
  const bmi = kg / Math.pow(h/100, 2);
  const lbw = m ? 9270*kg/(6680 + 216*bmi) : 9270*kg/(8780 + 244*bmi);
  const abw = ibw + 0.4*(kg - ibw);
  const bsa = Math.sqrt(h*kg/3600);
  return {ibw, bmi, lbw, abw, bsa};
}

 // [Name, Dosiseinheit, Standarddosis, Standardkonzentration, Konzentrationseinheit, Hinweis]
 ['Noradrenalin','µg/kg/min',0.1,100,'µg/ml','z. B. 5 mg / 50 ml'],

 // [Name, mg/kg ohne, max ohne, mg/kg mit Adrenalin, max mit, Konzentrationen, Quelle]

const KID_SRC = [

  ['AHA PALS – Definition der Hypotonie nach Alter','https://cpr.heart.org/en/resuscitation-science/cpr-and-ecc-guidelines/pediatric-advanced-life-support']
];
function ageMonths(){
  const v = parseFloat(String(S.age).replace(',','.'));
  if (!isFinite(v) || v < 0) return NaN;
  return S.ageU === 'M' ? v : v*12;
}
function kidsCalc(){
  const m = ageMonths();
  if (!isFinite(m)) return '<p class="small muted" style="margin:0">Alter eingeben (0 ist erlaubt – für Neugeborene „0 Monate“) für Gewichtsschätzung, Tubusgröße und Kreislauf-Grenzwerte.</p>';
  if (m > 18*12) return '<p class="small muted" style="margin:0">Ab 18 Jahren gelten die Erwachsenenwerte.</p>';
  const y = m/12;
  // Gewicht nach APLS
  let w, wf;
  if (m < 1){ w = 3.5; wf = 'Neugeborenes reif: ca. 3,5 kg'; }
  else if (m < 12){ w = 0.5*m+4; wf = 'APLS: 0,5 × Monate + 4'; }
  else if (y < 6){ w = 2*Math.floor(y)+8; wf = 'APLS: 2 × Jahre + 8'; }
  else if (y <= 12){ w = 3*Math.floor(y)+7; wf = 'APLS: 3 × Jahre + 7'; }
  else { w = NaN; wf = 'über 12 J: Gewicht messen/erfragen'; }
  // Tubus
  let cuff, depth, df;
  if (m < 12){ cuff = '3,0–3,5'; }
  else if (y < 2){ cuff = '3,5–4,0'; }
  else cuff = fmt(Math.round((Math.floor(y)/4+3.5)*2)/2);
  if (m < 12){ const kg = isFinite(w) ? w : S.kg; depth = kg+6; df = 'Säugling: kg + 6 cm'; }
  else { depth = Math.floor(y)/2+12; df = 'Alter/2 + 12 cm'; }
  // minimaler systolischer RR (PALS)
  let rr, rf;
  if (m < 1){ rr = 60; rf = 'Reifes Neugeborenes < 60 mmHg'; }
  else if (m < 12){ rr = 70; rf = 'Säugling < 70 mmHg'; }

const ALLCARDS = CARDS.map((c,i) => ({id:'h'+i, deck:c[0], q:c[1], a:c[2]})).concat(autoCards());
const DAY = 864e5;
const cardState = id => S.prog[id] || null;
const isDue = id => { const p = cardState(id); return !p || p.due <= Date.now(); };
function deckStats(deck){
  const cs = ALLCARDS.filter(c => deck === 'all' || c.deck === deck);
  let seen = 0, due = 0, known = 0;
  cs.forEach(c => { const p = cardState(c.id); if (p){ seen++; if (p.due <= Date.now()) due++; if (p.b >= 3) known++; } });
  return {total:cs.length, seen, due, known, fresh:cs.length-seen};
}
function startCards(filter, label){
  const pool = ALLCARDS.filter(filter);
  const due = shuffle(pool.filter(c => cardState(c.id) && isDue(c.id)));
  const fresh = shuffle(pool.filter(c => !cardState(c.id)));
  let queue = due.concat(fresh.slice(0, Math.max(10, 25 - due.length))).slice(0, 40);
  if (!queue.length) queue = shuffle(pool).slice(0, 20);
  S.learn = {mode:'cards', label, queue, i:0, shown:false, stats:[0,0,0,0]};
  S.tab = 'learn'; S.view = null; S.q = ''; $('#q').value=''; store.set('tab','learn'); render(); window.scrollTo(0,0);
}
function rateCard(r){
  const L = S.learn, c = L.queue[L.i];
  const p = cardState(c.id) || {b:0, due:0};
  let b = p.b;
  if (r === 0) b = 0; else if (r === 1) b = Math.max(1, b); else if (r === 2) b = Math.min(b+1, 6); else b = Math.min(b+2, 6);
  const due = r === 0 ? Date.now() : Date.now() + INTERVAL[b]*DAY * (r === 1 ? 0.6 : 1);
  S.prog[c.id] = {b, due}; store.set('prog', S.prog);
  L.stats[r]++;
  if (r === 0) L.queue.push(c);
  L.i++; L.shown = false; render();
}

  DRUGS.forEach(d => {
    const others = shuffle(DRUGS.filter(o => o.id !== d.id && o.g === d.g)).slice(0,3);
    if (others.length === 3) qs.push({q:`${d.n} – ${d.d[0][0]}: welche Dosierung ist richtig?`, opts:[d.d[0][1]].concat(others.map(o => o.d[0][1])), ex:`${d.n}: ${d.d[0][1]}`});
    const pool = DRUGS.filter(o => o.id !== d.id && (o.g === d.g || o.l === d.l));
    const names = shuffle(pool.length >= 3 ? pool : DRUGS.filter(o => o.id !== d.id)).slice(0,3).map(o => o.n);
    const re = new RegExp(nm(d), 'gi');
    qs.push({q:`Zu welchem Medikament passt diese Aussage?\n„${d.p[0].replace(re,'▢')}“`, opts:[d.n].concat(names), ex:d.p[0]});
    qs.push({q:`Welches Medikament hat diese Pharmakokinetik?\n${d.pk.replace(re,'▢')}`, opts:[d.n].concat(names), ex:`${d.n}: ${d.pk}`});
  });
  Object.keys(GROUP_INFO).forEach(g => {
    const G = GROUP_INFO[g]; if (G.rows.length < 4) return;
    G.head.slice(1).forEach((h,j) => {
      const r = G.rows[Math.floor(Math.random()*G.rows.length)];
      const wrong = shuffle(G.rows.filter(x => x !== r && x[j+1] !== r[j+1])).slice(0,3).map(x => x[j+1]);
      if (wrong.length === 3 && new Set(wrong.concat(r[j+1])).size === 4) qs.push({q:`${GROUPS[g]} – ${r[0]}: ${h}?`, opts:[r[j+1]].concat(wrong), ex:`${r[0]} · ${h}: ${r[j+1]}`});
    });
  });
  return qs;
}
function startQuiz(src){
  const hand = MCQ.map(m => ({q:m[0], opts:m[1].slice(), ex:m[2]}));
  const pool = src === 'hand' ? hand : src === 'med' ? mcqAuto() : shuffle(hand).slice(0,6).concat(shuffle(mcqAuto()).slice(0,6));
  const qs = shuffle(pool).slice(0, 12).map(x => { const correct = x.opts[0]; const opts = shuffle(x.opts); return {...x, opts, right: opts.indexOf(correct)}; });
  S.learn = {mode:'quiz', qs, i:0, pick:null, score:0};
  render(); window.scrollTo(0,0);
}

function hl(text, q){
  const t = esc(text); if (!q) return t;
  const re = new RegExp('('+esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return t.replace(re, '<mark class="hl">$1</mark>');
}
function searchView(){

  const grps = Object.keys(GROUP_INFO).filter(g => (GROUPS[g] + JSON.stringify(GROUP_INFO[g])).toLowerCase().includes(q));
  const stds = STANDARDS.filter(s => JSON.stringify(s).toLowerCase().includes(q)).sort((a,b) => (b.t.toLowerCase().includes(q)) - (a.t.toLowerCase().includes(q)));
  const ems = EMERG.filter(e => (JSON.stringify(e) + JSON.stringify(EM_LEARN[e.id]||'')).toLowerCase().includes(q));
  const cards = ALLCARDS.filter(c => c.deck !== 'med' && c.deck !== 'std' && c.deck !== 'grp' && (c.q+' '+c.a).toLowerCase().includes(q)).slice(0, 10);
  const none = !drugs.length && !stds.length && !ems.length && !cards.length && !grps.length;
  return `<div class="stack"><div><div class="eyebrow">Suche</div><h1 class="h1">„${esc(S.q)}“</h1></div>

function bindView(){

    if (ds.group){ S.group = ds.group; render(); return; }

    if (ds.std){ go('std', ds.std); return; }
    if (ds.em){ go('not', ds.em); return; }
    if (ds.go){ const i = ds.go.indexOf(':'); const tab = ds.go.slice(0,i), vw = ds.go.slice(i+1) || null; if (tab === 'not' && vw && S.q) { go('not', vw, {em:'lernen'}); } else go(tab, vw); return; }
    if (ds.ref){ openRef(ds.ref); return; }
    if ('legal' in ds){ go('info'); return; }
    if (ds.emmode){ S.emMode = ds.emmode; render(); return; }
    if (ds.area){ go('std', 'a:'+ds.area); return; }
    if (ds.topic){ go('std', 't:'+ds.topic); return; }
    if ('back' in ds){ stopTimer(); if (STACK.length) goBack(); else go(S.tab, null); return; }
    if (ds.learnDrug){ const d = DRUGS.find(x => x.id === ds.learnDrug); startCards(c => c.drug === ds.learnDrug, 'Medikament: '+d.n); return; }
    if (ds.learnGroup){ const g = ds.learnGroup; startCards(c => c.grp === g || (c.drug && (DRUGS.find(d => d.id === c.drug)||{}).g === g), GROUPS[g]); return; }
    if (ds.learnStd){ const s = STANDARDS.find(x => x.id === ds.learnStd); startCards(c => c.std === s.id, s.t); return; }
    if (ds.learnEm){ const em = EMERG.find(x => x.id === ds.learnEm); startCards(c => c.em === em.id, 'Notfall: '+em.t); return; }
    if (ds.learnChap){ const k = ds.learnChap; const p = planTopics().find(x => x.k === k); startCards(chapterFilter(k), p ? p.t : 'Thema'); return; }
    if (ds.scroll){ const el = document.getElementById(ds.scroll); if (el){ const y = el.getBoundingClientRect().top + window.scrollY - 70; window.scrollTo({top:y, behavior:'smooth'}); } return; }
    if ('startall' in ds){ startCards(() => true, 'Alle Stapel'); return; }
    if ('chapters' in ds){ S.learn = {mode:'chapters'}; render(); window.scrollTo(0,0); return; }
    if (ds.deck){ startCards(c => c.deck === ds.deck, DECKS[ds.deck]); return; }
    if (ds.quiz){ startQuiz(ds.quiz); return; }
    if ('cases' in ds){ S.showCases = true; render(); const el = $('#cases'); el && el.scrollIntoView({behavior:'smooth'}); return; }
    if (ds.case != null){ S.learn = {mode:'case', c:+ds.case, step:0, shown:false}; render(); window.scrollTo(0,0); return; }
    if ('endlearn' in ds){ S.learn = null; render(); window.scrollTo(0,0); return; }
    if (ds.rate != null){ rateCard(+ds.rate); return; }
    if (ds.pick != null){ const L = S.learn; if (L.pick == null){ L.pick = +ds.pick; if (L.pick === L.qs[L.i].right) L.score++; render(); } return; }
    if (ds.setkg){ setKg(ds.setkg); refreshCalc(); return; }
    if (t.id === 'show'){ S.learn.shown = true; render(); return; }
    if (t.id === 'nextq'){ S.learn.i++; S.learn.pick = null; render(); window.scrollTo(0,0); return; }
    if (t.id === 'showcase'){ S.learn.shown = true; render(); return; }
    if (t.id === 'nextcase'){ S.learn.step++; S.learn.shown = false; render(); return; }
    if (t.id === 'shownotice'){ showNotice(); return; }
    if (t.id === 'tstart'){ startTimer(); return; }
    if (t.id === 'treset'){ stopTimer(); timerStart = null; $('#timer').textContent = '00:00'; return; }
    if (t.id === 'uncheck'){ store.set('em_'+S.view, []); render(); return; }
    if (t.id === 'resetprog'){ $('#resetconfirm').innerHTML = '<button class="btn danger small" id="resetyes">Wirklich alles zurücksetzen</button>'; return; }
    if (t.id === 'resetyes'){ S.prog = {}; store.set('prog', {}); S.chap = {}; store.set('chap', {}); render(); return; }
  };
  v.onchange = e => {
    const t = e.target;
    if (t.dataset.chk != null){
      const key = 'em_'+S.view; let arr = store.get(key, []); const i = +t.dataset.chk;
      arr = t.checked ? [...new Set(arr.concat(i))] : arr.filter(x => x !== i); store.set(key, arr);
    }
    if (t.dataset.chap != null){ S.chap[t.dataset.chap] = t.checked; store.set('chap', S.chap); }
    if (t.id === 'ageu'){ S.ageU = t.value; store.set('ageU', t.value); refreshCalc(); }
    if (t.id === 'sex'){ S.sex = t.value; store.set('sex', t.value); refreshCalc(); }
  };
  v.oninput = e => {
    const t = e.target;
    if (t.hasAttribute('data-kg')) setKg(t.value);
    if (t.id === 'age'){ S.age = t.value; refreshCalc(); }
    if (t.id === 'height'){ const n = parseFloat(t.value); if (n > 40 && n < 240){ S.height = n; store.set('height', n); refreshCalc(); } }
    if (t.dataset.pd != null){ store.set('pd'+t.dataset.pd, t.value); $('#pr'+t.dataset.pd).textContent = perfRate(+t.dataset.pd); }
    if (t.dataset.pc != null){ store.set('pc'+t.dataset.pc, t.value); $('#pr'+t.dataset.pc).textContent = perfRate(+t.dataset.pc); }
    if (t.dataset.store){ store.set(t.dataset.store, t.value); refreshCalc(); }
  };
  if (S.tab === 'not' && S.view && timerStart) startTimer(true);
}

  if (location.hash){ const h = location.hash.slice(1); if (['med','std','not','calc','learn'].includes(h)) S.tab = h; }
  if (!['med','std','not','calc','learn','info'].includes(S.tab)) S.tab = 'med';
  try { history.replaceState({k:0}, ''); } catch(e){}
  render();
  let sessAck = false; try { sessAck = sessionStorage.getItem('ak_ack') === '1'; } catch(e){}
  if (store.get('ack', null) !== SITE.stand && !sessAck) showNotice();
});
</script>
