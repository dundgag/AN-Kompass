<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Private, nicht kommerzielle Lernhilfe zur Facharztprüfung Anästhesiologie. Kein Medizinprodukt.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Anästhesie Kompass</title>
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface2:#F6F8F8; --ink:#14201E; --muted:#5A6B68; --line:#D5DEDC;
  --accent:#0C6B66; --accent-soft:#DCEFEC; --accent-ink:#FFFFFF;
  --crit:#C3312B; --crit-soft:#FBE4E2; --warn:#A8620A; --warn-soft:#FBEFD9; --ok:#2C7A3F; --ok-soft:#E1F2E5;
  --shadow:0 1px 2px rgba(20,32,30,.06),0 4px 14px rgba(20,32,30,.05);
  --f-display:"Barlow Condensed","Avenir Next Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tabh:64px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1413; --surface:#162120; --surface2:#1B2826; --ink:#E4ECEA; --muted:#93A5A1; --line:#28373A;
    --accent:#4CC2B6; --accent-soft:#16332F; --accent-ink:#06201D;
    --crit:#FF7A70; --crit-soft:#3A1917; --warn:#F2B35A; --warn-soft:#352813; --ok:#79D08E; --ok-soft:#15301D;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1413; --surface:#162120; --surface2:#1B2826; --ink:#E4ECEA; --muted:#93A5A1; --line:#28373A;
  --accent:#4CC2B6; --accent-soft:#16332F; --accent-ink:#06201D;
  --crit:#FF7A70; --crit-soft:#3A1917; --warn:#F2B35A; --warn-soft:#352813; --ok:#79D08E; --ok-soft:#15301D;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;flex:0 0 auto;background:none;border:0;padding:0}
.brand svg{width:28px;height:28px}
.brand b{font-family:var(--f-display);font-size:1.3rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.brand b span{color:var(--accent)}
.search{flex:1 1 auto;min-width:0;position:relative}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px 8px 34px;font-size:15px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.kg{flex:0 0 auto;display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 8px;font-family:var(--f-mono);font-size:14px}
.kg input{width:3.2em;border:0;background:transparent;text-align:right;font-family:var(--f-mono);font-size:14px;padding:2px 0}
.kg label{color:var(--muted);font-size:12px}

@media (max-width:640px){
  .top .wrap{flex-wrap:wrap;row-gap:8px}
  .brand{flex:1 1 0;min-width:0;overflow:hidden}
  .brand b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kg{padding:3px 6px}
  .search{order:3;flex-basis:100%}
}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:2px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.tab svg{width:24px;height:24px}
.tab[aria-current="true"]{color:var(--accent)}
.tab.notf[aria-current="true"]{color:var(--crit)}
main{padding-block:16px calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);background:var(--bg);z-index:19}
  .tabs .wrap{display:flex;gap:4px;padding-inline:16px}
  .tab{flex-direction:row;gap:8px;font-size:15px;padding:10px 14px;border-bottom:2px solid transparent}
  .tab svg{width:20px;height:20px}
  .tab[aria-current="true"]{border-bottom-color:currentColor}
  main{padding-block:20px 60px}
}

/* Generic */
.eyebrow{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.82rem;color:var(--muted);font-weight:600}
.h1{font-size:2rem}
.lead{color:var(--muted);margin:.3rem 0 0;max-width:62ch}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{font-size:1.25rem;display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn.ghost{background:transparent}
.back{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:8px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-size:1rem;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.note{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.pearl{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.pearl h3{color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.calc{font-family:var(--f-mono);font-size:14px;color:var(--accent);font-weight:600;min-width:6.5em}
.muted{color:var(--muted)}
.small{font-size:14px}
.disclaimer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:8px}

/* Syringe label (ISO 26825) */
.syr{--lab:#eee;position:relative;display:inline-flex;align-items:center;background:var(--lab);color:#111;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:3px;padding:3px 10px;font-size:1.05rem;line-height:1.2;border:1px solid rgba(0,0,0,.18);white-space:nowrap}
.syr.stripe{padding-inline:22px}
.syr.stripe::before,.syr.stripe::after{content:"";position:absolute;top:0;bottom:0;width:14px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.95) 0 3px,transparent 3px 7px)}
.syr.stripe::before{left:0}.syr.stripe::after{right:0}
.syr.big{align-self:flex-start;white-space:normal;font-size:1.9rem;padding:6px 16px;border-radius:4px}
.syr.big.stripe{padding-inline:34px}
.syr.big.stripe::before,.syr.big.stripe::after{width:22px}

/* Lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface2)}
.item .sub{grid-column:1/-1;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .chev{color:var(--muted)}
.grp-h{font-family:var(--f-display);font-size:1.05rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 2px 6px}

/* Drug detail */
.fx{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.fx div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.fx b{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--muted)}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ki li::marker{color:var(--crit)}

/* Emergency */
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.etile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--crit);border-radius:10px;padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:2px}
.etile b{font-family:var(--f-display);font-size:1.2rem;font-weight:700}
.etile span{font-size:13px;color:var(--muted);line-height:1.35}
.etile:hover{border-color:var(--crit)}
.crisis{border-top:6px solid var(--crit)}
.crisis .h1{color:var(--crit)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
.checks li{counter-increment:s}
.checks label{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:17px;cursor:pointer}
.checks input{appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--crit);margin:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--crit)}
.checks input::before{content:counter(s)}
.checks input:checked{background:var(--crit);color:#fff}
.checks input:checked::before{content:"✓"}
.checks input:checked + span{color:var(--muted);text-decoration:line-through}
.timer{font-family:var(--f-mono);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.calcbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.calcbox div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.calcbox b{display:block;font-size:13px;color:var(--muted);font-weight:600}
.calcbox span{font-family:var(--f-mono);font-weight:600;font-size:15px}
.field{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--muted);font-weight:600}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;width:7em;font-family:var(--f-mono);font-size:15px;color:var(--ink)}

/* Learn */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1}
.stat span{font-size:13px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.mode{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--f-display);font-size:1.35rem}
.mode span{font-size:14px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.flash{min-height:260px;display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.flash .q{font-family:var(--f-display);font-size:1.6rem;font-weight:600;line-height:1.2}
.flash .a{white-space:pre-line;border-top:1px dashed var(--line);padding-top:14px;font-size:17px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate button{border-radius:10px;padding:10px 4px;font-weight:700;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;font-size:15px}
.rate button small{font-weight:400;color:var(--muted);font-size:12px}
.rate .r0{color:var(--crit)}.rate .r1{color:var(--warn)}.rate .r2{color:var(--ok)}.rate .r3{color:var(--accent)}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;width:100%;font-size:16px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--crit);background:var(--crit-soft)}
.deck{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.deck:last-child{border-bottom:0}
.deck .bar{grid-column:1/-1}
.qa{border-left:3px solid var(--accent);padding-left:12px}
.hl{background:color-mix(in srgb,var(--warn) 30%,transparent);border-radius:2px}
@media (prefers-reduced-motion:no-preference){
  .fade{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
}
.grp-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin:14px 2px 6px}
.grp-row .grp-h{margin:0}
.btn.small{padding:6px 10px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.prose p{margin:0;max-width:72ch}
.srclist{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:15px}
.srclist a{color:var(--accent);text-decoration:none;overflow-wrap:anywhere}
.srclist a:hover{text-decoration:underline}
details.qa-d{border-top:1px solid var(--line);padding:10px 0}
details.qa-d:first-of-type{border-top:0}
details.qa-d summary{cursor:pointer;font-weight:700;list-style-position:outside}
details.qa-d .qa{margin-top:8px}
.calcbox small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:15px;color:var(--ink)}
input.mini{width:5.5em;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 6px;font-family:var(--f-mono);font-size:14px;color:var(--ink)}
table.perf td{vertical-align:middle}
.chap{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.chap:last-child{border-bottom:0}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 auto}
.chk input:checked + span{color:var(--muted)}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip.accent{border-color:var(--accent);color:var(--accent)}
.qq{font-family:var(--f-display);font-size:1.3rem;font-weight:600;line-height:1.25;white-space:pre-line}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.foot button{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,18,17,.55);display:grid;place-items:center;padding:16px}
.modal-card{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3);border-top:6px solid var(--crit);max-height:90vh;overflow:auto}
code{font-family:var(--f-mono);font-size:.9em}
.hback{flex:0 0 auto;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--accent);padding:0}
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.area{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px}
.area b{font-family:var(--f-display);font-size:1.3rem;line-height:1.15}
.area span{font-size:14px;color:var(--muted);line-height:1.35}
.area small{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.area:hover,.topic-item:hover{border-color:var(--accent)}
.topic-item{text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;width:100%}
.topic-item b{font-size:17px}
.topic-item span:last-child{font-size:14px;color:var(--muted);line-height:1.35}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-limit{background:var(--warn-soft);color:var(--warn)}
.pill-no{background:var(--crit-soft);color:var(--crit)}
.pill-na{background:var(--surface2);color:var(--muted)}
.kid{font-weight:700}
.kid-ok{color:var(--ok)}.kid-limit{color:var(--warn)}.kid-no{color:var(--crit)}.kid-na{color:var(--muted)}
.ped{border-left:4px solid var(--warn)}
.box-intro{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px}
.box-intro h3{color:var(--accent);margin:0 0 6px}.box-intro p{margin:0;max-width:72ch;line-height:1.55}
.box-merke{background:var(--ok-soft);border-left:4px solid var(--ok);border-radius:12px;padding:14px 16px}
.box-merke h3{color:var(--ok)}
.box-cave{background:var(--crit-soft);border-left:4px solid var(--crit);border-radius:12px;padding:14px 16px}
.box-cave h3{color:var(--crit)}
.box-kv{border-top:4px solid var(--accent)}
.kv{display:grid;grid-template-columns:minmax(120px,32%) 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv>div{display:contents}.kv b,.kv span{padding:8px 10px;border-bottom:1px solid var(--line);font-size:15px}
.kv b{background:var(--surface2);font-weight:600}.kv>div:last-child b,.kv>div:last-child span{border-bottom:0}
@media (max-width:520px){.kv{grid-template-columns:1fr}.kv b{border-bottom:0;padding-bottom:2px}.kv span{padding-top:0}}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.toc ol{margin:6px 0 0;padding-left:1.4em;columns:2 240px;column-gap:24px}.toc li{margin:2px 0;break-inside:avoid}
.toc button{background:none;border:0;padding:2px 0;color:var(--accent);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.toc button:hover{text-decoration:underline}
section.sec{scroll-margin-top:80px}

hyp:{

// Ausführliche Inhalte je Substanz: x = Vertiefung, vs = Stellenwert/Vergleich, src = Quellen
const DRUG_X = {
propofol:{x:['Propofol (2,6-Diisopropylphenol) ist stark lipophil und wird als 1- oder 2-%ige Lipidemulsion (Soja-/MCT-Öl, Eilecithin, Glycerol) angeboten. Die hohe Clearance (20–30 ml/kg/min) übersteigt den hepatischen Blutfluss → extrahepatische Elimination (Lunge, Niere). Die kurze Wirkdauer beruht bei Einzelgabe auf Umverteilung, bei Infusion auf Metabolismus.','Pharmakodynamik: dosisabhängige Hemmung des Sympathikus und des Barorezeptorreflexes – deshalb fällt der Blutdruck ohne adäquate Herzfrequenzsteigerung. Ältere, Hypovolämie, eingeschränkte Pumpfunktion und Kombination mit Opioiden verstärken den Effekt deutlich. Gute Dämpfung der pharyngealen/laryngealen Reflexe erklärt die Eignung für die Larynxmaske.','TCI-Modelle: Marsh (Plasma, gewichtsbasiert) und Schnider (Effektort, berücksichtigt Alter, Größe, LBM); Eleveld als neueres Universalmodell. Bewusstlosigkeit meist bei Effektortkonzentration 2–4 µg/ml mit Opioid.','PRIS: seltene, lebensbedrohliche Störung der mitochondrialen Fettsäureoxidation; Frühzeichen metabolische Azidose, Laktat↑, Rhabdomyolyse (CK↑), Hyperkaliämie, Lipämie, Brugada-ähnliches EKG, therapieresistente Bradykardie. Therapie: Propofol stoppen, Kreislaufunterstützung, ggf. Nierenersatz/ECLS.'],
 vs:'Gegenüber Thiopental: bessere Steuerbarkeit, antiemetisch, weniger Nachschlaf, aber stärkere Hypotonie. Gegenüber Etomidat: stärkerer RR-Abfall, dafür keine NNR-Suppression und keine Myoklonien. TIVA mit Propofol senkt PONV im Vergleich zu Volatilen um etwa ein Viertel.',
 src:[['Propofol – Fachinformationen (Gelbe Liste)',GL('Propofol')]]},
thiopental:{x:['Thiopental ist ein Thiobarbiturat, als Natriumsalz in alkalischer Lösung (pH ≈ 10,5) gelöst. Der Wirkeintritt innerhalb einer Arm-Hirn-Kreislaufzeit ist unübertroffen. Nach Einzeldosis beendet die Umverteilung (Muskel, später Fett) die Wirkung; die Elimination (hepatische Oxidation) ist langsam und folgt bei hohen Spiegeln einer Kinetik 0. Ordnung.','Neuroprotektion: dosisabhängige Senkung von CMRO₂ bis zur Burst-Suppression (ca. −50 %), Senkung von CBF und ICP (Kopplung). Einsatz als Ultima Ratio beim therapierefraktären Hirndruck und Status epilepticus – mit Kreislauf- und Immunsuppression als Preis.','Porphyrie: Barbiturate induzieren die δ-Aminolävulinsäure-Synthase und können akute Attacken auslösen (Bauchschmerz, Neuropathie, Psychose, Hyponatriämie). Sichere Alternativen: Propofol, Opioide, Relaxanzien, Lokalanästhetika (Bupivacain).'],
 vs:'Heute in vielen Kliniken durch Propofol ersetzt. Vorteile bleiben die sehr schnelle Wirkung (RSI, Sectio), die starke antikonvulsive und hirndrucksenkende Wirkung. Nachteile: Kumulation, Gewebsnekrose bei Paravasat/intraarterieller Injektion, Porphyrie-Risiko, kein antiemetischer Effekt.',
 src:[['Trapanal – Fachinformationen (Gelbe Liste)',GL('Thiopental')]]},
etomidat:{x:['Etomidat ist ein carboxyliertes Imidazol, das R-Enantiomer wirkt hypnotisch. Es hemmt die 11β-Hydroxylase und in geringerem Maß die 17α-Hydroxylase der Nebennierenrinde → Cortisol- und Aldosteronsynthese für 6–24 h vermindert, ACTH-Stimulation bleibt wirkungslos.','Die Kreislaufstabilität erklärt sich durch fehlende Sympathikolyse und fehlende Wirkung auf den Barorezeptorreflex. Myoklonien (bis 80 % ohne Prämedikation) entstehen durch Disinhibition subkortikaler Strukturen; sie lassen sich durch Opioid- oder Benzodiazepin-Vorgabe deutlich reduzieren.','Die Diskussion bei Sepsis: Beobachtungsstudien zeigten erhöhte Mortalität nach Etomidat, randomisierte Studien und Metaanalysen fanden keinen eindeutigen Effekt. Bei kritisch Kranken wird häufig Esketamin bevorzugt; bei Einsatz von Etomidat ist eine Hydrocortison-Substitution erwägenswert.'],
 vs:'Mittel der Wahl bei kardial schwer kranken Patienten (Aortenstenose, schwere Herzinsuffizienz), wenn Esketamin wegen Tachykardie/Hypertonie ungünstig ist. Gegenüber Propofol keine Reflexdämpfung (schlechter für Larynxmaske), mehr PONV und keine Eignung für Aufrechterhaltung.',
 src:[['Etomidat-Lipuro – Fachinformation (BASG, AT)','https://medikamente.basg.gv.at/documents/1-23484__DOTC_FACH_INFO.pdf']]},
esketamin:{x:['Esketamin ist das S(+)-Enantiomer des Ketamins mit etwa doppelter Affinität zum NMDA-Rezeptor. Daraus ergibt sich die halbe Dosierung im Vergleich zum Racemat bei weniger psychomimetischen Effekten und schnellerem Erwachen.','Kreislauf: indirekte Sympathikusaktivierung (zentral und Hemmung der Noradrenalin-Wiederaufnahme) überdeckt die direkte negativ inotrope Wirkung. Bei erschöpften Katecholaminspeichern (lange Sepsis, Schock) tritt die negative Inotropie hervor → auch Esketamin kann dann Hypotonie auslösen.','Atemweg und Lunge: Muskeltonus der oberen Atemwege und Reflexe bleiben weitgehend erhalten, Aspiration ist trotzdem möglich (kein sicherer Schutz). Bronchodilatation über Katecholamine und direkte Relaxation der glatten Muskulatur – deshalb Einleitungsmittel bei Status asthmaticus.','Analgesie in subanästhetischer Dosis (0,1–0,25 mg/kg/h) wirkt antihyperalgetisch, verringert Opioidbedarf und Opioidtoleranz; besonders sinnvoll bei chronischen Schmerzen, Opioidgewöhnung und großen Eingriffen.','Die frühere Kontraindikation „erhöhter ICP“ ist bei kontrollierter Beatmung und Normokapnie relativiert – Studien zeigen keinen relevanten ICP-Anstieg; die Fachinformation führt sie aber weiter.'],
 vs:'Im Schock und bei Asthma das Einleitungsmittel der Wahl. Gegenüber Etomidat keine NNR-Suppression, dafür Tachykardie und Hypertonie (ungünstig bei KHK, Aortenstenose, Präeklampsie). Gegenüber Propofol erhaltene Spontanatmung und Analgesie, aber Aufwachreaktionen und Hypersalivation.',
 src:[['Ketanest S – Fachinformation (Pfizer)','https://figi.pfizer.de/sites/default/files/FI-1435.pdf']]},
midazolam:{x:['Midazolam hat einen imidazolsubstituierten Benzodiazepinring, der bei pH < 4 offen und wasserlöslich ist; bei physiologischem pH schließt er sich → lipophil und ZNS-gängig. Deshalb kein Injektionsschmerz und keine Thrombophlebitis wie bei Diazepam.','Die Wirkung ist durch den Ceiling-Effekt der GABA-A-Modulation begrenzt (Benzodiazepine erhöhen die Öffnungsfrequenz, nicht die Öffnungsdauer). Kombiniert mit Opioiden entsteht aber eine überadditive Atemdepression.','Bei Älteren ist Midazolam ein unabhängiger Risikofaktor für postoperatives Delir; die Leitlinien empfehlen den Verzicht auf routinemäßige Benzodiazepin-Prämedikation bei Älteren. Bei Kindern bleibt die orale/rektale Prämedikation Standard.','Pharmakokinetik: CYP3A4-Hemmer (Makrolide, Azole, Ritonavir, Grapefruit) verlängern die Wirkung erheblich; bei Intensivpatienten führt der aktive, renal eliminierte Metabolit α-Hydroxymidazolam-Glukuronid zur Kumulation.'],
 vs:'Für die Prämedikation Standard-Benzodiazepin (kurze HWZ). Für kurze Sedierungen gut geeignet; für Einleitung zu langsam und zu lang wirksam. Remimazolam kombiniert die Benzodiazepin-Eigenschaften mit organunabhängiger Elimination.',
 src:[['Midazolam – Fachinformationen (Gelbe Liste)',GL('Midazolam')],['S3-Leitlinie Analgesie, Sedierung und Delirmanagement in der Intensivmedizin','https://register.awmf.org/de/leitlinien/detail/001-012']]},
remimazolam:{x:['Remimazolam ist ein Benzodiazepin mit Esterbindung, das durch Carboxylesterase 1 in der Leber rasch zu einem inaktiven Metaboliten hydrolysiert wird. Die Kinetik ähnelt damit der von Remifentanil: kurze kontextsensitive Halbwertszeit (ca. 6–7 min nach 4 h), keine relevante Kumulation.','Die Dosierung für die Allgemeinanästhesie ist nicht gewichtsbezogen: Einleitung mit 6 mg/min bis zum Bewusstseinsverlust (bei Bedarf bis 12 mg/min), Erhaltung 1 mg/min (0,1–2,5 mg/min). Zusatzboli à 6 mg sind möglich.','Die geringere Kreislaufdepression im Vergleich zu Propofol macht es interessant für ASA-III/IV-Patienten. Flumazenil kann die Wirkung aufheben. Hilfsstoff Dextran 40 → Anaphylaxie-Risiko bei Dextranallergie.'],
 vs:'Alternative zu Propofol bei hämodynamisch fragilen Patienten, weniger Injektionsschmerz, antagonisierbar. Nachteile: kein antiemetischer Effekt, Kosten, weniger Erfahrung, Narkosetiefe-Monitoring (BIS) weniger validiert.',
 src:[['Byfavo – Summary of Product Characteristics (emc)','https://www.medicines.org.uk/emc/product/15066/smpc'],['Byfavo – EPAR (EMA)','https://www.ema.europa.eu/en/documents/product-information/byfavo-epar-product-information_en.pdf']]},
dexmedetomidin:{x:['Dexmedetomidin ist das S-Enantiomer des Medetomidins und etwa achtmal selektiver für α₂- als Clonidin. Sedierung entsteht über den Locus coeruleus (Hemmung der noradrenergen Neurone), die Analgesie spinal im Hinterhorn. Der EEG-Zustand ähnelt dem natürlichen Non-REM-Schlaf; Patienten sind erweckbar und kooperativ.','Kreislauf: biphasisch – bei schneller Anflutung zunächst Hypertonie und Reflexbradykardie (periphere α₂B-Vasokonstriktion), danach Hypotonie und Bradykardie (zentrale Sympathikolyse). Deshalb auf der Intensivstation kein Bolus.','Evidenz: Reduktion von Delirinzidenz und Beatmungsdauer im Vergleich zu Benzodiazepinen (MENDS, SEDCOM). SPICE III: bei früher tiefer Sedierung mit hoher Dosis erhöhte Mortalität bei Patienten ≤ 65 Jahre → Warnhinweis in der Fachinformation.'],
 vs:'Gegenüber Propofol/Midazolam: keine relevante Atemdepression, weniger Delir, aber nicht für tiefe Sedierung (RASS < −3) geeignet und hämodynamisch limitierend bei Bradykardie. Gegenüber Clonidin: kürzere HWZ, besser steuerbar, teurer.',
 src:[['Dexdor – Summary of Product Characteristics (emc)','https://www.medicines.org.uk/emc/product/4783/smpc'],['S3-Leitlinie Analgesie, Sedierung und Delirmanagement in der Intensivmedizin','https://register.awmf.org/de/leitlinien/detail/001-012']]},
clonidin:{x:['Clonidin ist ein Imidazolin mit α₂:α₁-Selektivität von etwa 200:1. Zentral senkt es den Sympathikotonus (Hypotension, Bradykardie, Sedierung), spinal wirkt es analgetisch. Es reduziert den Anästhetikabedarf (MAC-Reduktion bis ca. 40 %).','Klinisch wichtig: Therapie des Kältezitterns (Shivering) (senkt die Kältezitterschwelle), Behandlung sympathikoton geprägter Entzugs- und Delirsyndrome, Adjuvans zur Verlängerung von Nervenblockaden (off-label).','Eine vorbestehende Dauertherapie sollte perioperativ fortgeführt werden – das abrupte Absetzen löst eine Rebound-Hypertonie mit Tachykardie aus.'],
 vs:'Günstiger und länger wirksam als Dexmedetomidin; weniger gut steuerbar. Für die Therapie des Kältezitterns (Shivering) gleichwertig zu Pethidin, aber ohne Opioidwirkung.',
 src:[['Clonidin – Fachinformationen (Gelbe Liste)',GL('Clonidin')]]},
fentanyl:{x:['Fentanyl ist etwa 100-fach potenter als Morphin und sehr lipophil. Nach einer Einzeldosis beendet die Umverteilung die Wirkung; bei wiederholter Gabe oder Infusion sättigen sich die peripheren Kompartimente, die kontextsensitive Halbwertszeit steigt stark (nach 4 h Infusion über 4 h). Das erklärt Nachbeatmung nach großen Fentanyl-Narkosen.','Thoraxrigidität („wooden chest“) tritt bei schneller Gabe hoher Dosen auf, vermittelt über zentrale µ-Rezeptoren; sie kann Maskenbeatmung unmöglich machen und wird durch Relaxierung aufgehoben. Häufig ist eigentlich die Stimmritze verschlossen.','Metabolismus über CYP3A4 zu inaktivem Norfentanyl. Transdermale und intranasale Anwendungsformen existieren (Schmerztherapie, Notfall).'],
 vs:'International Standard-Opioid, in Deutschland intraoperativ häufig durch Sufentanil ersetzt. Gegenüber Sufentanil: geringere Potenz, stärkere Kumulation, weniger Sedierung. Gegenüber Remifentanil: Analgesieüberhang in den Aufwachraum, aber schlechter steuerbar.',
 src:[['Fentanyl – Fachinformationen (Gelbe Liste)',GL('Fentanyl')]]},
sufentanil:{x:['Sufentanil ist das potenteste in der Humanmedizin verwendete Opioid (≈ 1000 × Morphin). Es hat ein kleineres Verteilungsvolumen als Fentanyl und eine hohe Rezeptoraffinität, damit ist die kontextsensitive Halbwertszeit bei Infusionen unter 8 h sogar kürzer als die von Alfentanil.','Neben der Analgesie zeigt Sufentanil eine deutliche Sedierung – daher gute hämodynamische Stabilität in der Kardioanästhesie und bei langen Eingriffen.','Epidural: Sufenta epidural ist in Deutschland zur epiduralen Anwendung zugelassen (Geburtshilfe: 10 µg mit Bupivacain, max. 30 µg; postoperativ mit Bupivacain 0,175 %). Die intrathekale Gabe (z. B. 2,5–5 µg bei Sectio) ist off-label, aber etabliert.'],
 vs:'Deutsches Standard-Opioid für balancierte Anästhesie und Analgosedierung auf der Intensivstation. Gegenüber Fentanyl potenter und besser steuerbar. Gegenüber Remifentanil längerer Analgesieüberhang, dafür weniger Hyperalgesie.',
 src:[['Sufenta epidural – Fachinformation (Dez. 2022)','https://www.fachinfo.de/fi/pdf/023461/sufenta-epidural-5-mikrogramm-ml-injektionsloesung'],['Sufentanil-ratiopharm – Fachinformation','https://www.fachinfo.de/fi/pdf/002055/sufentanil-ratiopharm-r-0-05-mg-10-ml-injektionsloesung-sufentanil-ratiopharm-r-0-01-mg-2-ml-injektionsloesung']]},
remifentanil:{x:['Remifentanil trägt eine Methylester-Seitenkette, die durch unspezifische Gewebe- und Plasmaesterasen (nicht Pseudocholinesterase) hydrolysiert wird. Der Hauptmetabolit Remifentanilsäure ist praktisch inaktiv. Die kontextsensitive Halbwertszeit von 3–4 min bleibt unabhängig von Infusionsdauer, Leber- und Nierenfunktion konstant.','Opioidinduzierte Hyperalgesie und akute Toleranz treten besonders bei hohen Dosen (> 0,2 µg/kg/min) und abruptem Absetzen auf. Prophylaxe: Dosis so niedrig wie möglich, Esketamin, Magnesium, Ausschleichen, rechtzeitige Übergabe an ein länger wirksames Opioid.','Die Formulierung enthält Glycin als Puffer – Glycin ist ein inhibitorischer Neurotransmitter und neurotoxisch bei neuraxialer Gabe. Deshalb absolute Kontraindikation für epidurale/intrathekale Anwendung.','Anwendung in der Geburtshilfe: i.v. PCA (z. B. 20–40 µg Bolus) bei Kontraindikation gegen PDA – unter 1:1-Betreuung und kontinuierlicher SpO₂-Überwachung.'],
 vs:'Bestes Opioid für TIVA, Neuro- und Kurzeingriffe durch unübertroffene Steuerbarkeit. Nachteile: keine postoperative Analgesie, Hyperalgesie, Bradykardie und Hypotonie ausgeprägter als bei Sufentanil.',
 src:[['Ultiva – Fachinformationen (Gelbe Liste)',GL('Remifentanil')]]},
alfentanil:{x:['Alfentanil hat mit pKa 6,5 bei physiologischem pH einen hohen nicht ionisierten Anteil (≈ 90 %) und ein kleines Verteilungsvolumen → Wirkmaximum bereits nach etwa 1 min. Die Wirkung ist kurz, doch bei Infusion kumuliert es stärker als Remifentanil.','CYP3A4-Metabolismus mit großer interindividueller Variabilität; Erythromycin und Azole verlängern die Wirkung.'],
 vs:'Für sehr kurze starke Reize (Intubation, Kardioversion, Retrobulbäranästhesie) geeignet; im Alltag weitgehend von Remifentanil abgelöst.',
 src:[['Rapifen – Fachinformationen (Gelbe Liste)',GL('Alfentanil')]]},
morphin:{x:['Morphin ist hydrophil – es flutet langsam an und ab (Maximum erst nach 15–20 min). Bei intrathekaler Gabe verbleibt es lange im Liquor und wandert nach kranial → Analgesie bis 24 h, aber verzögerte Atemdepression 6–12 h nach Gabe (Überwachungspflicht).','Metabolismus: Glukuronidierung zu Morphin-6-Glukuronid (potenter als Morphin, renal eliminiert → Kumulation mit Atemdepression bei Niereninsuffizienz) und Morphin-3-Glukuronid (neuroexzitatorisch, Hyperalgesie/Myoklonien).','Histaminfreisetzung verursacht Flush, Pruritus, Hypotonie und bei Asthmatikern Bronchospasmus.'],
 vs:'Referenzsubstanz und günstigstes Opioid, gut für PCA und Tumorschmerz. Bei Niereninsuffizienz schlechter als Hydromorphon oder Piritramid.',
 src:[['Morphin – Fachinformationen (Gelbe Liste)',GL('Morphin')]]},
piritramid:{x:['Piritramid ist ein reiner µ-Agonist mit etwa 0,7-facher Potenz von Morphin, ausschließlich in Deutschland, Österreich und Benelux verbreitet. Die Wirkdauer von 4–6 h macht es zum Standard im Aufwachraum und für i.v.-PCA.','Es setzt kaum Histamin frei und ist kreislaufstabil. Metabolisierung hepatisch zu inaktiven Metaboliten – daher auch bei Niereninsuffizienz vorsichtig titriert einsetzbar.'],
 vs:'Gegenüber Morphin: kreislaufstabiler, weniger Histamin, geeigneter bei Niereninsuffizienz; wegen fehlender internationaler Studien in Leitlinien selten erwähnt.',
 src:[['Dipidolor – Fachinformationen (Gelbe Liste)',GL('Piritramid')]]},
naloxon:{x:['Naloxon ist ein kompetitiver Antagonist mit hoher Affinität zum µ-Rezeptor. Es hat eine hohe First-pass-Elimination (oral unwirksam) und eine Halbwertszeit von 60–90 min, die Wirkdauer beträgt 30–60 min. Bei länger wirkenden Opioiden (Morphin, Methadon, Retardpräparate) droht die Renarkotisierung.','Eine zu rasche Vollantagonisierung setzt eine massive Katecholaminausschüttung frei – mit Hypertonie, Tachykardie, Arrhythmien und Lungenödem. Deshalb bei postoperativer Atemdepression titrieren (z. B. 0,4 mg auf 10 ml, 1-ml-Schritte).','Nasale Anwendung (1,8 mg Nasenspray) für Laien und Rettungsdienst verfügbar.'],
 vs:'Einziger klinisch gebräuchlicher reiner Opioid-Antagonist. Für Pruritus nach neuraxialem Opioid in niedriger Dosis (Perfusor 0,25–1 µg/kg/h) ohne Aufhebung der Analgesie einsetzbar.',
 src:[['Naloxon – Fachinformationen (Gelbe Liste)',GL('Naloxon')]]},
succinylcholin:{x:['Succinylcholin besteht aus zwei verbundenen Acetylcholinmolekülen. Es depolarisiert die Endplatte anhaltend; spannungsabhängige Na⁺-Kanäle der perijunktionalen Membran bleiben inaktiviert → schlaffe Lähmung (Phase-I-Block, kein Fading im TOF, keine posttetanische Potenzierung).','Hyperkaliämie: Normal steigt K⁺ um etwa 0,5 mmol/l. Bei Hochregulation extrajunktionaler Rezeptoren (Denervierung, Verbrennung, Immobilisation, schwere Infektion, Myopathien) steigt K⁺ um mehrere mmol/l bis zum Herzstillstand. Die Rezeptorvermehrung beginnt etwa 24–72 h nach dem Ereignis und hält Wochen bis Monate an.','Pseudocholinesterasemangel: genetische Varianten (Dibucain-Zahl) oder erworben (Leberinsuffizienz, Schwangerschaft, Neostigmin) → Apnoe von 30 min bis mehreren Stunden. Management: Sedierung, Beatmung, Relaxometrie bis zur Erholung; FFP oder Cholinesterase-Präparat nur in Ausnahmefällen.','Masseterspasmus nach Succinylcholin (v. a. Kinder unter Sevofluran) kann ein Frühzeichen der MH sein → Trigger stoppen oder engmaschig überwachen (CK, Myoglobin, etCO₂).'],
 vs:'Einziges Relaxans mit so kurzer Wirkdauer – Vorteil in der Situation „cannot intubate“, wenn Spontanatmung zurückkehren soll (in der Praxis selten rechtzeitig). Rocuronium 1,2 mg/kg + Sugammadex ist die Alternative ohne Hyperkaliämie- und MH-Risiko.',
 src:[['Lysthenon – Fachinformationen (Gelbe Liste)',GL('Suxamethonium')]]},
rocuronium:{x:['Rocuronium ist ein mono-quartäres Aminosteroid mit niedriger Potenz (ED95 0,3 mg/kg). Je geringer die Potenz, desto mehr Moleküle werden gegeben und desto schneller ist der Wirkeintritt (Bowman-Prinzip). Mit 1,0–1,2 mg/kg (3–4 × ED95) erreicht Rocuronium nach etwa 60 s Intubationsbedingungen wie Succinylcholin.','Elimination überwiegend biliär unverändert, etwa 30 % renal. Wirkverlängerung bei Leberinsuffizienz, im Alter, bei Hypothermie, Azidose, Hypokaliämie, Hypermagnesiämie sowie mit Volatilen und Aminoglykosiden.','Anaphylaxie: Muskelrelaxanzien sind in Frankreich/UK die häufigsten perioperativen Auslöser; Kreuzreaktionen über die quartäre Ammoniumgruppe (auch Pholcodin-Hustensäfte werden als Sensibilisierungsquelle diskutiert).'],
 vs:'Heute das Standard-ndMR, auch für RSI. Gegenüber Cisatracurium: schnellerer Anschlag und Sugammadex-Antagonisierbarkeit, aber organabhängige Elimination. Gegenüber Succinylcholin: keine Hyperkaliämie/MH, aber lange Wirkdauer ohne Sugammadex.',
 src:[['Esmeron – Fachinformationen (Gelbe Liste)',GL('Rocuronium')],['Bridion – EPAR (EMA)','https://www.ema.europa.eu/en/documents/product-information/bridion-epar-product-information_en.pdf']]},
cisatracurium:{x:['Cisatracurium ist eines der zehn Stereoisomere von Atracurium (1R-cis,1’R-cis) mit etwa vierfacher Potenz. Durch die niedrigere Dosis entsteht weniger Laudanosin, und praktisch keine Histaminfreisetzung.','Hofmann-Elimination: spontaner, nicht enzymatischer Zerfall bei physiologischem pH und Temperatur (≈ 77 % der Clearance). Dadurch unabhängig von Leber- und Nierenfunktion; langsamer bei Hypothermie und Azidose. Lagerung gekühlt.','In der Intensivmedizin (frühe Relaxierung bei schwerem ARDS, ACURASYS-Studie) wurde Cisatracurium eingesetzt; der Nutzen ist nach ROSE-Studie nicht mehr gesichert.'],
 vs:'Relaxans der Wahl bei Multiorganversagen. Langsamer Anschlag (ungeeignet für RSI) und nicht mit Sugammadex antagonisierbar.',
 src:[['Nimbex – Fachinformationen (Gelbe Liste)',GL('Cisatracurium')]]},
mivacurium:{x:['Mivacurium ist ein kurzwirksames Benzylisochinolin, das wie Succinylcholin durch die Plasmacholinesterase abgebaut wird. Bei heterozygoten oder homozygoten Varianten verlängert sich die Wirkung erheblich (bis Stunden).','Histaminfreisetzung ist dosis- und injektionsgeschwindigkeitsabhängig → langsam über 30–60 s injizieren.'],
 vs:'Für kurze Eingriffe mit Relaxationsbedarf (z. B. Laryngoskopie) gedacht; durch Rocuronium + Sugammadex weitgehend verdrängt. Neostigmin hemmt auch die Plasmacholinesterase und kann die Antagonisierung verzögern.',
 src:[['Mivacron – Fachinformationen (Gelbe Liste)',GL('Mivacurium')]]},
sugammadex:{x:['Sugammadex ist ein γ-Cyclodextrin mit acht Zuckermolekülen, dessen lipophiler Hohlraum Rocuronium (und weniger fest Vecuronium) im Verhältnis 1:1 umschließt. Freies Rocuronium im Plasma sinkt, ein Gradient zieht Rocuronium von der Endplatte ab.','Dosierung nach Blocktiefe (quantitatives Monitoring!): 2 mg/kg bei Wiederkehr von T2, 4 mg/kg bei 1–2 PTC, 16 mg/kg zur sofortigen Aufhebung 3 min nach 1,2 mg/kg Rocuronium. Unterdosierung kann zur Rekurarisierung führen.','Nebenwirkungen: Anaphylaxie (auch bei Erstexposition), ausgeprägte Bradykardie bis Asystolie innerhalb von Minuten, Beeinflussung der Gerinnungswerte (aPTT/PT leicht verlängert, klinisch meist irrelevant), Interaktion mit Progestagenen.','Der Komplex wird renal eliminiert; bei CrCl < 30 ml/min wird Sugammadex nicht empfohlen. Inzwischen für Kinder ab Geburt zur Routineantagonisierung zugelassen.'],
 vs:'Gegenüber Neostigmin: wirkt in jeder Blocktiefe, schneller und zuverlässiger, weniger Restblockade, keine muskarinergen Nebenwirkungen. Nachteile: Kosten, Anaphylaxie, nur für Aminosteroide.',
 src:[['Bridion – EPAR/Fachinformation (EMA)','https://www.ema.europa.eu/en/documents/product-information/bridion-epar-product-information_en.pdf']]},
neostigmin:{x:['Neostigmin hemmt die Acetylcholinesterase reversibel (Carbamylierung). Das erhöhte ACh verdrängt ndMR kompetitiv – das funktioniert nur, solange noch genug freie Rezeptoren vorhanden sind (TOF-Count ≥ 4 bzw. TOF-Ratio > 0,2). Bei tiefer Blockade ist die AChE bereits maximal gehemmt (Ceiling-Effekt).','Muskarinerge Effekte (Bradykardie, Bronchokonstriktion, Salivation, Darmperistaltik) werden durch Glycopyrronium oder Atropin aufgefangen. Bei bereits vollständiger Erholung (TOF-Ratio ≥ 0,9) kann Neostigmin paradox eine Muskelschwäche verursachen (Depolarisationsblock).'],
 vs:'Günstig und für alle ndMR geeignet, aber bei tiefer Blockade wirkungslos und mit mehr Restblockaden assoziiert als Sugammadex.',
 src:[['Neostigmin – Fachinformationen (Gelbe Liste)',GL('Neostigmin')]]},
};

Object.assign(DRUG_X, {
sevofluran:{x:['Sevofluran ist ein fluorierter Methyl-Isopropyl-Ether mit angenehmem Geruch und niedrigem Blut/Gas-Koeffizienten. Dadurch schnelle Einleitung per Maske, ohne Husten oder Laryngospasmus – das Standard-Volatile für Kinder und die inhalative Einleitung bei schwierigem Atemweg.','Metabolisierung 3–5 % über CYP2E1 mit Freisetzung anorganischen Fluorids (ohne klinisch relevante Nephrotoxizität beim Menschen). Mit Atemkalk entsteht Compound A (Vinylether, im Tierversuch nephrotoxisch) – vermehrt bei niedrigem Frischgasfluss, hoher Temperatur und trockenem Kalk. Moderne Absorber ohne starke Basen (KOH/NaOH-frei) reduzieren das Problem.','Aufwachdelir (Emergence Delirium) bei Kindern (bis 20–30 %): Prophylaxe mit Propofol am Ende, Dexmedetomidin, Clonidin oder TIVA.'],
 vs:'Klarer Standard unter den Volatilen seit dem Desfluran-Aus. Gegenüber Isofluran schneller und atemwegsfreundlich, gegenüber Desfluran geringfügig langsameres Erwachen bei sehr langen Eingriffen.',
 src:[['Sevofluran – Fachinformationen (Gelbe Liste)',GL('Sevofluran')]]},
desfluran:{x:['Desfluran unterscheidet sich von Isofluran nur durch ein Fluor statt Chlor; dadurch sehr geringe Löslichkeit (B/G 0,42) und minimale Metabolisierung. Wegen des Siedepunkts von 22,8 °C braucht es einen elektrisch beheizten Druckverdampfer (Tec 6 bei 39 °C / 2 bar).','Schnelle Konzentrationssteigerungen über ~1 MAC aktivieren den Sympathikus (Tachykardie, Hypertonie); die Atemwegsreizung verbietet die Maskeneinleitung.','Klima: Treibhauspotenzial etwa 2500-fach CO₂ (100 Jahre); eine MAC-Stunde entspricht mehreren hundert gefahrenen Autokilometern. Seit dem 1.1.2026 ist der Routineeinsatz nach EU-Verordnung 2024/573 verboten; eine Anwendung ist nur mit dokumentierter medizinischer Begründung zulässig.'],
 vs:'Früher Vorteil bei Adipositas und langen Eingriffen (schnelleres Erwachen, Schutzreflexe früher zurück). Dieser Vorteil ist klinisch klein und rechtfertigt die Klimabelastung heute nicht mehr.',
 src:[['A&I 2026: Desfluran-Routineeinsatz untersagt – Ausnahmen mit Begründung','https://www.ai-online.info/archiv/2026/02-2026/neue-eu-vorgaben-ab-01-01-2026-desfluran-routineeinsatz-untersagt-ausnahmen-mit-begruendung.html']]},
isofluran:{x:['Isofluran ist ein halogenierter Methyl-Ethyl-Ether, stärker löslich als Sevo- und Desfluran und stechend riechend. Ausgeprägte Vasodilatation mit Reflextachykardie; die früher diskutierte Koronar-Steal-Theorie ist klinisch nicht relevant.','Heute v. a. für die inhalative Sedierung auf der Intensivstation genutzt (Sedaconda-ACD mit Reflektor, zugelassen): schnelles Aufwachen, geringe Kumulation, bronchodilatatorisch, antikonvulsiv.'],
 vs:'Günstig und mit mittlerer Klimabelastung; im OP durch Sevofluran weitgehend verdrängt.',
 src:[['Isofluran – Fachinformationen (Gelbe Liste)',GL('Isofluran')]]},
lachgas:{x:['N₂O ist ein schwaches Anästhetikum (MAC 104 %) mit guter Analgesie über NMDA-Antagonismus und Freisetzung endogener Opioide. Als Trägergas verstärkt es durch Konzentrations- und Second-Gas-Effekt die Aufnahme von Volatilen.','N₂O ist 34-fach besser blutlöslich als Stickstoff und diffundiert in luftgefüllte Hohlräume schneller hinein als N₂ heraus → Volumen- oder Druckanstieg (Pneumothorax verdoppelt sich in 10 min bei 70 % N₂O; Cuffdruck steigt).','Oxidation des Cobalamins inaktiviert die Methionin-Synthase → Folsäure-/DNA-Synthese gestört, Homocystein↑. Relevanz bei B₁₂-Mangel, langen Expositionen und Missbrauch (funikuläre Myelose).','Klima: Treibhausgas und das wichtigste ozonabbauende Gas des Jahrhunderts; zentrale Lachgasanlagen verlieren große Mengen durch Leckagen.'],
 vs:'Im OP heute kaum noch eingesetzt (ENIGMA II: kein Nutzen, mehr PONV). Als 50:50-Gemisch (Livopan) für Analgesie in Geburtshilfe, Pädiatrie und kurze Prozeduren weiterhin sinnvoll.',
 src:[['Livopan – Fachinformationen (Gelbe Liste)',GL('Livopan')]]},
lidocain:{x:['Lidocain ist das Referenz-Amid-LA mit mittellanger Wirkdauer. Die Fachinformation (Xylocitin-loc) nennt als Einzelhöchstdosis 300 mg ohne Vasokonstriktor; in Lehrbüchern werden 3–4,5 mg/kg angegeben. Mit Adrenalin (1:200 000) verzögert sich die Resorption, die Höchstdosis steigt auf 500 mg.','i.v.-Lidocain perioperativ (off-label): analgetisch, antiinflammatorisch, verkürzt die postoperative Darmparalyse bei abdominalen Eingriffen. Nicht mit gleichzeitiger Regionalanästhesie/Blockaden mit LA kombinieren (kumulative Toxizität) und nur mit Monitoring.','Klasse-Ib-Antiarrhythmikum: bindet bevorzugt an inaktivierte Na⁺-Kanäle (ischämisches Myokard). ERC 2025: Alternative zu Amiodaron bei schockrefraktärem VF (100 mg, dann 50 mg).','Spinal wird Lidocain wegen transienter neurologischer Symptome (TNS: Rücken-/Beinschmerzen 12–24 h nach SPA, v. a. Steinschnittlage, ambulant) nicht mehr verwendet.'],
 vs:'Universelles, schnell wirksames LA für Infiltration, Schleimhaut und kurze Blockaden. Für lange Blockaden durch Ropivacain, für kurze Spinale durch Prilocain/Chloroprocain ersetzt.',
 src:[['Xylocitin-loc 2 % – Fachinformation (Jan. 2024)','https://www.fachinfo.de/fi/pdf/010737/xylocitin-r-loc-2'],['ERC Guidelines 2025 – Adult ALS','https://www.sciencedirect.com/science/article/pii/S0300957225002813']]},
prilocain:{x:['Prilocain hat das größte Verteilungsvolumen und die schnellste Clearance der Amid-LA → geringste systemische Toxizität. Die Fachinformation (Xylonest 1 %) nennt 8,5 mg/kg bzw. max. 600 mg; ab etwa 600 mg steigt Methämoglobin klinisch relevant an.','Der Metabolit o-Toluidin oxidiert Hämoglobin zu Methämoglobin (Fe³⁺). Die Pulsoxymetrie zeigt typischerweise um 85 % (unabhängig vom tatsächlichen SaO₂); die Co-Oxymetrie misst MetHb direkt. Therapie ab ca. 20 % oder bei Symptomen mit Methylenblau 1–2 mg/kg (bei G6PD-Mangel Ascorbinsäure).','Hyperbares Prilocain 2 % (Takipril) ist für ambulante Spinalanästhesien zugelassen: Wirkdauer 1,5–2 h, schnelle Mobilisation, kaum TNS.'],
 vs:'LA der Wahl für die i.v.-Regionalanästhesie und kurze ambulante Spinale. Bei Säuglingen < 6 Monate, Anämie und MetHb-Neigung kontraindiziert.',
 src:[['Xylonest 1 % – Fachinformation','https://www.fachinfo.de/fi/pdf/004924/xylonest-r-1-xylonest-1-fl-50-ml']]},
mepivacain:{x:['Mepivacain ist ein Amid-LA mit mittlerer Wirkdauer ohne eigene vasodilatierende Wirkung. Die Fachinformation (Scandicain) gibt die Höchstdosis nach Injektionsort an: HNO 200 mg (3 mg/kg), interkostal 300 mg (4 mg/kg), Plexus 500 mg (7 mg/kg) – ein gutes Beispiel für die ortsabhängige Resorption.','Beim Neugeborenen verlängerte Elimination (unreife Leber) → nicht für die geburtshilfliche Parazervikalblockade (fetale Bradykardie).'],
 vs:'Schnell anschlagendes Plexus-LA; häufig mit Ropivacain gemischt, um Anschlag und Dauer zu kombinieren.',
 src:[['Scandicain 2 % – Fachinformation (Juni 2025)','https://www.fachinfo.de/fi/pdf/004890']]},
ropivacain:{x:['Ropivacain ist das reine S-Enantiomer eines Propyl-Analogons von Bupivacain. Die geringere Lipophilie bedingt eine geringere Potenz, aber auch geringere ZNS- und Kardiotoxizität. Der ausgeprägte Differenzialblock (sensibel > motorisch) ermöglicht Analgesie mit erhaltener Motorik.','Fachinformation (Naropin): Plexus brachialis 30–40 ml 7,5 mg/ml (225–300 mg), lumbal epidural bis 250 mg, epidurale Infusion 12–28 mg/h, bis zu 675 mg/24 h gut vertragen. Bei kontinuierlichen Kathetern steigt das freie Ropivacain wegen zunehmender α₁-saurer Glykoproteinbindung postoperativ weniger stark an.','Zusatz von Adrenalin bringt bei Ropivacain kaum Verlängerung (eigene vasokonstriktive Wirkung).'],
 vs:'Standard für periphere Nervenblockaden und Katheter sowie für Geburts-PDA. Gegenüber Bupivacain sicherer bei hoher Dosis, dafür etwas schwächer (Äquipotenz etwa 1,3–1,5 : 1).',
 src:[['Naropin – Fachinformation (Februar 2026)','https://www.fachinfo.de/fi/pdf/007856/naropin-r']]},
bupivacain:{x:['Bupivacain ist hoch lipophil und stark proteingebunden (95 %). Es blockiert kardiale Na⁺-Kanäle schnell und löst sich nur langsam („fast in – slow out“) – deshalb therapierefraktäre ventrikuläre Arrhythmien bei Intoxikation. Das R-Enantiomer ist kardiotoxischer; Levobupivacain (S) ist sicherer.','Fachinformation (Carbostesin): max. 2 mg/kg Einzeldosis (150 mg bei 75 kg). Kontraindiziert zur i.v.-Regionalanästhesie und zur Parazervikalanästhesie.','Spinal: 0,5 % hyperbar (Glukose) breitet sich nach Schwerkraft aus, isobar etwas weniger vorhersagbar. Für Sectio 10–12 mg hyperbar + Opioid, für Hüft-/Knieendoprothetik 10–15 mg.'],
 vs:'Standard-LA für die Spinalanästhesie. Für große Volumina (Plexus) wegen Toxizität durch Ropivacain verdrängt.',
 src:[['Carbostesin 0,5 % – Fachinformation (Okt. 2022)','https://www.fachinfo.de/fi/pdf/006274']]},
chloroprocain:{x:['Chloroprocain ist ein Ester-LA, das durch die Plasmacholinesterase in Sekunden abgebaut wird (HWZ < 1 min). Die frühere Neurotoxizität ging auf Konservierungsstoffe (Bisulfit) zurück; das heutige Präparat (Ampres 1 %) ist konservierungsmittelfrei und für die Spinalanästhesie zugelassen.','Wirkdauer 40–90 min, sehr schnelle Rückbildung der Motorik, frühe Entlassung bei ambulanten Eingriffen (Knie-Arthroskopie, Perianalchirurgie).'],
 vs:'Kürzeste Spinalanästhesie; Alternative zu Prilocain. Bei Esterallergie und Pseudocholinesterasemangel meiden.',
 src:[['Ampres – Fachinformationen (Gelbe Liste)',GL('Chloroprocain')]]},
lipid:{x:['Lipidemulsion bindet lipophile Lokalanästhetika im Plasma („lipid sink“) und beschleunigt ihre Umverteilung aus Herz und Gehirn in Muskel und Leber („lipid shuttle“). Zusätzlich liefert sie Fettsäuren für die Energiegewinnung des Myokards und wirkt direkt positiv inotrop.','Dosierung nach AAGBI: 1,5 ml/kg über 1 min, dann 15 ml/kg/h; nach 5 min bei Persistenz bis zu 2 weitere Boli und Verdopplung der Rate auf 30 ml/kg/h; kumulative Obergrenze 12 ml/kg. Beispiel 70 kg: 100 ml Bolus, dann 1000 ml/h.'],
 vs:'Kein Ersatz für Reanimation und Atemwegssicherung, sondern Ergänzung. Propofol ist keine Lipidtherapie.',
 src:[['Association of Anaesthetists: Management of severe local anaesthetic toxicity (2010, Aktualisierungen)','https://anaesthetists.org/Home/Resources-publications/Guidelines/Management-of-severe-local-anaesthetic-toxicity']]},
noradrenalin:{x:['Noradrenalin wirkt vorwiegend auf α₁-Rezeptoren (Vasokonstriktion arteriell und venös – die venöse Konstriktion mobilisiert „unstressed volume“ und steigert die Vorlast) und moderat auf β₁. Die Herzfrequenz sinkt häufig reflektorisch.','Perioperativ wird Noradrenalin zunehmend früh und auch peripher (verdünnt, gut laufende große Vene) eingesetzt, um Hypotoniephasen zu vermeiden, die mit Nieren- und Myokardschaden assoziiert sind.'],
 vs:'Vasopressor der ersten Wahl bei Vasoplegie und Sepsis. Gegenüber Phenylephrin erhält es das HZV besser (β₁-Anteil). Gegenüber Adrenalin weniger Tachykardie, Laktat und Arrhythmien.',
 src:[['Arterenol – Fachinformationen (Gelbe Liste)',GL('Noradrenalin')],['Surviving Sepsis Campaign 2021','https://doi.org/10.1097/CCM.0000000000005337']]},
adrenalin:{x:['Adrenalin wirkt dosisabhängig: niedrig (< 0,05 µg/kg/min) β-betont mit HF↑, Kontraktilität↑ und SVR↓/↔; hoch α-betont mit starkem SVR-Anstieg. β₂-Effekte führen zu Bronchodilatation, Hypokaliämie, Hyperglykämie und Laktatanstieg (aerobe Glykolyse).','Anaphylaxie (S2k-LL 2021): i.m. in den lateralen Oberschenkel (0,01 mg/kg, Erwachsene 0,3–0,6 mg), bei Bedarf alle 5–10 min. Unter Monitoring (Anästhesie) i.v. titriert: 1 mg auf 100 ml (10 µg/ml), Boli von 1 µg/kg nach Wirkung. Die Vollwirkdosis der Reanimation (1 mg) gehört nur zum Kreislaufstillstand.','Reanimation nach ERC 2025: 1 mg alle 3–5 min, bei nicht schockbarem Rhythmus so früh wie möglich, bei VF/pVT nach dem 3. Schock.'],
 vs:'Mittel der Wahl bei Anaphylaxie und Reanimation. Als Dauerinfusion bei Low-Output und in der Kinderkardiologie verbreitet, aber mit mehr Tachykardie und Laktat als Noradrenalin + Dobutamin.',
 src:[['S2k-Leitlinie Akuttherapie und Management der Anaphylaxie (Update 2021)','https://register.awmf.org/de/leitlinien/detail/061-025'],['ERC Guidelines 2025 – Adult ALS','https://www.sciencedirect.com/science/article/pii/S0300957225002813']]},
dobutamin:{x:['Dobutamin ist ein Racemat: (+)-Enantiomer β₁/β₂-Agonist und α₁-Antagonist, (−)-Enantiomer α₁-Agonist. Netto überwiegt β₁ (Inotropie) mit leichter Vasodilatation.','Tachyphylaxie nach 72 h durch β-Rezeptor-Downregulation. Unter β-Blockade ist die Wirkung abgeschwächt – dann Levosimendan oder PDE-3-Hemmer erwägen.'],
 vs:'Standard-Inotropikum bei Low-Output-Syndrom. Erhöht den myokardialen O₂-Verbrauch und kann Tachyarrhythmien auslösen.',
 src:[['Dobutamin – Fachinformationen (Gelbe Liste)',GL('Dobutamin')]]},
akrinor:{x:['Akrinor kombiniert Cafedrin (Norephedrin-Theophyllin) und Theodrenalin (Noradrenalin-Theophyllin) im Verhältnis 20:1. Theodrenalin wirkt sofort über β₁ und α₁, Cafedrin setzt verzögert Noradrenalin frei; Theophyllin hemmt die Phosphodiesterase und verlängert die β₁-Wirkung.','Hämodynamisch steigt v. a. das Schlagvolumen bei nahezu unveränderter Herzfrequenz und SVR – der Blutdruck steigt über das HZV. Fachinformation: 1 Ampulle auf 10 ml, Einzelgaben 1 ml, Tageshöchstdosis 3 Ampullen.'],
 vs:'In Deutschland beliebt bei Narkose- und Spinalhypotonie, auch in der Geburtshilfe. International nicht verfügbar und in Leitlinien nicht bewertet.',
 src:[['Akrinor – Fachinformation','https://www.fachinfo.de/fi/pdf/014341/akrinor-r-200-mg-2-ml-10-mg-2-ml-injektionsloesung']]},
phenylephrin:{x:['Phenylephrin ist ein reiner α₁-Agonist. Der Blutdruck steigt über SVR, die Herzfrequenz sinkt reflektorisch, das HZV kann abnehmen.','Bei der Spinalanästhesie zur Sectio ist der Blutdruckabfall v. a. durch Vasodilatation bedingt. Der internationale Konsensus (Kinsella 2018) empfiehlt Phenylephrin prophylaktisch als Infusion (Start 25–50 µg/min), Ziel ≥ 90 % des Ausgangs-RR, und warnt vor Bradykardie; Noradrenalin ist eine Alternative.'],
 vs:'Ideal bei Tachykardie, Aortenstenose und HOCM. Bei Bradykardie und schlechter LV-Funktion ungeeignet.',
 src:[['Kinsella SM et al. Anaesthesia 2018 – Consensus on vasopressors at caesarean section','https://doi.org/10.1111/anae.14080']]},
ephedrin:{x:['Ephedrin setzt Noradrenalin aus präsynaptischen Speichern frei und stimuliert α- und β-Rezeptoren direkt. Wiederholte Gaben führen zur Tachyphylaxie.','Plazentagängig mit Stimulation des fetalen Stoffwechsels → niedrigere Nabelschnur-pH-Werte als unter Phenylephrin.'],
 vs:'Sinnvoll bei Hypotonie mit Bradykardie. Unwirksam nach Speicherentleerung (lange Sepsis, Kokain, Reserpin).',
 src:[['Ephedrin – Fachinformationen (Gelbe Liste)',GL('Ephedrin')]]},
vasopressin:{x:['Argipressin (Arginin-Vasopressin) wirkt über V₁-Rezeptoren an der glatten Gefäßmuskulatur (Gq → IP₃ → Ca²⁺↑) und damit unabhängig von adrenergen Rezeptoren – auch bei Azidose. Im septischen Schock besteht ein relativer Vasopressinmangel.','VASST-Studie: kein Überlebensvorteil insgesamt, möglicherweise bei weniger schwerem Schock; katecholaminsparend. Fachinformation: 0,01 IE/min Start, max. 0,03 IE/min. Bei Patienten unter ACE-Hemmer/Sartan mit refraktärer Narkosehypotonie wirksam.'],
 vs:'Zweiter Vasopressor neben Noradrenalin; nicht als Monotherapie. Nebenwirkungen: digitale und mesenteriale Ischämie, reduziertes HZV.',
 src:[['Empressin – Fachinformation (AOP)','https://www.aop-health.com/fileadmin/user_upload/MediaLibrary_Germany/Empressin_Fachinformation.pdf']]},
urapidil:{x:['Urapidil blockiert periphere α₁-Rezeptoren (Vasodilatation) und stimuliert zentrale 5-HT₁A-Rezeptoren, was die reflektorische Sympathikusaktivierung dämpft – deshalb keine Reflextachykardie. Der ICP bleibt unbeeinflusst.','Wirkung titrierbar über Boli (5–25 mg), bei längerem Bedarf als Perfusor.'],
 vs:'In Deutschland Standard bei perioperativer Hypertonie. Gegenüber Nitroglycerin keine Reflextachykardie und keine Toleranz, aber längere HWZ.',
 src:[['Ebrantil – Fachinformationen (Gelbe Liste)',GL('Urapidil')]]},
nitroglycerin:{x:['Glyceroltrinitrat setzt NO frei → cGMP↑ → Relaxation glatter Muskulatur. In niedriger Dosis dominieren venöse Kapazitätsgefäße (Vorlastsenkung, Wandspannung↓, myokardialer O₂-Bedarf↓), höher dosiert auch Arteriolen und Koronarien.','Tachyphylaxie nach 24–48 h durch Verbrauch von Sulfhydrylgruppen. Bei Kombination mit PDE-5-Hemmern (Sildenafil 24 h, Tadalafil 48 h) droht schwere Hypotonie.'],
 vs:'Mittel der Wahl bei Myokardischämie und hypertensivem Lungenödem. Nicht bei vorlastabhängiger Hämodynamik (Aortenstenose, RV-Infarkt, Tamponade).',
 src:[['Nitrolingual – Fachinformationen (Gelbe Liste)',GL('Glyceroltrinitrat')]]},
esmolol:{x:['Esmolol wird durch Esterasen der Erythrozyten abgebaut (nicht durch Plasmacholinesterase) – HWZ 9 min, Wirkende 10–20 min nach Stopp. Dadurch eignet es sich zur Dämpfung kurzer Stressreaktionen (Laryngoskopie, Extubation) und zur Frequenzkontrolle bei unklarer Pumpfunktion.'],
 vs:'Am besten steuerbarer β-Blocker; für Dauertherapie ungeeignet und teuer.',
 src:[['Brevibloc – Fachinformationen (Gelbe Liste)',GL('Esmolol')]]},
metoprolol:{x:['Metoprolol ist β₁-selektiv, lipophil und wird über CYP2D6 metabolisiert (Poor Metabolizer → stärkere Wirkung). POISE (2008): hohe präoperativ neu begonnene Dosen senkten Myokardinfarkte, erhöhten aber Schlaganfälle und Mortalität. ESC 2022: bestehende β-Blocker-Therapie fortführen, Neubeginn nur bei klarer Indikation und rechtzeitig.'],
 vs:'Für längere Frequenzkontrolle besser als Esmolol; schlechter steuerbar.',
 src:[['ESC 2022 Guidelines non-cardiac surgery','https://doi.org/10.1093/eurheartj/ehac270']]},
amiodaron:{x:['Amiodaron verlängert Aktionspotenzial und Refraktärzeit (Klasse III) und hat zusätzlich Na⁺-, β- und Ca²⁺-blockierende Eigenschaften. Es ist jodhaltig (37 % Jod), extrem lipophil und hat eine Halbwertszeit von Wochen.','Akut: Hypotonie (durch Lösungsvermittler Polysorbat bei schneller Gabe) und Bradykardie. Langzeit: Schilddrüsenfunktionsstörungen, Lungenfibrose, Hepatotoxizität, Korneaablagerungen, Photosensibilität.','ERC 2025: 300 mg nach dem 3. Schock, 150 mg nach dem 5. Schock; Lidocain als Alternative. Nur in Glukose 5 % verdünnen.'],
 vs:'Breitestes Antiarrhythmikum, auch bei eingeschränkter LV-Funktion einsetzbar. Für einfache Frequenzkontrolle β-Blocker bevorzugen.',
 src:[['ERC Guidelines 2025 – Adult ALS','https://www.sciencedirect.com/science/article/pii/S0300957225002813']]},
adenosin:{x:['Adenosin aktiviert A₁-Rezeptoren im AV-Knoten (K⁺-Kanal-Öffnung, Hyperpolarisation) und unterbricht so AV-Knoten-abhängige Reentry-Tachykardien. Bei Vorhofflattern demaskiert es die Flatterwellen (diagnostisch).','Wegen der Halbwertszeit von Sekunden: herznah (antekubital), schnell, mit 20 ml NaCl-Bolus nachspülen; Patient über kurzes Unwohlsein aufklären, Defibrillator bereit.'],
 vs:'Erstes Medikament bei regelmäßiger Schmalkomplex-Tachykardie nach Vagusmanöver. Bei präexzitiertem Vorhofflimmern gefährlich (schnellere Leitung über akzessorische Bahn → VF).',
 src:[['ERC Guidelines 2025 – Adult ALS (Peri-Arrest-Arrhythmien)','https://www.sciencedirect.com/science/article/pii/S0300957225002813']]},
atropin:{x:['Atropin ist ein tertiäres Amin aus der Tollkirsche und passiert die Blut-Hirn-Schranke. Es blockiert M₁–M₅. In sehr niedriger Dosis kann über zentrale/präsynaptische M₁-Blockade eine paradoxe Bradykardie auftreten – daher Mindestdosis (ERC: 0,5 mg Erwachsene).','Beim herztransplantierten Patienten fehlt die vagale Innervation → Atropin wirkungslos, Adrenalin oder Isoprenalin nötig.'],
 vs:'Schnell und zuverlässig bei vagaler Bradykardie. Für Sekretionshemmung und mit Neostigmin ist Glycopyrronium besser (kein ZAS).',
 src:[['ERC Guidelines 2025 – Adult ALS (Bradykardie)','https://www.sciencedirect.com/science/article/pii/S0300957225002813']]},
glycopyrronium:{x:['Quartäres Ammonium – geringe ZNS-Gängigkeit, keine Sedierung/ZAS. Stärker und länger sekretionshemmend als Atropin, geringere Tachykardie.'],
 vs:'Bevorzugtes Anticholinergikum zur Kombination mit Neostigmin und vor Wachfiberoptik.',
 src:[['Robinul – Fachinformationen (Gelbe Liste)',GL('Glycopyrronium')]]},
physostigmin:{x:['Physostigmin ist ein tertiärer Cholinesterasehemmer und wirkt zentral. Das zentrale anticholinerge Syndrom (ZAS) entsteht durch Blockade zentraler Muskarinrezeptoren nach Atropin, Scopolamin, Antihistaminika, trizyklischen Antidepressiva, Neuroleptika – mit agitierter oder somnolenter Verlaufsform.','Diagnose per Ausschluss (Hypoxie, Hyperkapnie, Hypoglykämie, Überhang) und Ansprechen auf Physostigmin. Wirkdauer 30–60 min – ggf. wiederholen.'],
 vs:'Einziges spezifisches Antidot beim ZAS. Bei TCA-Intoxikation kontraindiziert (Asystolie, Krampfanfälle).',
 src:[['Anticholium – Fachinformationen (Gelbe Liste)',GL('Physostigmin')]]},
flumazenil:{x:['Flumazenil ist ein kompetitiver Antagonist an der Benzodiazepin-Bindungsstelle (auch Z-Substanzen). Die Wirkdauer (≈ 1 h) ist kürzer als die fast aller Benzodiazepine.','Bei Benzodiazepin-Abhängigkeit oder Epilepsie unter Benzodiazepintherapie können Entzugskrampfanfälle ausgelöst werden; bei Mischintoxikationen mit trizyklischen Antidepressiva demaskiert es deren prokonvulsive Wirkung.'],
 vs:'Hilfreich bei iatrogener Überdosierung (Endoskopie, Remimazolam). Bei unklarer Intoxikation zurückhaltend.',
 src:[['Anexate – Fachinformationen (Gelbe Liste)',GL('Flumazenil')]]},
methylenblau:{x:['Methylenblau wird durch die NADPH-abhängige Methämoglobinreduktase zu Leukomethylenblau reduziert, das MetHb zu Hb reduziert. Bei G6PD-Mangel fehlt NADPH → wirkungslos und hämolytisch.','Als MAO-A-Hemmer kann es mit serotonergen Substanzen (SSRI, SNRI, Tramadol, Fentanyl in Kombination) ein Serotoninsyndrom auslösen.'],
 vs:'Antidot der Wahl bei Methämoglobinämie; Reservemittel bei vasoplegischem Syndrom (z. B. nach HLM).',
 src:[['Methylthioniniumchlorid Proveblue – EPAR (EMA)','https://www.ema.europa.eu/en/medicines/human/EPAR/methylthioninium-chloride-proveblue']]},
});

Object.assign(DRUG_X, {
ondansetron:{x:['5-HT₃-Rezeptoren sitzen an vagalen Afferenzen im Gastrointestinaltrakt und in der Area postrema. Ondansetron wirkt besser gegen Erbrechen als gegen Übelkeit; relative Risikoreduktion etwa 25 %.','Am Ende der OP gegeben am wirksamsten. QT-Verlängerung dosisabhängig (Einzeldosen > 16 mg i.v. nicht mehr zugelassen).'],
 vs:'Etablierter Kombinationspartner zu Dexamethason. Alternativen bei Long-QT: Dexamethason, Aprepitant, Dimenhydrinat, TIVA.',
 src:[['Zofran – Fachinformationen (Gelbe Liste)',GL('Ondansetron')],['Gan TJ et al. 4th Consensus Guidelines PONV (2020)','https://doi.org/10.1213/ANE.0000000000004833']]},
dexamethason:{x:['Dexamethason ist ein langwirksames Glukokortikoid ohne mineralokortikoide Wirkung. Antiemetisch wirkt es mit Latenz – daher zu Beginn der Narkose geben. Zusätzlich analgetischer, abschwellender und stimmungsaufhellender Effekt; verlängert periphere Nervenblockaden (i.v. ebenso wie perineural).','PADDI-Studie (NEJM 2021, 8880 Patienten): 8 mg Dexamethason erhöht die Rate an Wundinfektionen nicht. Blutzuckeranstieg bei Diabetikern beachten.'],
 vs:'Günstigstes und am längsten wirksames PONV-Prophylaktikum; in fast jedem Kombinationsschema enthalten.',
 src:[['Corcoran TB et al. PADDI Trial, NEJM 2021','https://doi.org/10.1056/NEJMoa2107460']]},
droperidol:{x:['Butyrophenon mit D₂-Antagonismus in der Chemorezeptortriggerzone. In niedriger Dosis (0,625–1,25 mg) sehr effektiv; höhere Dosen bringen mehr Sedierung und Dysphorie ohne besseren antiemetischen Effekt.','FDA-Black-Box-Warnung wegen QT-Verlängerung (2001) – in den verwendeten Dosen ist das Risiko vergleichbar mit Ondansetron.'],
 vs:'Wirksam auch gegen Übelkeit durch Opioide (PCA-Zusatz). Bei Parkinson, Long-QT kontraindiziert.',
 src:[['Xomolix – Fachinformationen (Gelbe Liste)',GL('Droperidol')]]},
dimenhydrinat:{x:['Salz aus Diphenhydramin und 8-Chlortheophyllin. Wirkt über H₁- und Muskarinblockade im Vestibularsystem und Brechzentrum; sedierend.'],
 vs:'Gute Option bei Long-QT und in der Pädiatrie; bei Älteren wegen anticholinerger Last zurückhaltend.',
 src:[['Vomex A – Fachinformationen (Gelbe Liste)',GL('Dimenhydrinat')]]},
metoclopramid:{x:['Prokinetisch über 5-HT₄-Agonismus und D₂-Blockade (Magenentleerung↑, Tonus des unteren Ösophagussphinkters↑). Antiemetisch in 10 mg kaum wirksam. EMA 2013: max. 30 mg/d, Therapiedauer ≤ 5 Tage, bei Kindern < 1 J kontraindiziert (Dyskinesien).'],
 vs:'Kein Standard-Antiemetikum; allenfalls vor RSI zur Magenentleerung (Nutzen unsicher).',
 src:[['Paspertin – Fachinformationen (Gelbe Liste)',GL('Metoclopramid')]]},
metamizol:{x:['Metamizol wird zu 4-Methylaminoantipyrin (4-MAA) und 4-Aminoantipyrin hydrolysiert. Es wirkt analgetisch, antipyretisch und spasmolytisch, antiphlogistisch nur schwach. GI- und Nierenrisiken sind gering.','Agranulozytose: immunvermittelt, dosisunabhängig; Inzidenz je nach Studie 1:1500 bis 1:1 000 000, in Deutschland deutlich häufiger als in Ländern mit Verbot angenommen. Die Rote-Hand-Briefe fordern Aufklärung über Warnsymptome und Blutbildkontrollen bei längerer Therapie.','Schnelle i.v.-Gabe kann einen massiven Blutdruckabfall verursachen → Kurzinfusion über ≥ 15 min.'],
 vs:'Für viszerale und kolikartige Schmerzen das beste Nicht-Opioid. In vielen Ländern (USA, UK) nicht zugelassen.',
 src:[['Novaminsulfon – Fachinformationen (Gelbe Liste)',GL('Metamizol')],['BfArM – Rote-Hand-Brief Metamizol (Agranulozytose)','https://www.bfarm.de']]},
paracetamol:{x:['Wirkmechanismus zentral (COX-Hemmung im ZNS bei niedrigem Peroxidtonus, serotonerge Bahnen, AM404 über TRPV1/CB1). Peripher kaum antiphlogistisch.','Fachinformation i.v.: > 50 kg 1 g bis 4 × tgl. (max. 4 g/d); 33–50 kg 15 mg/kg (max. 60 mg/kg und ≤ 3 g/d); bei Risikofaktoren für Hepatotoxizität (Alkohol, Mangelernährung, Leberinsuffizienz, Dehydratation) max. 3 g/d. Dosierungsfehler bei i.v.-Gabe (mg ↔ ml) sind dokumentiert.'],
 vs:'Sicherstes Basisanalgetikum bei Niereninsuffizienz, Blutungsrisiko und Schwangerschaft. Analgetisch schwächer als Metamizol und NSAR; Kombination addiert sich.',
 src:[['Perfalgan – Fachinformationen (Gelbe Liste)',GL('Paracetamol')]]},
ibuprofen:{x:['Nicht selektive, reversible COX-Hemmung. Renale Nebenwirkungen entstehen durch Hemmung vasodilatierender Prostaglandine bei prostaglandinabhängiger Nierenperfusion (Hypovolämie, Herzinsuffizienz, ACE-Hemmer).'],
 vs:'Günstiges NSAR mit geringstem GI-Risiko der klassischen NSAR in niedriger Dosis. Bei Kindern Standard.',
 src:[['Ibuprofen – Fachinformationen (Gelbe Liste)',GL('Ibuprofen')]]},
parecoxib:{x:['Prodrug von Valdecoxib; selektive COX-2-Hemmung ohne Thrombozytenhemmung. In Studien nach aortokoronarer Bypass-OP erhöhte kardiovaskuläre Ereignisse → dort kontraindiziert.'],
 vs:'Vorteilhaft bei Blutungsrisiko (keine Plättchenhemmung); bei kardiovaskulären Risikopatienten meiden.',
 src:[['Dynastat – EPAR (EMA)','https://www.ema.europa.eu/en/medicines/human/EPAR/dynastat']]},
tranexamsaeure:{x:['Tranexamsäure besetzt die Lysin-Bindungsstellen von Plasminogen und verhindert die Bindung an Fibrin → Fibrinolyse gehemmt. In hoher Dosis hemmt sie GABA-A- und Glycinrezeptoren → Krampfanfälle (v. a. Herzchirurgie mit > 50–100 mg/kg).','Evidenz: CRASH-2 (Trauma, Nutzen bei Gabe < 3 h, Schaden danach), WOMAN (PPH, weniger Verblutungstod bei früher Gabe), CRASH-3 (SHT, Nutzen bei leichtem/mittlerem SHT). S3 Polytrauma: 1 g über 10 min bei manifester oder drohender Blutung.','Verwechslung mit intrathekal applizierten LA-Ampullen hat zu tödlichen Verläufen geführt – Ampullen getrennt lagern.'],
 vs:'Frühe, günstige Standardmaßnahme bei relevanter Blutung und in der elektiven Orthopädie/Herzchirurgie.',
 src:[['S3-Leitlinie Polytrauma/Schwerverletzten-Behandlung (2023)','https://register.awmf.org/de/leitlinien/detail/187-023']]},
protamin:{x:['Protamin (aus Fischsperma) ist stark basisch und neutralisiert saures Heparin. 1 mg (bzw. 100 IE Protamin) neutralisiert etwa 100 IE Heparin; die Dosis richtet sich nach der noch wirksamen Heparinmenge (HWZ 1–2 h) oder nach ACT/Heparin-Dosis-Kurve.','Protaminreaktionen: Typ I Hypotonie durch schnelle Gabe (Histamin), Typ II anaphylaktisch/anaphylaktoid, Typ III katastrophale pulmonale Vasokonstriktion mit Rechtsherzversagen. Risikofaktoren: NPH-/Protamin-Insulin, Fischallergie, Vasektomie.'],
 vs:'Einziges Antidot für UFH; bei NMH nur partiell wirksam (Anti-Xa etwa 60 %), bei Fondaparinux wirkungslos.',
 src:[['Protamin ME – Fachinformationen (Gelbe Liste)',GL('Protamin')]]},
heparin:{x:['UFH bindet über eine Pentasaccharid-Sequenz an Antithrombin und beschleunigt dessen Wirkung etwa 1000-fach. Für die Thrombinhemmung muss die Kette zusätzlich Thrombin binden (≥ 18 Saccharide) – deshalb hemmt NMH vorwiegend Xa.','HIT II: IgG-Antikörper gegen Plättchenfaktor-4/Heparin-Komplexe aktivieren Thrombozyten → Thrombozytenabfall > 50 % an Tag 5–14 (früher bei Vorexposition) mit paradoxen Thrombosen. 4-T-Score, Labortest (PF4-AK, HIPA), Therapie: Heparin stopp, Argatroban oder Danaparoid.','In der Herzchirurgie: 300–400 IE/kg vor Kanülierung, Ziel-ACT > 400–480 s; bei Heparinresistenz (AT-Mangel) AT-Konzentrat.'],
 vs:'UFH ist kurz wirksam und antagonisierbar → Mittel der Wahl bei HLM, ECMO, Gefäßchirurgie, Niereninsuffizienz. NMH ist für Prophylaxe und Therapie praktischer.',
 src:[['Heparin – Fachinformationen (Gelbe Liste)',GL('Heparin')]]},
ppsb:{x:['Prothrombinkomplex-Konzentrate enthalten die Vitamin-K-abhängigen Faktoren II, VII, IX, X sowie Protein C und S, meist mit etwas Heparin und AT. Die Wirkung setzt sofort ein; Faktor VII hat die kürzeste HWZ (≈ 6 h), deshalb gleichzeitig Vitamin K geben.','Bei Blutung unter Xa-Hemmern (ohne verfügbares Andexanet oder wenn intraoperativ Heparin nötig ist) werden 25–50 IE/kg empfohlen.'],
 vs:'Schneller und volumensparender als FFP für die Aufhebung von VKA. Thrombogen – nicht bei DIC ohne Blutung.',
 src:[['Querschnitts-Leitlinien Hämotherapie (BÄK 2020)','https://www.bundesaerztekammer.de/themen/medizin-und-ethik/wissenschaftlicher-beirat/veroeffentlichungen/haemotherapie-transfusionsmedizin/querschnitt-leitlinie']]},
fibrinogen:{x:['Fibrinogen ist das Substrat der Gerinnselbildung und fällt bei Massivblutung und Dilution als Erstes unter kritische Werte. Zielwerte: ≥ 1,5–2 g/l, in der Geburtshilfe ≥ 2 g/l (FIBTEM A5 ≥ 12 mm). Faustregel: 1 g hebt den Spiegel bei 70 kg um etwa 0,25 g/l.'],
 vs:'Konzentrat ist schneller und volumenärmer als FFP oder Kryopräzipitat.',
 src:[['Haemocomplettan P – Fachinformationen (Gelbe Liste)',GL('Haemocomplettan')]]},
dantrolen:{x:['Dantrolen bindet am Ryanodin-Rezeptor 1 (RYR1) der Skelettmuskulatur und verhindert die unkontrollierte Ca²⁺-Freisetzung aus dem sarkoplasmatischen Retikulum. Es wirkt nicht auf den kardialen RYR2.','EMHG 2024: 2–2,5 mg/kg nach tatsächlichem Körpergewicht (max. 300 mg pro Einzeldosis), Wiederholung alle 10 min bis zum Ansprechen (sinkendes etCO₂, HF, Temperatur); Gesamtdosen > 10 mg/kg sind möglich. Jede Einrichtung mit Triggeranästhetika muss sofort eine initiale Dosis vorhalten.','Das klassische Präparat (20 mg + 3 g Mannitol, in 60 ml Aqua) löst sich schlecht → Personal einteilen. Agilus (120 mg in 20 ml) ist schneller zubereitet.'],
 vs:'Einzige kausale Therapie der MH; Letalität ohne Dantrolen > 70 %, mit Dantrolen < 5 %.',
 src:[['EMHG 2024 – Recognising and managing an MH crisis','https://www.emhg.org/recommendations-1/2024/11/4/recognising-and-managing-a-malignant-hyperthermia-crisis-v2024']]},
magnesium:{x:['Magnesium antagonisiert Calcium an spannungsabhängigen Kanälen und an der motorischen Endplatte (ACh-Freisetzung↓), blockiert NMDA-Rezeptoren und stabilisiert Membranen.','Eklampsie: Mittel der Wahl zur Anfallsprophylaxe und -therapie (Magpie-Studie). Überdosierungszeichen staffeln sich: Verlust des Patellarsehnenreflexes (~5 mmol/l) → Atemdepression (~6–7 mmol/l) → Herzstillstand (> 12 mmol/l). Antidot Calcium.'],
 vs:'Vielseitig: Torsade, Asthma, Eklampsie, Analgesie-Adjuvans. Verstärkt Relaxanzien – Relaxometrie!',
 src:[['S2k-Leitlinie Hypertensive Schwangerschaftserkrankungen','https://register.awmf.org/de/leitlinien/detail/015-018']]},
calcium:{x:['Calciumchlorid 10 % enthält etwa dreimal mehr elementares Calcium pro ml als Calciumgluconat 10 % (6,8 vs. 2,3 mmol/10 ml). Chlorid ist venenreizend (möglichst zentral), Gluconat peripher verträglicher.','Bei Massivtransfusion bindet Citrat ionisiertes Calcium; iCa < 0,9–1,0 mmol/l beeinträchtigt Gerinnung und Kontraktilität.'],
 vs:'Kein Routinemedikament bei Reanimation – nur bei Hyperkaliämie, Hypokalzämie oder Ca-Antagonisten-Intoxikation.',
 src:[['S3-Leitlinie Polytrauma (Normokalzämie)','https://register.awmf.org/de/leitlinien/detail/187-023']]},
bicarbonat:{x:['NaHCO₃ puffert H⁺ zu CO₂ und Wasser; das CO₂ muss abgeatmet werden, sonst entsteht eine intrazelluläre Azidose (CO₂ diffundiert, HCO₃⁻ nicht). Bei TCA-Intoxikation wirkt die Natriumlast antiarrhythmisch an blockierten Na⁺-Kanälen.'],
 vs:'Nur gezielt einsetzen (Hyperkaliämie mit Azidose, TCA, schwere Azidose mit pH < 7,1). Laktatazidose durch Bicarbonat nicht behandeln, sondern Ursache.',
 src:[['Natriumhydrogencarbonat 8,4 % – Fachinformationen (Gelbe Liste)',GL('Natriumhydrogencarbonat')]]},
salbutamol:{x:['β₂-Agonist; relaxiert Bronchialmuskulatur über cAMP. Bei beatmeten Patienten wird nur ein kleiner Teil der Dosis deponiert (Adapter im Inspirationsschenkel, synchron mit Inspiration auslösen).','Stoffwechseleffekte: Kalium-Shift nach intrazellulär (Therapie der Hyperkaliämie), Laktatanstieg, Hyperglykämie.'],
 vs:'Erstlinie beim Bronchospasmus; Adrenalin und Magnesium als Eskalation.',
 src:[['Sultanol – Fachinformationen (Gelbe Liste)',GL('Salbutamol')]]},
dimetinden:{x:['H₁-Antagonist der ersten Generation. In der Anaphylaxie lindert er Haut- und Schleimhautsymptome, hat aber keine gesicherte Wirkung auf Schock oder Bronchospasmus. Leitlinie 2021: Dimetinden 0,1 mg/kg bzw. Clemastin 0,05 mg/kg i.v.'],
 vs:'Ergänzung, nie Ersatz für Adrenalin.',
 src:[['S2k-Leitlinie Anaphylaxie (Update 2021)','https://register.awmf.org/de/leitlinien/detail/061-025']]},
prednisolon:{x:['Glukokortikoide wirken genomisch mit einer Latenz von Stunden. In der Anaphylaxie sollen sie protrahierte und biphasische Verläufe abschwächen – die Evidenz dafür ist schwach.'],
 vs:'Nachrangig in der Akuttherapie. In der Asthmaexazerbation früh sinnvoll.',
 src:[['S2k-Leitlinie Anaphylaxie (Update 2021)','https://register.awmf.org/de/leitlinien/detail/061-025']]},
hydrocortison:{x:['Hydrocortison entspricht dem körpereigenen Cortisol mit gluko- und mineralokortikoider Wirkung. Die perioperative Stressdosis soll eine Addison-Krise verhindern bei Patienten mit supprimierter HPA-Achse (≥ 5 mg Prednisolon-Äquivalent > 3–4 Wochen).','Septischer Schock: 200 mg/d bei anhaltendem Vasopressorbedarf (Surviving Sepsis 2021), beschleunigt Schockumkehr.'],
 vs:'Einziges Steroid mit relevanter mineralokortikoider Wirkung → Mittel der Wahl bei NNR-Insuffizienz.',
 src:[['Surviving Sepsis Campaign 2021','https://doi.org/10.1097/CCM.0000000000005337']]},
oxytocin:{x:['Oxytocin-Rezeptoren im Myometrium nehmen am Termin stark zu. Ein schneller Bolus verursacht Vasodilatation, Tachykardie, Hypotonie und ST-Senkungen – bei Hypovolämie gefährlich. Deshalb langsam und in niedriger Dosis (3 IE), gefolgt von Infusion.','Carbetocin (100 µg) wirkt länger (HWZ 40 min) und ersetzt die Infusion. Eskalation bei Atonie: Sulproston (PGE₂-Analogon, max. 1500 µg/24 h, nie als Bolus), Methylergometrin (KI Präeklampsie, Hypertonie).'],
 vs:'Erstlinien-Uterotonikum; Anästhesie steuert die Dosis bei Sectio mit.',
 src:[['S2k-Leitlinie Peripartale Blutungen, Diagnostik und Therapie (2022)','https://register.awmf.org/de/leitlinien/detail/015-063']]},
idarucizumab:{x:['Humanisiertes Fab-Fragment mit sehr hoher Affinität zu Dabigatran und dessen Metaboliten. Die Aufhebung erfolgt innerhalb von Minuten, unabhängig von Nierenfunktion (RE-VERSE AD).'],
 vs:'Spezifisches Antidot – nur für Dabigatran.',
 src:[['Praxbind – EPAR (EMA)','https://www.ema.europa.eu/en/medicines/human/EPAR/praxbind']]}
});
