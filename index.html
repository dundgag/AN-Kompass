Object.assign(DRUG_X, {
hydromorphon:{x:['Hydromorphon ist hydrophiler als Fentanyl und lipophiler als Morphin. Durch fehlende relevant aktive Metaboliten geeigneter bei Niereninsuffizienz und Älteren; wegen hoher Potenz auf Dosierungsfehler achten (Verwechslung mit Morphin).'],vs:'Gute Alternative zu Morphin und Piritramid für PCA und Tumorschmerz.',src:[['Palladon – Fachinformationen (Gelbe Liste)',GL('Hydromorphon')]]},
pethidin:{x:['Pethidin ist ein schwaches Opioid mit atropinartiger Wirkung. Der Metabolit Norpethidin kumuliert bei Niereninsuffizienz und senkt die Krampfschwelle. Mit MAO-Hemmern (auch Linezolid, Methylenblau) droht ein Serotoninsyndrom.'],vs:'Heute nur noch zur Behandlung des postoperativen Kältezitterns (Shivering) sinnvoll; Clonidin ist eine Alternative ohne Opioid.',src:[['Dolantin – Fachinformationen (Gelbe Liste)',GL('Pethidin')]]},
vecuronium:{x:['Vecuronium entspricht Pancuronium ohne eine Methylgruppe (monoquartär) – dadurch keine Vagolyse. Muss als Pulver gelöst werden; kumuliert auf der Intensivstation über den aktiven 3-Desacetyl-Metaboliten.'],vs:'Durch Rocuronium weitgehend ersetzt (schnellerer Anschlag, gebrauchsfertig).',src:[['Vecuronium – Fachinformationen (Gelbe Liste)',GL('Vecuronium')]]},
atracurium:{x:['Atracurium zerfällt organunabhängig (Hofmann-Elimination und Esterhydrolyse). Histaminfreisetzung limitiert die Dosis; Laudanosin ist in hohen Konzentrationen prokonvulsiv.'],vs:'Durch Cisatracurium ersetzt.',src:[['Tracrium – Fachinformationen (Gelbe Liste)',GL('Atracurium')]]},
levosimendan:{x:['Levosimendan stabilisiert die Ca²⁺-gebundene Konformation des Troponin C und steigert so die Kontraktilität, ohne den intrazellulären Ca²⁺-Spiegel und den O₂-Verbrauch zu erhöhen. Über K-ATP-Kanäle entsteht eine Vasodilatation (auch koronar und pulmonal).','Der lang wirksame Metabolit OR-1896 hält die Wirkung über eine Woche aufrecht. Große Studien in der Herzchirurgie (LEVO-CTS, LICORN, CHEETAH) zeigten keinen Mortalitätsvorteil.'],vs:'Sinnvoll bei β-Blocker-behandelten Patienten und Low-Output, wo Dobutamin schlecht wirkt; Hypotonie erfordert oft Noradrenalin.',src:[['Simdax – Fachinformationen (Gelbe Liste)',GL('Levosimendan')]]},
milrinon:{x:['PDE-3-Hemmung erhöht cAMP unabhängig vom β-Rezeptor – wirksam bei β-Rezeptor-Downregulation (chronische Herzinsuffizienz, β-Blocker). Starke Senkung des pulmonalen Widerstands; inhalativ selektiver pulmonal.'],vs:'Mittel der Wahl beim Rechtsherzversagen mit pulmonaler Hypertonie; bei Niereninsuffizienz Dosis reduzieren.',src:[['Corotrop – Fachinformationen (Gelbe Liste)',GL('Milrinon')]]},
nitroprussid:{x:['Ein Molekül Nitroprussid setzt fünf Cyanid-Ionen frei. Rhodanase entgiftet mit Thiosulfat zu Thiocyanat (renal). Bei hohen Dosen, langer Gabe oder Thiosulfatmangel: Cyanidintoxikation mit Laktatazidose, steigender zentralvenöser Sättigung und Tachyphylaxie. Lichtempfindlich – Perfusor abdunkeln.'],vs:'Stärkster und am schnellsten steuerbarer Vasodilatator; wegen Toxizität nur kurzfristig.',src:[['nipruss – Fachinformationen (Gelbe Liste)',GL('Nitroprussid')]]},
ino:{x:['Inhaliertes NO erreicht nur ventilierte Alveolen und dilatiert dort die Gefäße → Umverteilung der Perfusion zu belüfteten Arealen (Shunt↓) und Senkung des PVR ohne systemische Hypotonie. Beim Absetzen droht eine Rebound-pulmonale Hypertonie (schrittweise ausschleichen, ggf. Sildenafil).'],vs:'Selektiver als i.v.-Vasodilatatoren; teuer. Beim ARDS verbessert es die Oxygenierung vorübergehend, senkt aber nicht die Mortalität.',src:[['INOmax – EPAR (EMA)','https://www.ema.europa.eu/en/medicines/human/EPAR/inomax']]},
dihydralazin:{x:['Dihydralazin wirkt ausschließlich arteriell; die Reflextachykardie wird oft mit β-Blocker abgefangen. In der Präeklampsie neben Urapidil und Nifedipin etabliert; Überschießende Senkung gefährdet die Plazentaperfusion.'],vs:'Urapidil ist besser steuerbar und macht weniger Tachykardie.',src:[['S2k-Leitlinie Hypertensive Schwangerschaftserkrankungen','https://register.awmf.org/de/leitlinien/detail/015-018']]},
enoxaparin:{x:['NMH haben eine bessere Bioverfügbarkeit s.c. (> 90 %), eine längere HWZ und eine vorhersagbarere Dosis-Wirkungs-Beziehung als UFH. Sie werden renal eliminiert – bei CrCl < 30 ml/min kumulieren sie.'],vs:'Standard für Prophylaxe und Therapie; UFH bleibt bei Niereninsuffizienz, geplanter Antagonisierung und HLM überlegen.',src:[['S1-Leitlinie Rückenmarknahe RA und antithrombotische Medikation (2021)','https://register.awmf.org/de/leitlinien/detail/001-005']]},
argatroban:{x:['Argatroban hemmt Thrombin direkt, auch gerinnselgebundenes. Wegen hepatischer Elimination bei Niereninsuffizienz Mittel der Wahl für HIT II; bei Leberdysfunktion und Intensivpatienten mit 0,5 µg/kg/min oder weniger beginnen.'],vs:'Gegenüber Bivalirudin/Danaparoid kürzere HWZ, nicht renal.',src:[['Argatra – Fachinformationen (Gelbe Liste)',GL('Argatroban')]]},
desmopressin:{x:['Desmopressin setzt vWF-Multimere und F VIII aus den Weibel-Palade-Körperchen frei und verbessert die Thrombozytenadhäsion. Wirksam bei urämischer Thrombozytopathie und unter Thrombozytenaggregationshemmern. Nach 2–3 Gaben sind die Speicher leer (Tachyphylaxie). Flüssigkeitsrestriktion wegen Hyponatriämie.'],vs:'Günstige Option bei Thrombozytenfunktionsstörung; bei schwerem vWS Faktorenkonzentrat.',src:[['Minirin parenteral – Fachinformationen (Gelbe Liste)',GL('Desmopressin')]]},
andexanet:{x:['Andexanet bindet Xa-Hemmer im Plasma und hebt die Anti-Xa-Aktivität rasch auf; nach Infusionsende kehrt sie teilweise zurück. Da es auch den Heparin-Antithrombin-Komplex bindet, entsteht eine Heparinresistenz – nicht vor HLM oder anderen Eingriffen mit Heparinbedarf.'],vs:'Spezifisch, aber teuer und prothrombotisch; PPSB 25–50 IE/kg ist die Alternative.',src:[['Ondexxya – EPAR (EMA)','https://www.ema.europa.eu/en/medicines/human/EPAR/ondexxya']]},
vitamink:{x:['Vitamin K braucht Stunden, weil die Faktoren erst neu synthetisiert werden müssen. Oral wirkt es ähnlich schnell wie i.v., i.v. aber zuverlässiger.'],vs:'Immer zusammen mit PPSB bei Notfall-Reversal von VKA.',src:[['Konakion MM – Fachinformationen (Gelbe Liste)',GL('Phytomenadion')]]},
sulproston:{x:['Sulproston ist ein starkes Uterotonikum der zweiten Linie. Kardiovaskuläre Komplikationen (Koronarspasmus, Infarkt) sind v. a. bei Bolusgabe und hoher Dosis beschrieben.'],vs:'Eskalationsstufe nach Oxytocin/Carbetocin; parallel chirurgische Optionen vorbereiten.',src:[['S2k-Leitlinie Peripartale Blutungen (2022)','https://register.awmf.org/de/leitlinien/detail/015-063']]},
aprepitant:{x:['Aprepitant blockiert NK₁-Rezeptoren im Hirnstamm. In PONV-Studien besonders gut gegen Erbrechen. Enzyminduktion (CYP2C9) → Wirkungsverlust hormoneller Kontrazeptiva bis 28 Tage.'],vs:'Drittes oder viertes Wirkprinzip bei Hochrisikopatienten.',src:[['Gan TJ et al. 4th Consensus Guidelines PONV (2020)','https://doi.org/10.1213/ANE.0000000000004833']]}
});

  {h:'Bestandteile des Kreissystems', type:'list', items:['Frischgaszufuhr, Verdampfer (außerhalb des Kreises)','In- und Exspirationsventil, Y-Stück, Beatmungsbeutel/Ventilator, APL-Ventil','CO₂-Absorber: Ca(OH)₂ + CO₂ → CaCO₃ + H₂O (exotherm); Farbindikator; moderne Kalke ohne starke Basen','Narkosegasfortleitung (Absaugung)']},
  {h:'Gerätecheck', type:'list', items:['Vor jedem Betriebsbeginn vollständig (Selbsttest), vor jedem Patienten Kurzcheck: O₂-Versorgung, Dichtigkeit, Ventile, Beutel/Handbeatmung, Absaugung, Monitoring, Verdampferfüllung','Reserve: Beatmungsbeutel und O₂-Flasche unabhängig vom Gerät']},
  {h:'Niedrigflussnarkose', type:'list', items:['Low-Flow ≤ 1 l/min, Minimal-Flow ≤ 0,5 l/min Frischgas','Vorteile: weniger Narkosegasverbrauch und Emission, Anfeuchtung und Erwärmung der Atemgase','Voraussetzungen: dichtes System, Gasmonitoring (inspiratorische O₂-Konzentration ≥ 0,3, Narkosegas in- und exspiratorisch), zu Beginn höherer Flow (Denitrogenisierung, Anfluten)','Zeitkonstante T = Systemvolumen / Frischgasfluss – bei niedrigem Flow ändern sich Konzentrationen langsam']}
 ]},
{id:'monitoring', t:'Monitoring & Gefäßzugänge', cat:'Physiologie & Monitoring', sum:'EKG, Pulsoxymetrie, Kapnographie, arterielle Druckmessung, ZVK, HZV-Messung.',
 sec:[
  {h:'Basismonitoring', type:'list', items:['EKG: Ableitung II (Rhythmus, P-Welle) + V5 (Ischämie; zusammen ca. 80 % der Ischämien erkannt)','Pulsoxymetrie: Absorption bei 660 nm (Deoxy-Hb) und 940 nm (Oxy-Hb); Fehler bei CO-Hb (falsch hoch), MetHb (~85 %), Methylenblau/Indocyaningrün (falsch niedrig), Vasokonstriktion, Bewegung','Nicht-invasive Blutdruckmessung: Manschettenbreite ca. 40 % des Oberarmumfangs – zu schmal → falsch hoch','Kapnographie, Atemgase, Temperatur, Relaxometrie, ggf. EEG']},
  {h:'Kapnographie – typische Kurven', type:'table', rows:[['Befund','Ursache'],['Plötzlich 0','Diskonnektion, Fehlintubation, Kreislaufstillstand, Totalobstruktion'],['Allmählicher Abfall','Hyperventilation, HZV↓, Hypothermie'],['Plötzlicher Abfall (nicht 0)','Lungenembolie (Luft/Thrombus), massiver HZV-Abfall, Leck'],['Anstieg','Hypoventilation, Hypermetabolismus (MH, Sepsis, Thyreotoxikose), CO₂-Insufflation, Bicarbonat, Tourniquet-Öffnung'],['Anstieg der Basislinie','Rückatmung (Ventil defekt, Kalk erschöpft)'],['Haifischflosse','Obstruktion (Bronchospasmus, COPD, Tubusknick)'],['Curare-Kerbe','Spontanatemversuch unter Restrelaxierung']]},
  {h:'Arterielle Druckmessung', type:'list', items:['Indikationen: große OP, Instabilität, Katecholamine, häufige BGA, erwartete große Volumenverschiebungen','A. radialis (Allen-Test hat geringen Vorhersagewert), A. femoralis, A. brachialis','Fehler: Überdämpfung (Luftblasen, Knick) → syst. zu niedrig; Unterdämpfung/Resonanz → syst. zu hoch; Nullpunkt auf Höhe des rechten Vorhofs (4. ICR mittlere Axillarlinie)']},
  {h:'Zentraler Venenkatheter', type:'list', items:['Indikationen: Katecholamine, venenreizende Substanzen, fehlende periphere Zugänge, ZVD/ScvO₂, Luftaspiration (sitzende Position)','Zugang: V. jugularis interna ultraschallgesteuert (Standard), V. subclavia (niedrigste Infektionsrate, höheres Pneumothoraxrisiko), V. femoralis','Lagekontrolle: Spitze am cavoatrialen Übergang; EKG-gesteuert (P-Wellen-Überhöhung), Sono, Röntgen','Komplikationen: arterielle Punktion, Pneumothorax, Luftembolie, Arrhythmie, Infektion, Thrombose']},
  {h:'Weitere Zugänge', type:'list', items:['Intraossär (Tibia proximal, Humeruskopf): alle Notfallmedikamente möglich, Flussraten mit Druck','Periphere Venen: Durchfluss nach Hagen-Poiseuille – 14 G ≈ 300 ml/min, 18 G ≈ 100 ml/min','Shaldon/Rapid Infusion Catheter für Massivtransfusion']}
 ]},
{id:'neuromon', t:'Neuromonitoring', cat:'Physiologie & Monitoring', sum:'Narkosetiefe (EEG, BIS), evozierte Potenziale, NIRS, TCD.',
 sec:[
  {h:'Narkosetiefe', type:'list', items:['Prozessierte EEG-Indizes (BIS, Narcotrend, Entropie): Zielbereich z. B. BIS 40–60','Rohes EEG lesen: Alpha-/Deltaoszillationen unter Propofol/Volatilen, Burst-Suppression = zu tief','Ketamin und N₂O erhöhen die Indizes paradox; Relaxanzien (EMG) verfälschen','Nutzen: Vermeidung intraoperativer Wachheit (Awareness) bei TIVA mit Relaxans, Vermeidung zu tiefer Narkose (Delir bei Älteren)']},
  {h:'Evozierte Potenziale (IONM)', type:'table', rows:[['Methode','Überwacht','Einfluss der Anästhesie'],['SSEP','sensible Bahnen (Hinterstrang)','Volatile senken Amplitude, verlängern Latenz → TIVA bevorzugt, ≤ 0,5 MAC'],['MEP','motorische Bahnen (Pyramidenbahn)','Sehr empfindlich für Volatile und Relaxanzien → TIVA, keine/kontrollierte Relaxierung'],['AEP','Hörbahn','relativ robust'],['VEP','Sehbahn','sehr empfindlich']]},
  {h:'NIRS und TCD', type:'list', items:['NIRS: regionale zerebrale O₂-Sättigung (frontal), Trend wichtiger als Absolutwert; Abfall > 20 % vom Ausgangswert relevant (Herzchirurgie, Carotis, Beach-Chair)','Transkranieller Doppler: Flussgeschwindigkeit A. cerebri media, Emboliedetektion, Vasospasmus nach SAB']}
 ]},
{id:'ultraschall', t:'Ultraschall in der Anästhesie', cat:'Physiologie & Monitoring', sum:'Gefäßpunktion, Lungensono, FoCUS, Magensono, Atemwegs-Sono.',
 sec:[
  {h:'Anwendungen', type:'list', items:['Gefäßzugänge: ZVK (Standard), arteriell, schwierige periphere Venen','Regionalanästhesie (In-plane/Out-of-plane)','Lunge: Lungengleiten (fehlt bei Pneumothorax, Lungenpunkt beweisend), B-Linien (interstitielles Ödem), Konsolidierung, Pleuraerguss','Fokussierte Echokardiographie (FoCUS): Pumpfunktion, Perikarderguss/Tamponade, RV-Dilatation (LAE), Füllung','eFAST beim Trauma, Magensonographie (antrale Fläche, Flüssigkeit > 1,5 ml/kg = Risiko), Membrana cricothyroidea markieren']},
  {h:'Physik', type:'list', items:['Hohe Frequenz (Linearschallkopf 7–15 MHz): gute Auflösung, geringe Eindringtiefe (Gefäße, Nerven)','Niedrige Frequenz (Konvex/Sektor 2–5 MHz): tief (Abdomen, Herz)','Artefakte: A-Linien (Reverberation der Pleura), Schallschatten, akustische Verstärkung']}
 ]},
{id:'antibiose', t:'Perioperative Antibiotika- & Endokarditisprophylaxe', cat:'Perioperativ', sum:'Zeitpunkt, Substanz, Wiederholung, Endokarditis-Risikogruppen.',
 sec:[
  {h:'PAP-Grundregeln', type:'list', items:['Gabe 30–60 min vor Schnitt (Vancomycin/Chinolone 60–120 min, Infusionsdauer beachten)','Standard: Cefazolin 2 g i.v. (≥ 120 kg: 3 g); bei kolorektalen Eingriffen + Metronidazol 500 mg','Wiederholung bei langer OP (Cefazolin nach ca. 4 h) oder Blutverlust > 1500 ml','Meist Einzeldosis; Verlängerung über 24 h bringt keinen Nutzen, fördert Resistenzen','Penicillinallergie: meist Cefazolin trotzdem möglich (geringe Kreuzreaktivität); bei schwerer Sofortreaktion Clindamycin oder Vancomycin']},
  {h:'Endokarditisprophylaxe (ESC 2023)', type:'list', items:['Nur Hochrisikopatienten: Klappenprothese (auch TAVI, Ringe), frühere Endokarditis, bestimmte angeborene Herzfehler (zyanotisch, bis 6 Monate nach Korrektur, Restdefekte), VAD','Nur bei zahnärztlichen Eingriffen mit Manipulation der Gingiva/periapikal (Amoxicillin 2 g p.o./i.v. 30–60 min vorher; Allergie: Cefalexin, Azithromycin/Clarithromycin, Doxycyclin)','Für andere Eingriffe (GI, Urogenital) keine Routineprophylaxe; bei bestehender Infektion Therapie mit Enterokokken-Wirkung']}
 ]},
{id:'thermo', t:'Thermomanagement', cat:'Perioperativ', sum:'Physiologie, Hypothermie-Phasen, Folgen, Messorte, Wärmeverfahren.',
 sec:[
  {h:'Perioperative Hypothermie (< 36 °C)', type:'steps', items:['Phase 1 (erste Stunde): Umverteilung von Kern zu Schale durch Vasodilatation – Kern fällt um 1–1,5 °C','Phase 2 (2–4 h): lineare Abnahme, Wärmeverlust > Produktion (Strahlung, Konvektion, Konduktion, Evaporation)','Phase 3: Plateau durch wiederkehrende Vasokonstriktion bzw. passives Gleichgewicht']},
  {h:'Folgen', type:'list', items:['Blutverlust und Transfusionsbedarf ↑ (Gerinnung, Thrombozyten)','Wundinfektionen ↑, kardiale Ereignisse ↑, Kältezittern (O₂-Verbrauch ↑)','Verlängerte Wirkung von Relaxanzien und Anästhetika, verzögertes Erwachen']},
  {h:'Maßnahmen (S3-Leitlinie Vermeidung von perioperativer Hypothermie)', type:'list', items:['Vorwärmen (Prewarming) 10–30 min mit konvektiver Wärme vor Einleitung','Aktive Wärmung ab 30 min Narkosedauer (Wärmedecke, Unterlagen)','Infusions- und Blutwärmung ab 500 ml/h','Temperatur messen: Kerntemperatur (Ösophagus, Nasopharynx, Blase, Pulmonalarterie, Trommelfell/Zero-heat-flux)','Ziel ≥ 36 °C bei Narkoseende']}
 ]},
{id:'lagerung', t:'Lagerung & Lagerungsschäden', cat:'Perioperativ', sum:'Verantwortung, Standardlagerungen, typische Nervenschäden, Vorgehen bei Schaden.',
 sec:[
  {h:'Verantwortung', type:'list', items:['Lagerung zur Einleitung/Überwachung: Anästhesie; Lagerung für den Eingriff: Chirurgie – Vertrauensgrundsatz, gegenseitige Kontrolle','Dokumentation von Lagerung und Kontrollen']},
  {h:'Typische Schäden', type:'table', rows:[['Nerv / Struktur','Mechanismus'],['N. ulnaris (häufigster)','Druck im Sulcus bei Pronation/Flexion am Ellenbogen'],['Plexus brachialis','Abduktion > 90°, Kopfdrehung zur Gegenseite, Schulterstützen'],['N. radialis','Druck am Oberarm (Bügel, Manschette)'],['N. peroneus','Druck am Fibulaköpfchen (Steinschnitt, Seitenlage)'],['N. femoralis / cutaneus femoris lat.','Steinschnitt mit starker Hüftflexion'],['Auge','Druck bei Bauchlage → Zentralarterienverschluss, ischämische Optikusneuropathie (Wirbelsäulen-OP, Hypotonie, Anämie)'],['Haut','Druckulzera, Verbrennung durch HF-Chirurgie (Neutralelektrode, feuchte Unterlagen)']]},
  {h:'Besondere Lagerungen', type:'list', items:['Bauchlage: Abdomen frei (V. cava), Augen und Gesicht druckfrei, Tubus sicher fixieren','Beach-Chair: zerebrale Hypoperfusion → Blutdruck auf Höhe des Kopfes beziehen (hydrostatischer Unterschied ~0,77 mmHg/cm)','Steile Kopftieflage (Roboter-Prostatektomie): Hirn- und Augeninnendruck ↑, Gesichts-/Larynxödem, Beatmungsdruck ↑']},
  {h:'Vorgehen bei Schaden', type:'steps', items:['Befund dokumentieren (Zeitpunkt, Art, Umstände)','Neurologisches Konsil, ggf. Elektrophysiologie (frühe Basisuntersuchung, erneut nach 2–3 Wochen)','Patienten offen informieren, Haftpflicht/Versicherung melden']}
 ]},
{id:'analgosed', t:'Stand-by & Analgosedierung', cat:'Einleitung & Narkose', sum:'Sedierungstiefen, personelle und apparative Voraussetzungen, Medikamente.',
 sec:[
  {h:'Sedierungsstufen (ASA)', type:'table', rows:[['Stufe','Reaktion','Atemweg/Atmung','Kreislauf'],['Minimal (Anxiolyse)','normal auf Ansprache','unbeeinträchtigt','unbeeinträchtigt'],['Moderat','gezielt auf Ansprache/Berührung','keine Intervention nötig','meist erhalten'],['Tief','gezielt auf wiederholten/Schmerzreiz','Intervention evtl. nötig','meist erhalten'],['Allgemeinanästhesie','nicht erweckbar','Intervention oft nötig','kann beeinträchtigt sein']]},
  {h:'Voraussetzungen', type:'list', items:['Aufklärung, Nüchternheit wie bei Narkose','Monitoring: SpO₂, EKG, NIBP, Kapnographie (auch bei Sedierung empfohlen)','Personal: eine Person ausschließlich für Sedierung und Überwachung zuständig; Notfallausrüstung inkl. Atemwegsmanagement']},
  {h:'Medikamente', type:'list', items:['Propofol titriert (Boli 10–20 mg oder 1–4 mg/kg/h)','Remifentanil 0,025–0,1 µg/kg/min, Midazolam 0,5–1 mg-Boli','Esketamin niedrig dosiert, Dexmedetomidin (erhaltene Atmung)','Kombinationen wirken synergistisch → Atemdepression']}
 ]},
{id:'ambulant', t:'Ambulante Anästhesie', cat:'Perioperativ', sum:'Patientenauswahl, Anästhesieverfahren, Entlassungskriterien.',
 sec:[
  {h:'Patientenauswahl', type:'list', items:['Stabile Vorerkrankungen (ASA I–III), Adipositas und Alter allein kein Ausschluss','Eingriffe mit geringem Blutverlust und beherrschbarem Schmerz','Soziale Voraussetzungen: Begleitperson, Betreuung 24 h, Erreichbarkeit']},
  {h:'Anästhesie', type:'list', items:['Kurz wirksame Substanzen: Propofol, Remifentanil/Alfentanil, Sevofluran, Rocuronium + Sugammadex','Larynxmaske, großzügige PONV-Prophylaxe, multimodale Analgesie, Regionalverfahren','Kurze Spinalanästhesie: Prilocain 2 % hyperbar oder Chloroprocain']},
  {h:'Entlassung', type:'list', items:['Stabile Vitalzeichen, orientiert, mobil, Schmerzen kontrolliert, keine relevante PONV','Nach Spinalanästhesie: Motorik zurück; Spontanmiktion je nach Eingriff/Risiko','Schriftliche Instruktionen, 24 h kein Autofahren, keine wichtigen Entscheidungen, Notfallnummer']}
 ]},
{id:'aussen', t:'Anästhesie an Außenarbeitsplätzen', cat:'Spezielle Anästhesie', sum:'MRT, interventionelle Radiologie, Endoskopie, EKT.',
 sec:[
  {h:'Grundsätze', type:'list', items:['Gleicher Standard wie im OP (Monitoring, Gerät, Notfallausrüstung, Hilfe erreichbar)','Oft eingeschränkter Zugang zum Patienten, fremdes Team, lange Wege']},
  {h:'MRT', type:'list', items:['MR-taugliche Geräte und Monitore, verlängerte Leitungen, keine ferromagnetischen Gegenstände','Implantate prüfen (Schrittmacher, Clips, Neurostimulatoren)','Lärm (Gehörschutz), Hitze durch Hochfrequenz, Notfall: Patient aus dem Scannerraum bringen']},
  {h:'Elektrokrampftherapie (EKT)', type:'list', items:['Kurze Narkose mit Methohexital, Propofol (antikonvulsiv, kürzere Anfälle), Etomidat oder Esketamin; Relaxierung mit Succinylcholin 0,5–1 mg/kg','Ablauf: parasympathische Phase (Bradykardie, Asystolie) → sympathische Phase (Hypertonie, Tachykardie) → Esmolol/Urapidil','Beißschutz, Hyperventilation vor Stimulation (senkt Krampfschwelle)']},
  {h:'Endoskopie / Interventionelle Radiologie', type:'list', items:['ERCP in Bauchlage: Sedierung mit Propofol, Atemweg schwer zugänglich','Kontrastmittelreaktionen, Strahlenschutz','Neuroradiologische Thrombektomie: Sedierung oder Allgemeinanästhesie, Blutdruckziele nach Neurologie (syst. 140–180 bis Rekanalisation)']}
 ]},
{id:'kardrisiko', t:'Der kardiale Risikopatient', cat:'Spezielle Anästhesie', sum:'KHK, Herzinsuffizienz, pulmonale Hypertonie, Hypertonie, Schrittmacher/ICD.',
 sec:[
  {h:'Myokardischämie vermeiden', type:'list', items:['O₂-Angebot: Koronarperfusionsdruck (diastolischer Druck − LVEDP), Diastolendauer (HF!), Hb, SaO₂','O₂-Bedarf: HF, Kontraktilität, Wandspannung (Vor- und Nachlast)','Tachykardie ist der wichtigste vermeidbare Faktor','MINS: postoperativer Troponinanstieg ohne Symptome, Prognose-relevant → Troponin-Screening bei Risikopatienten (ESC 2022)']},
  {h:'Herzinsuffizienz', type:'list', items:['Dekompensierte Herzinsuffizienz → elektive OP verschieben','HFrEF: Nachlast senken, Kontraktilität erhalten, Volumen vorsichtig','HFpEF: Sinusrhythmus und niedrig-normale HF, ausreichende Vorlast','SGLT2-Hemmer pausieren, ARNI/ACE-Hemmer am OP-Tag meist pausieren']},
  {h:'Pulmonale Hypertonie', type:'list', items:['Hohe perioperative Letalität; RV-Versagen durch PVR-Anstieg','PVR-Anstieg vermeiden: Hypoxie, Hyperkapnie, Azidose, Hypothermie, Schmerz, hoher PEEP, N₂O','RV-Perfusion halten: systemischen Druck > pulmonalen Druck (Noradrenalin, Vasopressin)','Pulmonale Vasodilatatoren fortführen (Sildenafil, Endothelin-Antagonisten, Prostanoide), iNO/inhalative Prostanoide verfügbar']},
  {h:'Schrittmacher, ICD, CRT', type:'list', items:['Präoperativ: Aggregat, Indikation, Abhängigkeit, letzte Kontrolle (≤ 6–12 Monate)','Elektrokauter kann Oversensing verursachen → Schrittmacherabhängige: asynchroner Modus (Magnet bzw. Umprogrammierung)','ICD: antitachykarde Therapie deaktivieren (Magnet oder Programmierer), externen Defibrillator mit Pads anlegen, danach reaktivieren','Bipolare Koagulation bevorzugen, Neutralelektrode fern vom Aggregat']}
 ]},
{id:'pulmrisiko', t:'Der pulmonale Risikopatient', cat:'Spezielle Anästhesie', sum:'Risikoabschätzung, COPD, Asthma, OSAS, Tuberkulose.',
 sec:[
  {h:'Risikofaktoren postoperativer pulmonaler Komplikationen', type:'list', items:['Patient: Alter, ASA ≥ III, COPD, Rauchen, Herzinsuffizienz, OSAS, Anämie, präoperative SpO₂ < 96 % (ARISCAT-Score)','Eingriff: Oberbauch/Thorax, > 2–3 h, Notfall, Allgemeinanästhesie, Restrelaxierung']},
  {h:'COPD', type:'list', items:['Präoperativ optimieren: Bronchodilatatoren, Exazerbation behandeln, Rauchstopp (je früher desto besser, ab 4–8 Wochen deutlicher Effekt)','Regionalanästhesie bevorzugen, wenn möglich; Larynxmaske statt Tubus','Beatmung: niedrige AF, lange Exspiration, permissive Hyperkapnie, Auto-PEEP vermeiden','CO₂-Retainer: O₂-Ziel 88–92 %']},
  {h:'Asthma bronchiale', type:'list', items:['Symptomkontrolle präoperativ; Steroid-Stoß bei schlechter Kontrolle','Einleitung mit Propofol oder Esketamin, tiefe Narkose vor Atemwegsmanipulation, Sevofluran bronchodilatatorisch','Meiden: Histaminfreisetzer (Atracurium, Mivacurium, Morphin), β-Blocker, Thiopental (relativ)','Extubation in tiefer Narkose erwägen']},
  {h:'Obstruktive Schlafapnoe', type:'list', items:['Screening STOP-BANG (≥ 5 hohes Risiko)','CPAP mitbringen und postoperativ nutzen','Opioidsparend, Regionalverfahren, Oberkörperhochlage, verlängerte Überwachung mit kontinuierlicher Oxymetrie']},
  {h:'Tuberkulose', type:'list', items:['Offene TB: elektive Eingriffe verschieben; Notfall mit FFP2/FFP3, Bakterienfilter am Tubus, Einmalmaterial, OP am Programmende']}
 ]},
{id:'nierenleber', t:'Niere & Leber', cat:'Spezielle Anästhesie', sum:'Niereninsuffizienz, Dialyse, AKI-Prävention, Leberzirrhose, Child-Pugh, MELD.',
 sec:[
  {h:'Niereninsuffizienz', type:'list', items:['Präoperativ: Kalium, Volumenstatus, Dialyse am Vortag, Shuntarm schützen (keine Zugänge/RR)','Pharmakologie: Morphin, Pethidin, NMH, Sugammadex (CrCl < 30), Gabapentin anpassen/meiden; bevorzugt Cisatracurium, Remifentanil, Propofol','Succinylcholin nur bei normalem K⁺','Renale Anämie, urämische Thrombozytopathie (Desmopressin)','AKI-Prävention: Hypotonie vermeiden, nephrotoxische Substanzen (NSAR, Kontrastmittel, Aminoglykoside), balancierte Lösungen, KDIGO-Bundle']},
  {h:'Leberzirrhose', type:'table', rows:[['Child-Pugh','Punkte (Bilirubin, Albumin, INR, Aszites, Enzephalopathie)','Perioperative Letalität (Abdominalchirurgie, historisch)'],['A','5–6','~10 %'],['B','7–9','~30 %'],['C','10–15','> 50–80 %']]},
  {h:'Leber – Besonderheiten', type:'list', items:['Hyperdyname Zirkulation (SVR↓), hepatorenales und hepatopulmonales Syndrom, portopulmonale Hypertonie','Gerinnung: „rebalancierte Hämostase“ – INR spiegelt Blutungsrisiko schlecht wider; ROTEM hilfreich','Hypalbuminämie → freie Fraktion ↑; Clearance ↓ für Midazolam, Opioide; Remifentanil, Cisatracurium, Propofol günstig','Ösophagusvarizen: Magensonde vorsichtig; Aszites → Aspirationsrisiko, FRC ↓']}
 ]},
{id:'selten', t:'Seltene & neurologische Erkrankungen', cat:'Spezielle Anästhesie', sum:'Myasthenie, Muskeldystrophien, MS, Parkinson, Epilepsie, HAE, Porphyrie, Querschnitt, Transplantierte, Opioidabhängigkeit.',
 sec:[
  {h:'Übersicht', type:'table', rows:[['Erkrankung','Anästhesierelevanz'],
   ['Myasthenia gravis','Empfindlich für ndMR (10–50 % Dosis), resistent gegen Succinylcholin; Pyridostigmin weiter; Rocuronium + Sugammadex günstig; Nachbeatmung bei schwerer Form; Myasthene vs. cholinerge Krise'],
   ['Lambert-Eaton','Empfindlich für depolarisierende und nicht depolarisierende Relaxanzien'],
   ['Muskeldystrophie Duchenne/Becker','Succinylcholin kontraindiziert (Rhabdomyolyse, Hyperkaliämie), Volatile meiden (MH-ähnliche Reaktionen), Kardiomyopathie'],
   ['Myotone Dystrophie','Succinylcholin → Myotonie; Opioid-/Hypnotikaempfindlichkeit, Kardiomyopathie, Rhythmusstörungen'],
   ['Multiple Sklerose','Hyperthermie verschlechtert Symptome; Succinylcholin bei schwerer Immobilität meiden; Spinalanästhesie umstritten, PDA möglich'],
   ['Morbus Parkinson','L-Dopa nicht unterbrechen; keine D₂-Antagonisten (Metoclopramid, Droperidol, Haloperidol) – Ondansetron, Domperidon ok'],
   ['Epilepsie','Antiepileptika weiter; prokonvulsiv: Hyperventilation, Methohexital, hohe Sevoflurankonzentrationen, Pethidin'],
   ['Hereditäres Angioödem (HAE)','Bradykinin-vermittelt, Adrenalin/Steroide unwirksam; C1-Esterase-Inhibitor 20 IE/kg präoperativ bei Atemwegsmanipulation, Icatibant bereithalten'],
   ['Akute hepatische Porphyrie','Trigger: Barbiturate, Etomidat (unsicher), Enzyminduktoren, Hunger, Stress; sicher: Propofol, Opioide, Relaxanzien, Bupivacain; Attacke: Hämin, Glukose'],
   ['Querschnittlähmung','Oberhalb Th6: autonome Dysreflexie (Hypertonie, Bradykardie bei Reizen unterhalb der Läsion) → Narkose/Spinale auch bei fehlender Sensibilität; Succinylcholin ab 24–72 h kontraindiziert'],
   ['Organtransplantierte','Immunsuppression weiter; denerviertes Herz: keine Reaktion auf Atropin, indirekte Sympathomimetika; Nierentransplantat: Nephrotoxine meiden'],
   ['Opioidabhängigkeit/Substitution','Substitution weiter (Methadon, Buprenorphin), hoher Opioidbedarf, multimodale Analgesie, Esketamin, keine gemischten Agonisten-Antagonisten']]},

RA('ra-grundlagen','Grundlagen der peripheren Regionalanästhesie','Wie Nervenblockaden funktionieren, wie man sie sicher durchführt und was man vorher klären muss.',[
 {h:'Worum geht es?', type:'text', items:['Bei einer peripheren Regionalanästhesie wird ein Lokalanästhetikum (LA) gezielt an einen Nerv, ein Nervengeflecht (Plexus) oder in eine Faszienebene gespritzt, in der Nerven verlaufen. Dadurch werden Schmerz, Berührung und – je nach Konzentration – auch die Motorik in einem umschriebenen Körperabschnitt ausgeschaltet.','Man unterscheidet Nerven- bzw. Plexusblockaden (das LA wird direkt neben dem Nerv abgelegt) und Faszienblockaden („plane blocks“: das LA verteilt sich in einer Faszienschicht, durch die Nerven ziehen). Faszienblockaden brauchen größere Volumina und wirken meist nur analgetisch, nicht chirurgisch anästhesierend.']},
 {h:'Vorteile gegenüber reiner Allgemeinanästhesie', type:'list', items:['Bessere Schmerztherapie in den ersten 12–24 Stunden und geringerer Opioidverbrauch – dadurch weniger Übelkeit, Sedierung und Atemdepression.','Ermöglicht Operationen ohne Narkose (z. B. Handchirurgie in axillärem Block), was bei schwer kranken Patienten die Kreislaufbelastung reduziert.','Frühere Mobilisation und kürzere Aufwachraumzeiten, v. a. bei ambulanten Eingriffen.']},
 {h:'Ortungsverfahren', type:'table', rows:[['Verfahren','Prinzip','Stellenwert'],['Ultraschall','Nerv, Gefäße, Pleura und Nadel werden sichtbar; LA-Ausbreitung wird direkt beobachtet','Heute Standard – weniger Punktionen, weniger Gefäßpunktionen, kleinere Volumina'],['Nervenstimulation','Elektrischer Reiz über die Nadelspitze löst Muskelzuckungen im Versorgungsgebiet aus','Ergänzend zur Sicherheit; eine Reizantwort schon bei sehr niedriger Stromstärke kann auf eine intraneurale Lage hinweisen'],['Landmarken','Tastbare Strukturen (Knochen, Arterie)','Nur noch in Ausnahmefällen']]},
 {h:'Ultraschall: Begriffe', type:'list', items:['In der Ebene (In-plane): Die Nadel liegt in der Schallebene und ist über die ganze Länge sichtbar. Bevorzugt, weil man die Spitze verfolgen kann.','Außerhalb der Ebene (Out-of-plane): Die Nadel kreuzt die Schallebene und ist nur als Punkt sichtbar. Kürzerer Weg, aber die Spitze ist schwerer zu kontrollieren.','Linearer Schallkopf (hohe Frequenz, 6–15 MHz) für oberflächliche Strukturen bis ca. 4–5 cm, konvexer Schallkopf (niedrige Frequenz, 2–5 MHz) für tiefe Blöcke (Ischiadicus proximal, PENG, Quadratus lumborum).','Hydrodissektion: Kleine Mengen (1–2 ml) LA oder NaCl öffnen die Schicht und zeigen, wo die Spitze liegt.']},
 {h:'Sicherer Ablauf', type:'steps', items:['Aufklärung (Ablauf, Versagen, Nervenschaden, LA-Intoxikation, Pneumothorax je nach Block), Gerinnung und Antikoagulanzien prüfen.','Monitoring (EKG, SpO₂, Blutdruck), sicherer i.v.-Zugang, Notfallmedikamente und Lipidemulsion 20 % griffbereit.','Seitenmarkierung prüfen und „Stop before you block“: unmittelbar vor der Punktion Seite laut bestätigen.','Hygiene nach DGAI: Händedesinfektion, Hautdesinfektion mit Einwirkzeit, sterile Schallkopfhülle und steriles Gel; bei Katheteranlage maximale Barrieremaßnahmen.','Injektion langsam und fraktioniert (3–5 ml), regelmäßig aspirieren, Patienten nach Frühsymptomen fragen.','Kein Injizieren gegen hohen Widerstand (> 15 psi) und nie bei Schmerz oder Parästhesie während der Injektion – Hinweis auf intraneurale Lage.','Dokumentation: Verfahren, Nadel, LA, Konzentration, Volumen, Besonderheiten, Wirkungskontrolle.']},
 {h:'Adjuvanzien (Zusätze zum LA)', type:'table', rows:[['Zusatz','Wirkung','Bemerkung'],['Dexamethason','verlängert die Blockdauer um mehrere Stunden','Wirkt perineural und systemisch (i.v.) ähnlich; perineurale Gabe ist off-label'],['Clonidin','verlängert Analgesie','Nebenwirkungen: Sedierung, Hypotonie, Bradykardie'],['Dexmedetomidin','verlängert Block und Analgesie','off-label; Bradykardie, Sedierung'],['Adrenalin 1:200 000','Marker für intravasale Injektion, verzögerte Resorption','Bei Ropivacain kaum Verlängerung']]},
 {h:'Komplikationen', type:'list', items:['Nervenschaden: Vorübergehende Missempfindungen in den ersten Tagen sind nicht selten, bleibende Schäden sind selten. Risikofaktoren: intraneurale Injektion, hoher Injektionsdruck, vorbestehende Neuropathie.','LA-Intoxikation (LAST): v. a. bei großen Volumina, gut durchbluteten Regionen und Kombination mehrerer Blöcke → Gesamtdosis addieren.','Gefäßpunktion, Hämatom, Infektion (v. a. bei Kathetern), Pneumothorax bei thoraxnahen Blöcken.','Blockversagen: Nachblocken (Dosisgrenze beachten), Analgosedierung oder Allgemeinanästhesie.']},
 {h:'Periphere Blockaden unter Antikoagulation', type:'text', items:['Die DGAI-Leitlinie bezieht sich auf rückenmarksnahe Verfahren. Für periphere Blockaden gilt: Oberflächliche, gut komprimierbare Blöcke (z. B. axillär, femoral, poplitealer Ischiadicus) sind auch unter Antikoagulation meist vertretbar. Tiefe, nicht komprimierbare Blöcke (Psoaskompartment, Paravertebralblock, tiefer Zervikalplexus, proximaler Ischiadicus) sollten wie rückenmarksnahe Verfahren behandelt werden.']},
 {h:'Merke', type:'merke', items:['Die Gesamtdosis aller LA (inkl. Wundinfiltration durch den Operateur) zählt – nicht die Dosis pro Block.','Ultraschall senkt die Rate an Gefäßpunktionen und LA-Intoxikationen, verhindert Nervenschäden aber nicht sicher.']}
],[NYS.hyg, NYS.ak, NYS.aagbi, NYS.ue]),

RA('ra-auswahl','Welcher Block für welche Operation?','Übersicht der gebräuchlichen Verfahren nach Operationsgebiet.',[
 {h:'Obere Extremität', type:'table', rows:[['Operation','Verfahren der Wahl','Alternative / Ergänzung'],['Schulter, proximaler Oberarm','Interskalenärer Block','Supraklavikulär (weniger Zwerchfellparese), Suprascapularis-Block'],['Klavikula','Interskalenär + oberflächlicher Zervikalplexus','—'],['Oberarm, Ellenbogen','Supraklavikulär oder infraklavikulär','Axillär (Ellenbogen)'],['Unterarm, Hand','Axillär, infraklavikulär','Distale Nervenblockaden, i.v.-Regionalanästhesie']]},
 {h:'Untere Extremität', type:'table', rows:[['Operation','Verfahren der Wahl','Alternative / Ergänzung'],['Hüft-TEP, hüftnahe Fraktur','PENG-Block, Fascia-iliaca-Block','Spinalanästhesie; Femoralisblock'],['Knie-TEP','Adduktorenkanalblock ± iPACK','Femoralisblock (mehr Kraftverlust)'],['Kreuzband, Kniearthroskopie','Adduktorenkanalblock','—'],['Unterschenkel, Sprunggelenk, Fuß','Poplitealer Ischiadicusblock + N. saphenus','Fußblock (Vorfuß)'],['Oberschenkelamputation','Ischiadicus proximal + Femoralis','Katheter']]},
 {h:'Rumpf und Thoraxwand', type:'table', rows:[['Operation','Verfahren','Bemerkung'],['Thorakotomie, VATS','Thorakale PDA, Paravertebralblock, ESP','Paravertebral ≈ PDA mit weniger Hypotonie'],['Mamma-OP','Pectoralis-Blöcke, Serratus-anterior-Block, Paravertebral','Serratus bei lateraler Thoraxwand'],['Rippenserienfraktur','Serratus-anterior-, ESP- oder Paravertebralblock, PDA','Verbessert Atemmechanik'],['Mittellinienlaparotomie','Rektusscheidenblock (bilateral), PDA','Keine viszerale Analgesie'],['Unterbauch (Sectio, Hernie)','TAP-Block, Ilioinguinalis/Iliohypogastricus','Ergänzend, wenn keine intrathekalen Opioide'],['Nierenchirurgie, Laparoskopie','Quadratus-lumborum-Block, ESP','Evidenz variabel']]},
 {h:'Merke', type:'merke', items:['Faszienblöcke (TAP, Rektusscheide, ESP, QL) sind Teil einer multimodalen Analgesie – sie ersetzen weder die Basisanalgesie noch eine PDA bei großen Oberbaucheingriffen gleichwertig.']}
],[NYS.ue, NYS.le, NYS.trunk, NYS.nom]),

/* ---------- Obere Extremität ---------- */
RA('ra-isk','Interskalenärer Plexusblock','Standardblock für Schulter- und Oberarmchirurgie; fast immer mit einseitiger Zwerchfelllähmung.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Schulter, proximaler Oberarm, Klavikula (mit Zervikalplexus)'],['Blockadegebiet','Schulter und Oberarm (C5–C7); C8–Th1 (Ulnarisseite) meist ausgespart'],['Zielstruktur','Wurzeln/Trunci C5–C6 zwischen M. scalenus anterior und medius'],['Lagerung / Schallkopf','Rückenlage oder Beach-Chair, Kopf zur Gegenseite; linear, quer 3–4 cm oberhalb der Klavikula'],['Volumen Erwachsene','7–15 ml (NYSORA)'],['Kinder','0,5–1,5 mg/kg Ropivacain/Bupivacain (ESRA/ASRA)']]},
 {h:'Anatomie und Prinzip', type:'text', items:['Zwischen vorderem und mittlerem Skalenusmuskel liegen die Wurzeln des Plexus brachialis im Ultraschall als „Ampelzeichen“ (drei übereinanderliegende, echoarme Kreise). Der N. phrenicus verläuft ganz in der Nähe auf dem M. scalenus anterior – deshalb breitet sich das LA fast immer auch dorthin aus.']},
 {h:'Technik', type:'steps', items:['Schallkopf quer auf Höhe des Krikoids medial auf den M. sternocleidomastoideus setzen, A. carotis und V. jugularis darstellen, dann nach lateral gleiten, bis die Skalenuslücke mit den Wurzeln erscheint.','Mit dem Farbdoppler Gefäße (A. vertebralis, A. cervicalis transversa, A. dorsalis scapulae) ausschließen.','Nadel (5 cm, 22 G) in der Ebene von lateral nach medial durch den M. scalenus medius vorschieben.','LA zwischen C5 und C6 injizieren, bis die Wurzeln umspült sind; nicht in die Wurzel selbst spritzen.']},
 {h:'Komplikationen und Nebenwirkungen', type:'list', items:['Zwerchfellparese auf der blockierten Seite in nahezu allen Fällen (Vitalkapazität sinkt um etwa ein Viertel) – bei Gesunden meist unbemerkt, bei schwerer Lungenerkrankung gefährlich.','Horner-Syndrom (Ptosis, Miosis) und Heiserkeit durch Mitblockade von Sympathikus bzw. N. laryngeus recurrens – harmlos, aber aufklären.','Selten: intravasale Injektion (A. vertebralis → sofortiger Krampfanfall schon bei kleinen Mengen), epidurale oder intrathekale Ausbreitung, Pneumothorax.']},
 {h:'Kontraindikationen', type:'list', items:['Kontralaterale Zwerchfellparese oder Recurrensparese.','Schwere COPD bzw. respiratorische Insuffizienz (relativ) – Alternative: supraklavikulärer oder Suprascapularis-Block.']},
 {h:'Merke', type:'merke', items:['Kleinere Volumina (5–10 ml) senken die Häufigkeit der Zwerchfellparese, verhindern sie aber nicht zuverlässig.']}
],[NYS.isk, NYS.ped]),

RA('ra-svk','Supraklavikulärer Plexusblock','„Spinalanästhesie des Arms“: dichter Block für den gesamten Arm distal der Schulter.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Oberarm, Ellenbogen, Unterarm, Hand; Schulter eingeschränkt möglich'],['Blockadegebiet','Gesamte obere Extremität; medialer Oberarm (N. intercostobrachialis) fehlt'],['Zielstruktur','Trunci/Divisionen lateral und oberhalb der A. subclavia auf der 1. Rippe („corner pocket“)'],['Lagerung / Schallkopf','Rückenlage, Kopf zur Gegenseite; linear, parallel oberhalb der Klavikulamitte'],['Volumen Erwachsene','20–25 ml (NYSORA)'],['Kinder','0,5–1,5 mg/kg (ESRA/ASRA)']]},
 {h:'Anatomie und Prinzip', type:'text', items:['Oberhalb des Schlüsselbeins liegt der Plexus als „Weintraubenbündel“ eng gepackt neben der A. subclavia. Weil alle Anteile auf engem Raum liegen, reicht ein mittleres Volumen für einen schnellen, dichten Block des ganzen Arms.']},
 {h:'Technik', type:'steps', items:['Schallkopf in der Fossa supraclavicularis leicht nach kaudal kippen; A. subclavia, 1. Rippe und Pleura darstellen.','Nadel in der Ebene von lateral nach medial; erste Portion in den Winkel zwischen Arterie und 1. Rippe („corner pocket“), dann weitere Portionen in das Bündel.','Pleura während des gesamten Vorschubs sichtbar halten.']},
 {h:'Komplikationen', type:'list', items:['Pneumothorax (selten, kann verzögert auftreten).','Zwerchfellparese seltener als interskalenär, aber möglich.','Gefäßpunktion (A. subclavia, A. cervicalis transversa).']},
 {h:'Merke', type:'merke', items:['Für den medialen Oberarm (Blutsperre) zusätzlich den N. intercostobrachialis subkutan in der Achsel blocken.']}
],[NYS.svk, NYS.ped]),

RA('ra-ikl','Infraklavikulärer Plexusblock','Tiefer, aber gut katheterfähiger Block für Ellenbogen, Unterarm und Hand.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Oberarm distal, Ellenbogen, Unterarm, Hand; gut für Katheter'],['Blockadegebiet','Arm unterhalb der Schulter'],['Zielstruktur','Faszikel um die A. axillaris, Ziel: dorsal der Arterie (6-Uhr-Position)'],['Lagerung / Schallkopf','Rückenlage, Arm 90° abduziert; parasagittal medial des Processus coracoideus'],['Volumen Erwachsene','20–30 ml (NYSORA)'],['Kinder','0,5–1,5 mg/kg (ESRA/ASRA)']]},
 {h:'Anatomie und Prinzip', type:'text', items:['Unter dem M. pectoralis minor liegen der laterale, mediale und hintere Faszikel um die A. axillaris. Eine einzige Injektion hinter der Arterie verteilt sich häufig U-förmig um alle drei Faszikel.']},
 {h:'Technik', type:'steps', items:['Arm abduzieren (hebt die Klavikula, verkürzt die Tiefe).','Schallkopf parasagittal unterhalb der Klavikula; A. axillaris in 3–5 cm Tiefe darstellen.','Nadel in der Ebene von kranial nach kaudal steil zur Rückseite der Arterie führen; LA in mehreren Portionen.']},
 {h:'Komplikationen', type:'list', items:['Gefäßpunktion (A./V. axillaris), Pneumothorax bei zu medialer Nadelführung (selten).','Tiefe Lage – bei Adipositas schwierig.']},
 {h:'Merke', type:'merke', items:['Keine Zwerchfellparese → Alternative für Patienten mit eingeschränkter Lungenfunktion.']}
],[NYS.ikl, NYS.ped]),

RA('ra-ax','Axillärer Plexusblock','Sicherster Plexus-brachialis-Block für Unterarm- und Handchirurgie.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Ellenbogen (distal), Unterarm, Hand'],['Blockadegebiet','Mittlerer Oberarm bis Hand; Deltoideusregion (N. axillaris) nicht'],['Zielstrukturen','N. medianus, N. ulnaris, N. radialis um die A. axillaris; N. musculocutaneus separat zwischen M. biceps und M. coracobrachialis'],['Lagerung / Schallkopf','Arm 90° abduziert; linear quer in der Achsel distal des M. pectoralis major'],['Volumen Erwachsene','15–20 ml gesamt, je Nerv ca. 5–7 ml (NYSORA)'],['Kinder','0,5–1,5 mg/kg (ESRA/ASRA)']]},
 {h:'Anatomie und Prinzip', type:'text', items:['In der Achsel haben sich die Faszikel bereits in die Endnerven geteilt. Man umspült jeden Nerv einzeln. Der N. musculocutaneus hat die Gefäß-Nerven-Scheide oft schon verlassen und muss eigens aufgesucht werden – sonst fehlt die Radialseite des Unterarms.']},
 {h:'Technik', type:'steps', items:['A. axillaris quer darstellen, Venen nur mit wenig Druck darstellen (komprimierbar).','Zuerst dorsal der Arterie injizieren (N. radialis), dann N. medianus und N. ulnaris.','N. musculocutaneus als ovale Struktur im Bindegewebe zwischen Bizeps und Coracobrachialis aufsuchen und separat blocken.']},
 {h:'Vorteile und Komplikationen', type:'list', items:['Kein Risiko für Pneumothorax, Zwerchfellparese oder Wirbelsäulenstrukturen.','Gut komprimierbar – auch unter Antikoagulation vertretbar.','Gefäßpunktion möglich (viele Venen) → häufig aspirieren, langsam injizieren.']},
 {h:'Merke', type:'merke', items:['Fehlt die Wirkung am radialen Unterarm, wurde meist der N. musculocutaneus nicht erfasst.']}
],[NYS.ax, NYS.ped]),

RA('ra-distal','Distale Nervenblockaden am Unterarm und Handgelenk','Einzelne Blockade von N. medianus, N. ulnaris und N. radialis – ideal zur Ergänzung.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Handchirurgie, Nachblocken eines unvollständigen Plexusblocks, Analgesie ohne Lähmung des Arms'],['Zielstrukturen','N. medianus (zwischen oberflächlichen und tiefen Fingerbeugern), N. ulnaris (neben der A. ulnaris), R. superficialis n. radialis (Handgelenk, subkutan)'],['Volumen','je Nerv ca. 3–5 ml'],['Schallkopf','linear, am mittleren Unterarm']]},
 {h:'Prinzip', type:'text', items:['Am Unterarm lassen sich die Nerven im Ultraschall gut verfolgen. Weil die Muskeln des Unterarms schon proximal innerviert werden, bleibt die Kraft weitgehend erhalten – hilfreich, wenn der Patient intraoperativ die Finger bewegen soll (z. B. Sehnenchirurgie).']},
 {h:'Merke', type:'merke', items:['Distale Blocks ersetzen keinen Plexusblock, wenn eine Blutsperre am Oberarm geplant ist.']}
],[NYS.ue]),

RA('ra-ivra','Intravenöse Regionalanästhesie (Bier-Block)','LA in eine Vene der blutleeren, abgebundenen Extremität – kurze Eingriffe an Hand und Unterarm.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Kurze Eingriffe (≤ 1 h) an Hand/Unterarm, z. B. Karpaltunnel, Frakturreposition'],['LA','Prilocain 0,5 % (in Europa bevorzugt) oder Lidocain 0,5 % ca. 3 mg/kg; Arm 30–50 ml'],['Blutsperre','Doppelmanschette, 50–100 mmHg über systolischem Druck'],['Mindestzeit','30 min nach Injektion vor dem Öffnen der Manschette (NYSORA)'],['Maximalzeit','ca. 2 h']]},
 {h:'Technik', type:'steps', items:['Venenverweilkanüle distal am OP-Arm, zweite Kanüle am Gegenarm.','Arm hochlagern und mit Esmarch-Binde auswickeln.','Proximale Manschette aufblasen, LA langsam injizieren.','Nach 25–30 min distale Manschette (im betäubten Bereich) aufblasen und proximale öffnen – weniger Manschettenschmerz.','Am Ende die Manschette nicht vor 30 min und schrittweise (intermittierend) öffnen.']},
 {h:'Cave', type:'cave', items:['Bupivacain ist für den Bier-Block kontraindiziert (tödliche Kardiotoxizität bei Manschettenversagen).','Manschettendefekt oder zu frühes Öffnen → LA-Intoxikation. Lipid 20 % bereithalten.']}
],[NYS.ivra, ['Xylonest – Fachinformation','https://www.fachinfo.de/fi/pdf/004924/xylonest-r-1-xylonest-1-fl-50-ml']])
);

/* ---------- Untere Extremität ---------- */
STANDARDS.push(
RA('ra-fem','N.-femoralis-Block','Klassischer Block für vorderen Oberschenkel und Knie – mit deutlichem Kraftverlust des Quadrizeps.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Femurschaftfraktur, Patella, Quadrizepssehne, Knie-Operationen (heute oft durch Adduktorenkanalblock ersetzt), hüftnahe Fraktur'],['Blockadegebiet','Vorder- und Innenseite des Oberschenkels bis zum Knie, über den N. saphenus ein Streifen an Unterschenkel-Innenseite und Fuß'],['Zielstruktur','N. femoralis lateral der A. femoralis, unter der Fascia iliaca'],['Lagerung / Schallkopf','Rückenlage; linear quer in der Leistenbeuge'],['Volumen Erwachsene','10–15 ml (NYSORA)'],['Kinder','0,5–1,5 mg/kg (ESRA/ASRA)']]},
 {h:'Prinzip', type:'text', items:['Der N. femoralis liegt in der Leiste als flaches, dreieckiges, echoreiches Gebilde lateral der Arterie – aber unter der Fascia iliaca, nicht in der Gefäßscheide. Das LA muss unter diese Faszie gelangen, sonst bleibt der Block aus.']},
 {h:'Komplikationen', type:'list', items:['Quadrizepsschwäche mit Sturzgefahr – Patienten nur mit Begleitung mobilisieren.','Gefäßpunktion, intravasale Injektion.']},
 {h:'Merke', type:'merke', items:['Eine Umspülung des Nervs „rundherum“ ist nicht nötig; entscheidend ist die Lage unter der Fascia iliaca.']}
],[NYS.fem, NYS.ped]),

RA('ra-fi','Fascia-iliaca-Block (infra- und suprainguinal)','Faszienblock unter der Fascia iliaca – einfach, sicher, ideal bei hüftnaher Fraktur.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Analgesie bei Hüft- und Femurfraktur (auch präklinisch/Notaufnahme), Hüft- und Knieeingriffe'],['Erfasste Nerven','N. femoralis (nahezu immer), N. cutaneus femoris lateralis (80–100 %), N. obturatorius unsicher'],['Zielstruktur','Raum zwischen Fascia iliaca und M. iliacus'],['Schallkopf','linear; infrainguinal im lateralen Drittel des Leistenbands, suprainguinal parasagittal oberhalb des Leistenbands'],['Volumen Erwachsene','20–40 ml verdünntes LA (z. B. Ropivacain 0,2 %) (NYSORA)'],['Kinder','ca. 0,7 ml/kg (NYSORA); Faszienblock 0,25–0,75 mg/kg (ESRA/ASRA)']]},
 {h:'Prinzip', type:'text', items:['Statt einen Nerv direkt anzusteuern, wird ein großes Volumen unter die Fascia iliaca gespritzt. Es breitet sich nach medial und kranial aus und erreicht so die Nerven, die die Hüfte versorgen. Der suprainguinale Zugang führt zu einer weiter kranialen Ausbreitung und wirkt nach Hüftoperationen etwas besser.']},
 {h:'Merke', type:'merke', items:['Bei hüftnaher Fraktur verringert ein früher Fascia-iliaca-Block Schmerzen, Opioidbedarf und wahrscheinlich das Delirrisiko.']}
],[NYS.fi, NYS.ped]),

RA('ra-peng','PENG-Block (Pericapsular Nerve Group)','Blockade der Gelenkäste zur vorderen Hüftkapsel – Analgesie ohne relevante Lähmung.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Hüft-TEP, hüftnahe Fraktur'],['Zielstrukturen','Gelenkäste von N. femoralis, N. obturatorius und N. obturatorius accessorius zur vorderen Hüftkapsel'],['Ziel','Faszienebene zwischen Psoassehne und Os ilium zwischen Spina iliaca anterior inferior und Eminentia iliopubica'],['Schallkopf','konvex (2–5 MHz), zunächst quer über der Spina iliaca anterior superior, dann nach kaudal und medial drehen'],['Volumen Erwachsene','15–20 ml (ASRA)'],['Motorik','weitgehend erhalten; bei > 20 ml oder intramuskulärer Ausbreitung Quadrizepsschwäche möglich']]},
 {h:'Prinzip', type:'text', items:['Die vordere Hüftkapsel wird vor allem von Gelenkästen des N. femoralis und des N. obturatorius accessorius versorgt. Diese Äste liegen zwischen Psoassehne und Beckenknochen. Wird das LA dort abgelegt, wird die Hüfte schmerzarm, während die motorischen Hauptäste weitgehend verschont bleiben – das erleichtert die frühe Mobilisation.']},
 {h:'Komplikationen', type:'list', items:['Quadrizepsschwäche bei großem Volumen','Verletzung des N. cutaneus femoris lateralis an der Einstichstelle','Gefäßpunktion (A. femoralis liegt medial)']},
 {h:'Merke', type:'merke', items:['PENG deckt die Haut nicht ab – für den Hautschnitt bei Hüft-TEP ggf. N. cutaneus femoris lateralis oder Infiltration ergänzen.']}
],[NYS.peng]),

RA('ra-add','Adduktorenkanalblock (N. saphenus)','Knie-Analgesie mit weitgehend erhaltener Quadrizepskraft.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Knie-TEP, Kreuzbandplastik, Ergänzung zum poplitealen Block bei Operationen am medialen Unterschenkel/Fuß, Venenstripping'],['Zielstruktur','N. saphenus (und Äste zum Knie) lateral bzw. anterior der A. femoralis unter dem M. sartorius'],['Schallkopf','linear, quer an der Oberschenkel-Innenseite, Übergang mittleres/distales Drittel'],['Volumen Erwachsene','5–10 ml, im Adduktorenkanal bis 20 ml (NYSORA)'],['Kinder','0,5–1,5 mg/kg (ESRA/ASRA)']]},
 {h:'Prinzip', type:'text', items:['Der N. saphenus ist ein rein sensibler Ast des N. femoralis. Im Adduktorenkanal liegen außer ihm nur kleine Äste zum Knie, deshalb bleibt der Quadrizeps weitgehend kräftig. Je weiter proximal (im Femoraldreieck) man spritzt und je größer das Volumen, desto eher wird der Ast zum M. vastus medialis mitblockiert.']},
 {h:'Merke', type:'merke', items:['Möglichst distal injizieren – so bleibt die Motorik für die Physiotherapie erhalten.','Die Kniekehle (hinterer Kapselanteil) wird nicht erfasst → iPACK-Block als Ergänzung.']}
],[NYS.add, NYS.ped]),

RA('ra-ipack','iPACK-Block','Infiltration zwischen A. poplitea und hinterer Kniekapsel zur Analgesie der Kniekehle.',[
 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Knie-TEP, Kreuzbandplastik – ergänzend zum Adduktorenkanalblock'],['Zielstruktur','Raum zwischen A. poplitea und Femur (hintere Kapsel), oberhalb der Femurkondylen'],['Schallkopf','konvex oder linear, quer an der Innenseite des distalen Oberschenkels'],['Volumen Erwachsene','15–20 ml']]},
 {h:'Prinzip', type:'text', items:['Die hintere Kniekapsel wird von Gelenkästen des N. tibialis und N. obturatorius versorgt. Beim iPACK („infiltration between popliteal artery and capsule of the knee“) wird das LA dort flächig verteilt, ohne die Hauptstämme von N. tibialis und N. peronaeus zu blockieren – so bleibt die Fußhebung erhalten.']}
],[NYS.le]),

RA('ra-isch','N.-ischiadicus-Block (proximal)','Blockade des Ischiadicus am Oberschenkel – für Operationen, die den ganzen Unterschenkel oder den hinteren Oberschenkel betreffen.',[

 {h:'Prinzip', type:'text', items:['Der N. ischiadicus ist der dickste Nerv des Körpers und versorgt den Unterschenkel und Fuß außer dem Innenrand (N. saphenus). Proximal liegt er tief – deshalb konvexer Schallkopf und längere Nadel.']},
 {h:'Merke', type:'merke', items:['Als tiefer, nicht komprimierbarer Block unter Antikoagulation zurückhaltend einsetzen.','Ein kompletter Ischiadicusblock lähmt Fußhebung und -senkung → Sturz- und Lagerungsschaden-Gefahr, Ferse polstern.']}
],[NYS.isch, NYS.ped]),

RA('ra-pop','Poplitealer Ischiadicusblock','Standardblock für Sprunggelenk und Fuß – kombiniert mit dem N. saphenus.',[

 {h:'Merke', type:'merke', items:['Für den medialen Knöchel und Unterschenkel zusätzlich den N. saphenus (Adduktorenkanal) blocken.','Nie gegen hohen Widerstand injizieren – intraneurale Injektion.']}

RA('ra-obt','N.-obturatorius-Block','Blockade des Nervs für die Adduktoren – v. a. in der Urologie.',[

 {h:'Auf einen Blick', type:'kv', items:[['Indikation','Vorfuß, Zehen (Hallux valgus, Amputationen)'],['Nerven','N. tibialis (hinter dem Innenknöchel), N. peronaeus profundus (neben der A. dorsalis pedis), N. peronaeus superficialis, N. suralis, N. saphenus (subkutan)'],['Volumen','je Nerv 3–5 ml, tiefe Nerven unter Ultraschall']]},

RA('ra-kinder','Regionalanästhesie bei Kindern & Kaudalblock','Dosierung, Besonderheiten und der häufigste Kinderblock: der Kaudalblock.',[
 {h:'Worum geht es?', type:'text', items:['Bei Kindern werden Regionalverfahren fast immer in Narkose oder tiefer Sedierung angelegt. Nach der BJA-Education-Übersicht ist dieses Vorgehen bei Kindern Standard und sicher. Die Verfahren ergänzen die Narkose und reduzieren Opioide, Übelkeit und Aufwachdelir.']},
 {h:'Kaudalblock – auf einen Blick', type:'kv', items:[['Indikation','Eingriffe unterhalb des Nabels: Leistenhernie, Hypospadie, Orchidopexie, Klumpfuß, Zirkumzision'],['Zugang','Hiatus sacralis zwischen den Cornua sacralia, Seitenlage, Membrana sacrococcygea durchstechen („Klick“)'],['LA','Ropivacain 0,2 % oder (Levo-)Bupivacain 0,25 %'],['Volumen (ESRA/ASRA)','0,5 ml/kg sakral, 1 ml/kg lumbal, 1,25 ml/kg untere thorakale Segmente'],['Höchstdosis','Ropivacain 0,2 % max. 2 mg/kg; Bupivacain 0,25 % max. 2,5 mg/kg'],['Zulassung','Naropin 2 mg/ml: Kaudalblock ab Termingeburt bis 12 J (2 mg/kg in 1 ml/kg)']]},
 {h:'LA-Dosierungen bei Kindern (ESRA/ASRA 2018)', type:'table', rows:[['Verfahren','Empfohlene Dosis'],['Periphere Nervenblockaden obere/untere Extremität','0,5–1,5 mg/kg Ropivacain oder Bupivacain'],['Faszienblöcke (TAP, Rektusscheide, Fascia iliaca)','0,25–0,75 mg/kg'],['Periphere Katheter','0,1–0,3 mg/kg/h (Ropivacain/Bupivacain 0,2 %)'],['Epidural Bolus','lumbal 0,5 ml/kg, thorakal 0,3 ml/kg, Nachinjektion 0,25 ml/kg; max. 1,7 mg/kg'],['Epidural Infusion','< 3 Monate 0,2 mg/kg/h; 3–12 Monate 0,3 mg/kg/h; > 1 J 0,4 mg/kg/h'],['Spinal (Bupivacain)','< 5 kg 1 mg/kg; 5–15 kg 0,4 mg/kg; > 15 kg 0,3 mg/kg'],['Intrathekale Zusätze','Clonidin 1–2 µg/kg, Morphin 10–30 µg/kg']]},
 {h:'Besonderheiten beim Säugling', type:'list', items:['Rückenmark endet bei Neugeborenen erst auf Höhe L3, der Duralsack bei S3–S4 – Punktionshöhe anpassen.','Niedrigere Proteinbindung (weniger saures α₁-Glykoprotein) → höherer freier LA-Anteil, geringere Toleranz für Dauerinfusionen in den ersten Lebensmonaten.','Kaum Blutdruckabfall nach Spinal- oder Kaudalanästhesie bis etwa 6–8 Jahre (unreifes sympathisches Nervensystem).','Testdosis mit Adrenalin (0,5 µg/kg): Anstieg der T-Welle oder der Herzfrequenz spricht für intravasale Lage.']},

// Einführende Erklärungen („Worum geht es?“) – verständlich für das erste Weiterbildungsjahr
const STD_INTRO = {
rsi:'Bei der Ileuseinleitung (Rapid Sequence Induction, RSI) wird die Narkose so schnell eingeleitet, dass zwischen Bewusstseinsverlust und geblocktem Tubus möglichst wenig Zeit vergeht. Ziel ist, dass kein Mageninhalt in die Lunge gelangt, solange die Schutzreflexe ausgeschaltet sind und der Atemweg noch nicht gesichert ist.',
einleitung:'Die Narkoseeinleitung ist die risikoreichste Phase einer Allgemeinanästhesie: Atmung und Kreislauf ändern sich innerhalb von Sekunden. Eine feste Checkliste und immer gleiche Abläufe sorgen dafür, dass nichts vergessen wird und das Team im Problemfall weiß, was zu tun ist.',
atemweg:'Atemwegsmanagement bedeutet, die Sauerstoffversorgung zu jedem Zeitpunkt sicherzustellen – nicht zwingend, einen Tubus zu platzieren. Wer Risikofaktoren vorher erkennt und einen Plan B, C und D bereithält, gerät seltener in eine lebensbedrohliche Situation.',
extubation:'Die Extubation ist ein geplanter Schritt, kein Nebenbei-Ereignis. Viele Atemwegskomplikationen passieren erst beim Aufwachen – deshalb sollte man vor der Extubation genauso strukturiert vorgehen wie bei der Intubation.',
nmm:'Mit dem neuromuskulären Monitoring (Relaxometrie) misst man, wie stark ein Muskelrelaxans noch wirkt. Klinische Zeichen wie Kopfheben sind zu ungenau; eine unbemerkte Restlähmung erhöht das Risiko für Aspiration und Lungenkomplikationen.',
praeop:'Die Prämedikationsvisite dient dazu, Risiken zu erkennen, das Narkoseverfahren zu planen und den Patienten aufzuklären. Nicht jede Untersuchung ist sinnvoll: Entscheidend sind Anamnese, Belastbarkeit und die Größe des Eingriffs.',
spinal:'Bei der Spinalanästhesie wird ein Lokalanästhetikum in den mit Liquor gefüllten Subarachnoidalraum der Lendenwirbelsäule gespritzt. Innerhalb weniger Minuten sind untere Körperhälfte bzw. Beine schmerzfrei und gelähmt – der Patient bleibt dabei wach und atmet selbst.',
pda:'Bei der Periduralanästhesie (PDA) liegt das Lokalanästhetikum außerhalb der Dura im Periduralraum. Sie wirkt langsamer und segmental, lässt sich aber über einen Katheter über Tage fortführen – ideal für Geburtshilfe und große Bauch- oder Thoraxoperationen.',
'antikoag-ra':'Unter gerinnungshemmenden Medikamenten kann eine rückenmarksnahe Punktion eine Blutung im Wirbelkanal verursachen, die das Rückenmark schädigt. Deshalb gelten feste Zeitabstände zwischen der letzten Gabe und der Punktion bzw. dem Katheterzug.',
sectio:'Bei der Sectio caesarea sind zwei Patienten zu versorgen: Mutter und Kind. Die Spinalanästhesie ist Standard, weil sie die Risiken des schwierigen Atemwegs und der Aspiration in der Schwangerschaft umgeht und die Mutter die Geburt wach erlebt.',
kinder:'Kinder sind keine kleinen Erwachsenen: Sie verbrauchen mehr Sauerstoff, haben kleinere Reserven und reagieren anders auf Medikamente. Formeln helfen, Tubusgröße, Flüssigkeitsbedarf und Normwerte schnell abzuschätzen.',
ponv:'Übelkeit und Erbrechen nach der Operation (PONV) gehören zu den häufigsten und für Patienten unangenehmsten Nebenwirkungen einer Narkose. Mit dem Apfel-Score lässt sich das Risiko abschätzen und die Prophylaxe gezielt anpassen.',
transfusion:'Blutprodukte sind wirksame, aber auch risikoreiche Arzneimittel. In Deutschland regeln die Querschnitts-Leitlinien der Bundesärztekammer, wann transfundiert wird und welche Sicherheitsschritte (z. B. Bedside-Test) vorgeschrieben sind.',
beatmung:'Auch gesunde Lungen können durch Beatmung geschädigt werden. Lungenprotektiv beatmen heißt: kleine Atemzugvolumina bezogen auf das ideale Körpergewicht, ausreichend PEEP und möglichst niedrige Drücke.',
scores:'Scores machen Befunde vergleichbar und erleichtern die Kommunikation im Team. In der Prüfung werden die gängigen Einteilungen häufig abgefragt.',
awr:'Im Aufwachraum werden Patienten überwacht, bis Narkose- und Medikamentenwirkungen so weit abgeklungen sind, dass sie sicher auf die Normalstation können. Viele Komplikationen – Atemwegsverlegung, Restrelaxierung, Blutung – zeigen sich genau in dieser Phase.',
schockraum:'Im Schockraum werden schwer verletzte Patienten nach einem festen Schema versorgt. Die Anästhesie übernimmt meist Atemweg, Beatmung, Kreislauf und Gerinnung – die zeitkritischen Entscheidungen fallen in den ersten Minuten.',
neuro:'Das Gehirn liegt in einer starren Schädelkapsel. Steigt der Hirndruck, sinkt die Durchblutung. Neuroanästhesie bedeutet deshalb vor allem: Hirndruck senken, Hirnperfusion sichern und ein rasches Erwachen für die neurologische Beurteilung ermöglichen.',
kardio:'In der Herzchirurgie übernimmt die Herz-Lungen-Maschine zeitweise die Funktion von Herz und Lunge. Die Anästhesie steuert dabei Gerinnung (Heparin, Protamin), Kreislauf und Organschutz – und begleitet die kritische Phase der Entwöhnung von der Maschine.',
klappen:'Bei Herzklappenfehlern hängt die Pumpleistung stark von Herzfrequenz, Vorlast und Nachlast ab. Wer die hämodynamischen Ziele kennt, kann Einleitung und Kreislauftherapie gezielt anpassen.',
thorax:'Für viele Thoraxeingriffe muss eine Lunge kollabiert werden, während die andere allein beatmet wird. Dazu braucht man einen Doppellumentubus oder Bronchusblocker – und eine Strategie für die dabei häufige Hypoxie.',
adipositas:'Bei Adipositas sind Atemweg, Beatmung und Dosierung verändert: Die Sauerstoffreserve ist klein, Medikamente verteilen sich anders. Richtige Lagerung und das passende Bezugsgewicht sind die wichtigsten Stellschrauben.',
bga:'Die Blutgasanalyse zeigt in Minuten, wie es um Oxygenierung, Ventilation und Säure-Basen-Haushalt steht. Mit einer festen Reihenfolge der Auswertung lassen sich auch gemischte Störungen sicher erkennen.',
volumen:'Zu wenig Flüssigkeit gefährdet die Organdurchblutung, zu viel führt zu Ödemen und Organschäden. Heute gibt man Volumen gezielt, wenn der Patient davon profitiert (Volumenreagibilität), statt nach starren Formeln.',
schmerz:'Gute Schmerztherapie beschleunigt die Erholung und senkt Komplikationen. Man kombiniert mehrere Verfahren (multimodal), um Opioide und deren Nebenwirkungen einzusparen.',
blockaden:'Diese Kurzübersicht fasst die gängigen peripheren Blockaden zusammen. Ausführliche Beschreibungen jedes Blocks mit Anatomie, Technik und Dosierung stehen im Bereich Regionalanästhesie.',
sepsis:'Septische Patienten sind oft kreislaufinstabil und vertragen Narkosemittel schlecht. Neben der raschen Herdsanierung ist eine vorsichtige, gut vorbereitete Narkoseeinleitung entscheidend.',
endokrin:'Hormonelle Erkrankungen beeinflussen Stoffwechsel, Kreislauf und Medikamentenwirkung. Wichtig ist vor allem, welche Dauermedikation weitergegeben werden muss und welche Krisen drohen.',
geriatrie:'Ältere Patienten haben geringere Organreserven und reagieren empfindlicher auf Narkosemittel. Ein postoperatives Delir ist häufig und verschlechtert die Prognose – viele Ursachen lassen sich beeinflussen.',
dauermed:'Viele Dauermedikamente sollen perioperativ weitergegeben werden, weil ihr Absetzen gefährlicher ist als die Einnahme. Einige müssen dagegen pausiert werden, weil sie Blutungen, Hypotonie oder Stoffwechselentgleisungen begünstigen.',
risiko:'Die Anästhesie selbst ist heute sehr sicher. Das perioperative Risiko wird vor allem durch Vorerkrankungen, Dringlichkeit und Größe des Eingriffs bestimmt.',
pharmakologie:'Pharmakokinetik beschreibt, was der Körper mit dem Medikament macht (Verteilung, Abbau), Pharmakodynamik, was das Medikament im Körper bewirkt. Beides zusammen erklärt, warum Narkosemittel unterschiedlich schnell wirken und unterschiedlich lange anhalten.',
tiva:'Bei der total intravenösen Anästhesie (TIVA) wird die Narkose nur mit intravenösen Medikamenten aufrechterhalten, meist Propofol und Remifentanil. Zielgesteuerte Pumpen (TCI) berechnen die Infusionsrate für eine gewünschte Konzentration im Blut oder am Wirkort.',
geraete:'Das Narkosegerät dosiert Gase, beatmet und entfernt Kohlendioxid. Wer den Aufbau des Kreissystems versteht, erkennt Fehler schneller und kann Narkosegas sparen.',
monitoring:'Das Basismonitoring (EKG, Pulsoxymetrie, Blutdruck, Kapnographie) ist bei jeder Narkose Pflicht. Je nach Patient und Eingriff kommen invasive Blutdruckmessung, zentraler Venenkatheter und erweiterte Verfahren hinzu.',
neuromon:'Neuromonitoring überwacht die Narkosetiefe und die Funktion von Nervenbahnen während der Operation. Es hilft, eine zu tiefe oder zu flache Narkose sowie operative Nervenschäden zu vermeiden.',
ultraschall:'Ultraschall ist in der Anästhesie zum Alltagswerkzeug geworden: für Gefäßpunktionen, Nervenblockaden und die schnelle Diagnostik von Lunge, Herz und Magen am Patientenbett.',
antibiose:'Die perioperative Antibiotikaprophylaxe senkt Wundinfektionen – aber nur, wenn sie zum richtigen Zeitpunkt gegeben wird. Länger als nötig verabreicht, schadet sie eher (Resistenzen, Nebenwirkungen).',
thermo:'Fast jeder Patient kühlt in Narkose aus, weil Wärme vom Körperkern in die Peripherie umverteilt wird. Schon eine leichte Hypothermie erhöht Blutverlust und Wundinfektionen – Vorwärmen und aktives Wärmen verhindern das.',
lagerung:'Lagerungsschäden sind vermeidbare Komplikationen. Verantwortung, Polsterung und regelmäßige Kontrollen müssen zwischen Anästhesie und Chirurgie klar geregelt sein.',
analgosed:'Bei einer Analgosedierung bleibt der Patient – je nach Tiefe – ansprechbar und atmet selbst. Die Grenze zur Narkose ist fließend, deshalb gelten ähnliche Anforderungen an Überwachung und Personal.',
ambulant:'Bei ambulanten Eingriffen gehen die Patienten am selben Tag nach Hause. Kurz wirksame Medikamente, gute PONV-Prophylaxe und klare Entlassungskriterien sind entscheidend.',
aussen:'Anästhesien außerhalb des OP (MRT, Radiologie, Endoskopie, Psychiatrie) finden oft unter erschwerten Bedingungen statt. Der Standard muss trotzdem dem im OP entsprechen.',
kardrisiko:'Kardiale Komplikationen sind eine Hauptursache perioperativer Todesfälle. Ziel ist, das Gleichgewicht zwischen Sauerstoffangebot und -bedarf des Herzens zu halten – vor allem durch Vermeiden von Tachykardie und Hypotonie.',
pulmrisiko:'Postoperative Lungenkomplikationen (Atelektasen, Pneumonie, respiratorisches Versagen) sind häufig. Gute Vorbereitung, schonende Beatmung und frühe Mobilisation senken das Risiko deutlich.',
nierenleber:'Niere und Leber bauen viele Narkosemittel ab. Bei Funktionsstörungen wirken Medikamente länger oder stärker – und diese Organe sind selbst durch Hypotonie und Toxine gefährdet.',
selten:'Seltene Erkrankungen haben oft spezielle Anästhesierisiken, etwa bei Relaxanzien oder Triggersubstanzen. Wichtig ist, die Besonderheiten vorab nachzuschlagen und gezielt zu planen.',
viszeral:'In der Viszeralchirurgie sind Pneumoperitoneum, Aspirationsrisiko und große Flüssigkeitsverschiebungen typische Themen. Konzepte der beschleunigten Erholung (ERAS) verbessern das Ergebnis.',
gyn:'Gynäkologische Eingriffe betreffen oft junge Frauen mit hohem PONV-Risiko sowie Operationen in besonderer Lagerung. Einige Eingriffe bergen spezifische Risiken wie Flüssigkeitseinschwemmung.',
neugeborenes:'Die meisten Neugeborenen passen sich von allein an das Leben außerhalb des Mutterleibs an. Braucht ein Kind Hilfe, stehen Wärme, Atemwegsöffnung und Beatmung im Vordergrund – Thoraxkompression und Medikamente sind selten nötig.',
urologie:'Typisch für die Urologie sind endoskopische Eingriffe mit Spülflüssigkeit, besondere Lagerungen und ältere Patienten mit Begleiterkrankungen.',
ortho:'In Orthopädie und Unfallchirurgie sind Regionalanästhesie, Blutsperre, Knochenzement und die Versorgung älterer Patienten mit Frakturen zentrale Themen.',
gefaess:'Gefäßpatienten haben fast immer eine Arteriosklerose auch an Herz, Gehirn und Nieren. Die Anästhesie muss die Durchblutung dieser Organe schützen, besonders beim Abklemmen großer Gefäße.',
hno:'In der HNO teilen sich Anästhesie und Operateur den Atemweg. Blutungen, Laser und eingeschränkter Zugang zum Kopf erfordern gute Absprachen.',
auge:'Augenoperationen erfordern Ruhe, einen stabilen Augeninnendruck und die Kenntnis des okulokardialen Reflexes. Viele Eingriffe laufen in Lokalanästhesie mit Anästhesie-Stand-by.',
mkg:'In der Mund-, Kiefer- und Gesichtschirurgie ist der Atemweg oft erschwert – durch Kieferklemme, Schwellung oder Verletzungen. Häufig wird nasal intubiert.',
verbrennung:'Schwere Verbrennungen verändern Kreislauf, Flüssigkeitshaushalt und Pharmakologie über Wochen. Atemweg, Volumentherapie und das Succinylcholin-Verbot sind die wichtigsten anästhesiologischen Punkte.',
recht:'Jede Narkose ist rechtlich ein Eingriff in die körperliche Unversehrtheit und nur mit wirksamer Einwilligung nach Aufklärung erlaubt. Gute Dokumentation schützt Patient und Arzt.',
hygiene:'Infektionen durch Gefäßkatheter, Regionalanästhesie oder kontaminierte Medikamente sind vermeidbar. Händedesinfektion und aseptisches Arbeiten sind die wirksamsten Maßnahmen.'

hypoxie:{patho:'Mechanismen: niedrige inspiratorische O₂-Konzentration, Hypoventilation, Diffusionsstörung, V/Q-Mismatch, Shunt (Atelektasen!), vermindertes HZV und erhöhter O₂-Verbrauch.',

const CARDS = [
// Physiologie & Physik
['phys','Definition MAC?','Minimale alveoläre Konzentration eines Inhalationsanästhetikums, bei der 50 % der Patienten auf einen Hautschnitt nicht mit Abwehrbewegung reagieren (1 atm, Steady State). Immobilität v. a. spinal vermittelt.'],
['phys','Was erhöht, was senkt die MAC?','↑: Kinder (Maximum ~6 Monate), Hyperthermie, Hypernatriämie, chronischer Alkoholabusus, akute Amphetamin-/Kokain-Einnahme.\n↓: Alter (−6 %/Dekade ab 40 J), Schwangerschaft, Hypothermie, Opioide, Benzodiazepine, α₂-Agonisten, akute Alkoholintoxikation, Hyponatriämie, Anämie (Hb < 5), Hypoxämie (paO₂ < 40).'],
['phys','Was sagt der Blut/Gas-Verteilungskoeffizient aus?','Löslichkeit im Blut. Niedriger Koeffizient → schneller Anstieg des alveolären Partialdrucks → schnelle An- und Abflutung (Desfluran 0,42 < N₂O 0,47 < Sevofluran 0,65 < Isofluran 1,4).'],
['phys','Was sagt der Öl/Gas-Koeffizient aus?','Lipidlöslichkeit = Maß der Potenz (Meyer-Overton-Regel): Je höher, desto niedriger die MAC.'],
['phys','Sauerstoffgehalt des Blutes (Formel)?','CaO₂ = (Hb × SaO₂ × 1,34) + (paO₂ × 0,003)\nNormal ≈ 20 ml O₂/dl. 1,34 ml O₂/g Hb = Hüfner-Zahl (praktisch).'],
['phys','O₂-Angebot (DO₂)?','DO₂ = HZV × CaO₂ × 10 ≈ 1000 ml/min (Erwachsene in Ruhe). Verbrauch VO₂ ≈ 250 ml/min (3,5 ml/kg/min).'],
['phys','Alveoläre Gasgleichung?','pAO₂ = FiO₂ × (pB − pH₂O) − paCO₂/RQ\nRaumluft: 0,21 × (760 − 47) − 40/0,8 ≈ 100 mmHg.'],
['phys','Ursachen einer Rechtsverschiebung der O₂-Bindungskurve?','„CADET face right“: CO₂↑, Acidosis (H⁺↑), 2,3-DPG↑, Exercise, Temperatur↑ → P50↑ (normal 26–27 mmHg) → erleichterte O₂-Abgabe im Gewebe (Bohr-Effekt).'],
['phys','Was ist die FRC und wodurch wird sie reduziert?','Funktionelle Residualkapazität = ERV + RV ≈ 30 ml/kg (2,5–3 l). ↓ durch Rückenlage, Narkose (−20 %), Adipositas, Schwangerschaft, Pneumoperitoneum, Kopftief-Lage. Bedeutung: O₂-Reservoir bei Apnoe.'],
['phys','Was ist die Closing Capacity?','Lungenvolumen, bei dem kleine Atemwege zu kollabieren beginnen. Steigt mit Alter; ab ~45 J im Liegen und ~65 J im Stehen > FRC → Shunt, Atelektasen.'],
['phys','Hypoxische pulmonale Vasokonstriktion (HPV)?','Vasokonstriktion in hypoxischen Lungenarealen (Euler-Liljestrand) → Umleitung des Blutes in belüftete Areale, Shunt↓. Hemmung durch Volatile > 1 MAC, Nitrate, Nitroprussid, Ca-Antagonisten, Alkalose.'],
['phys','Totraum nach Bohr?','VD/VT = (paCO₂ − peCO₂)/paCO₂. Normal ~0,3 (anatomisch 2 ml/kg). ↑ bei LAE, Hypovolämie, COPD, hohem PEEP.'],
['phys','Hagen-Poiseuille – Bedeutung in der Anästhesie?','Flow = (π × r⁴ × ΔP)/(8 × η × l). Radius geht in der 4. Potenz ein → kurze, großlumige Kanülen für Volumen; halber Tubusradius = 16-facher Widerstand (laminar).'],
['phys','Warum werden Heliox-Gemische bei Obstruktion eingesetzt?','Bei turbulenter Strömung hängt der Widerstand von der Dichte ab – Helium hat geringe Dichte → weniger Widerstand, eher laminare Strömung (Reynolds-Zahl ↓).'],
['phys','Frank-Starling-Mechanismus?','Zunehmende Vordehnung (enddiastolisches Volumen) → stärkere Kontraktion und Schlagvolumen bis zu einem Optimum (optimale Überlappung von Aktin und Myosin).'],
['phys','Koronarperfusionsdruck?','CPP = diastolischer Aortendruck − LVEDP. Linker Ventrikel wird überwiegend in der Diastole perfundiert → Tachykardie verkürzt die Diastole.'],
['phys','Zerebraler Perfusionsdruck?','CPP = MAP − ICP (bzw. ZVD, wenn höher). Ziel beim SHT 60–70 mmHg. Autoregulation etwa MAP 50/60–150 mmHg.'],
['phys','Effekt von paCO₂ auf die Hirndurchblutung?','CBF ändert sich um ca. 1–2 ml/100 g/min pro mmHg paCO₂ (im Bereich 20–80 mmHg). Hyperventilation senkt ICP kurzfristig, Gefahr Ischämie.'],
['phys','Wie viel O₂ enthält eine 10-l-Flasche bei 200 bar?','Boyle-Mariotte: 10 l × 200 bar = 2000 l O₂. Bei 10 l/min Verbrauch → 200 min.'],
['phys','Wie funktioniert ein Kreissystem und wozu der Atemkalk?','Rückatmung der Exspirationsluft nach CO₂-Absorption (Ca(OH)₂/NaOH → CaCO₃ + H₂O, exotherm). Vorteil: Low-Flow (Gas-, Wärme-, Feuchtigkeitserhalt, weniger Umweltbelastung). Farbindikator zeigt Erschöpfung.'],
['phys','Nachteil von trockenem Atemkalk?','CO-Bildung mit Desfluran (und Isofluran), Compound-A-Bildung mit Sevofluran, Hitzeentwicklung/Brand (Sevofluran + Baralyme).'],
['phys','Definition Shunt vs. Totraum?','Shunt: perfundiert, nicht ventiliert (V/Q = 0) → Hypoxämie, schlecht durch O₂ korrigierbar. Totraum: ventiliert, nicht perfundiert (V/Q = ∞) → Hyperkapnie, etCO₂-paCO₂-Differenz ↑.'],

['pharm','Warum wacht man nach einer Einzeldosis Thiopental schnell auf?','Umverteilung vom ZNS (gut perfundiert) in Muskel und Fett – nicht durch Metabolismus. Bei Repetition Sättigung der Kompartimente → Kumulation.'],
